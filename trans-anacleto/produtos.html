<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos - Trans Anacleto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds.css">
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="ui_components.js"></script>
<script src="shell.js"></script>
<script src="page_bootstrap.js"></script>
<style>
.ean-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.ean-row input[type=text] { flex:1; }
.ean-row .ean-principal { white-space:nowrap; font-size:12px; color:#64748B; }
</style>
</head>
<body class="page-bg">
<div id="shell"></div>
<div id="shell-content" class="content-area page-padding">
  <div id="header-area"></div>
  <div id="filters-area"></div>
  <div class="card"><div class="card-body" id="table-area"><div class="loading-center"><div class="spinner"></div></div></div></div>
</div>

<div id="modal-p" class="modal" style="display:none">
  <div class="modal-overlay" onclick="closePModal()"></div>
  <div class="modal-content" style="max-width:760px">
    <div class="modal-header">
      <h3 id="modal-title">Novo produto</h3>
      <button class="modal-close" onclick="closePModal()">&times;</button>
    </div>
    <div class="modal-body">
      <!-- Tabs: Geral | EANs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="geral" onclick="switchTab('geral')">Geral</button>
        <button class="tab-btn" data-tab="eans" onclick="switchTab('eans')">EANs <span id="tab-eans-count" class="badge badge-default" style="margin-left:4px"></span></button>
      </div>

      <div id="tab-geral" class="tab-panel">
        <form id="form-p" onsubmit="saveP(event)">
          <input type="hidden" id="f-id">
          <div class="form-grid" style="grid-template-columns:repeat(2,1fr)">
            <div class="form-field"><label>SKU *</label><input type="text" id="f-sku" required placeholder="Ex: TA-001"></div>
            <div class="form-field"><label>Categoria *</label><select id="f-categoria" required></select></div>
            <div class="form-field form-field-full"><label>Nome *</label><input type="text" id="f-nome" required></div>
            <div class="form-field"><label>Unidade *</label>
              <select id="f-unidade" required>
                <option value="UN">UN</option><option value="PC">PC</option>
                <option value="CX">CX</option><option value="L">L</option>
                <option value="KG">KG</option><option value="M">M</option>
                <option value="PAR">PAR</option>
              </select>
            </div>
            <div class="form-field"><label>Estoque minimo</label><input type="number" id="f-emin" min="0" step="0.001"></div>
            <div class="form-field"><label>Localizacao</label><input type="text" id="f-loc" placeholder="Ex: A-03-B"></div>
            <div class="form-field"><label>Custo medio</label><input type="number" id="f-custo" min="0" step="0.0001"></div>
            <div class="form-field"><label>Ativo</label>
              <select id="f-ativo"><option value="true">Sim</option><option value="false">Nao</option></select>
            </div>
            <div class="form-field form-field-full"><label>Descricao</label><textarea id="f-desc" rows="2"></textarea></div>
          </div>
        </form>
      </div>

      <div id="tab-eans" class="tab-panel" style="display:none">
        <p class="text-sm text-muted" style="margin-bottom:12px">
          Cada EAN e lido pelo scanner e aponta para <strong>um unico produto</strong>.
          E permitido ter varios EANs (ex: embalagem diferente). Marque o principal.
        </p>
        <div id="eans-list"></div>
        <button type="button" class="btn btn-outline btn-sm" onclick="addEanRow()" style="margin-top:8px">
          + Adicionar EAN
        </button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closePModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveAll()">Salvar</button>
    </div>
  </div>
</div>

<script>
let _prods = [];
let _cats = [];
let _currentEans = []; // {id?, ean, principal, _novo?}
let _deletedEans = []; // ids a deletar
let _ft = ''; let _fcat = ''; let _fativo = 'true';

PageBootstrap.init({
  page: 'produtos',
  title: 'Produtos (SKU)',
  breadcrumb: 'Estoque / Produtos',
  perfisPermitidos: ['admin','almoxarife','gestor'],
  loadData: async () => {
    const [prods, cats, eans] = await Promise.all([
      API.get('trans_produtos?order=nome'),
      API.get('trans_categorias_produto?ativo=eq.true&order=tipo,nome'),
      API.get('trans_produtos_ean?select=id,produto_id,ean,principal&limit=2000')
    ]);
    const eansMap = {};
    (eans.ok ? eans.data : []).forEach(e => {
      if (!eansMap[e.produto_id]) eansMap[e.produto_id] = [];
      eansMap[e.produto_id].push(e);
    });
    return { prods: prods.ok ? prods.data : [], cats: cats.ok ? cats.data : [], eansMap };
  },
  render: (data, user) => {
    _prods = data.prods.map(p => ({ ...p, eans: data.eansMap[p.id] || [] }));
    _cats = data.cats;
    renderHeader(user); renderFilters(); renderTable();
  }
});

function renderHeader(user) {
  const canCreate = ['admin','almoxarife'].includes(user.perfil);
  document.getElementById('header-area').innerHTML = UI.pageHeader({
    title: 'Produtos (SKU)',
    subtitle: 'Catalogo mestre. SKU identifica o item; EANs sao lidos por scanner. Pneus tem schema proprio em /pneus.',
    actions: canCreate ? [{ label: 'Novo produto', class: 'btn-primary', onclick: 'openPModal()' }] : []
  });
}

function renderFilters() {
  document.getElementById('filters-area').innerHTML = UI.filterBar({
    filters: [
      { id: 'flt-texto', label: 'Buscar', type: 'text', placeholder: 'SKU, nome ou EAN', value: _ft },
      { id: 'flt-cat', label: 'Categoria', type: 'select', value: _fcat, options: [
        { value: '', label: 'Todas' },
        ..._cats.map(c => ({ value: c.id, label: `${c.nome} (${c.tipo})` }))
      ]},
      { id: 'flt-ativo', label: 'Status', type: 'select', value: _fativo, options: [
        { value: 'true', label: 'Ativos' }, { value: 'false', label: 'Inativos' }, { value: '', label: 'Todos' }
      ]}
    ],
    onApply: 'aplicarFiltros()',
    onClear: 'limparFiltros()'
  });
}

function aplicarFiltros() {
  _ft = document.getElementById('flt-texto').value.trim().toLowerCase();
  _fcat = document.getElementById('flt-cat').value;
  _fativo = document.getElementById('flt-ativo').value;
  renderTable();
}
function limparFiltros() { _ft = ''; _fcat = ''; _fativo = ''; renderFilters(); renderTable(); }

function renderTable() {
  const catMap = {};
  _cats.forEach(c => catMap[c.id] = c);
  const filtrados = _prods.filter(p => {
    if (_fcat && p.categoria_id !== _fcat) return false;
    if (_fativo !== '' && String(p.ativo) !== _fativo) return false;
    if (_ft) {
      const eansStr = (p.eans || []).map(e => e.ean).join(' ');
      const hay = `${p.sku} ${p.nome} ${eansStr}`.toLowerCase();
      if (!hay.includes(_ft)) return false;
    }
    return true;
  });

  document.getElementById('table-area').innerHTML = UI.dataTable({
    columns: [
      { key: 'sku', label: 'SKU', render: p => `<code>${API.esc(p.sku)}</code>` },
      { key: 'nome', label: 'Nome', render: p => `<strong>${API.esc(p.nome)}</strong>` },
      { key: 'cat', label: 'Categoria', render: p => API.esc(catMap[p.categoria_id]?.nome || '&mdash;') },
      { key: 'unidade', label: 'UN', render: p => p.unidade || '&mdash;' },
      { key: 'eans', label: 'EANs', render: p => {
          if (!p.eans || !p.eans.length) return '<span class="text-muted">&mdash;</span>';
          return p.eans.map(e => `<code style="font-size:11px">${API.esc(e.ean)}</code>${e.principal ? ' <span class="badge badge-info" style="font-size:10px">P</span>' : ''}`).join('<br>');
        } },
      { key: 'emin', label: 'Min', align: 'right', render: p => API.fmtNum(p.estoque_min, 0) },
      { key: 'loc', label: 'Local', render: p => API.esc(p.localizacao || '&mdash;') },
      { key: 'status', label: 'Status', render: p => UI.statusBadge(p.ativo ? 'ativo' : 'inativo', p.ativo ? 'ativo' : 'muted') },
      { key: 'acoes', label: '', render: p => `<button class="btn btn-ghost btn-sm" onclick="openPModal('${p.id}')">Editar</button>` }
    ],
    rows: filtrados,
    emptyMsg: 'Nenhum produto cadastrado. Crie categorias primeiro e depois produtos com SKU unico.'
  });
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-geral').style.display = tab === 'geral' ? '' : 'none';
  document.getElementById('tab-eans').style.display = tab === 'eans' ? '' : 'none';
}

function renderEansList() {
  const html = _currentEans.map((e, i) => `
    <div class="ean-row" data-idx="${i}">
      <input type="text" placeholder="EAN / codigo de barras" value="${API.esc(e.ean || '')}"
             oninput="_currentEans[${i}].ean = this.value; _currentEans[${i}]._touched=true">
      <label class="ean-principal">
        <input type="radio" name="ean-principal" ${e.principal ? 'checked' : ''} onchange="setPrincipal(${i})"> principal
      </label>
      <button type="button" class="btn btn-ghost btn-sm" onclick="removeEan(${i})" title="Remover">&times;</button>
    </div>
  `).join('');
  document.getElementById('eans-list').innerHTML = html || '<p class="text-muted" style="font-size:13px">Nenhum EAN vinculado. Adicione para permitir leitura por scanner.</p>';
  document.getElementById('tab-eans-count').textContent = _currentEans.length || '';
  document.getElementById('tab-eans-count').style.display = _currentEans.length ? '' : 'none';
}

function addEanRow() {
  _currentEans.push({ ean: '', principal: _currentEans.length === 0, _novo: true });
  renderEansList();
}
function setPrincipal(idx) {
  _currentEans.forEach((e, i) => e.principal = (i === idx));
  renderEansList();
}
function removeEan(idx) {
  const e = _currentEans[idx];
  if (e.id) _deletedEans.push(e.id);
  _currentEans.splice(idx, 1);
  if (_currentEans.length && !_currentEans.some(x => x.principal)) _currentEans[0].principal = true;
  renderEansList();
}

function openPModal(id) {
  document.getElementById('modal-title').textContent = id ? 'Editar produto' : 'Novo produto';
  document.getElementById('f-id').value = id || '';
  document.getElementById('modal-p').style.display = 'flex';
  switchTab('geral');
  _deletedEans = [];

  // Popular categorias
  const cs = document.getElementById('f-categoria');
  cs.innerHTML = _cats.map(c => `<option value="${c.id}">${API.esc(c.nome)} (${c.tipo})</option>`).join('');

  if (id) {
    const p = _prods.find(x => x.id === id);
    if (p) {
      document.getElementById('f-sku').value = p.sku;
      document.getElementById('f-nome').value = p.nome;
      document.getElementById('f-categoria').value = p.categoria_id;
      document.getElementById('f-unidade').value = p.unidade || 'UN';
      document.getElementById('f-emin').value = p.estoque_min || 0;
      document.getElementById('f-loc').value = p.localizacao || '';
      document.getElementById('f-custo').value = p.custo_medio || 0;
      document.getElementById('f-ativo').value = String(p.ativo);
      document.getElementById('f-desc').value = p.descricao || '';
      _currentEans = (p.eans || []).map(e => ({ ...e }));
    }
  } else {
    document.getElementById('form-p').reset();
    document.getElementById('f-ativo').value = 'true';
    document.getElementById('f-unidade').value = 'UN';
    _currentEans = [];
  }
  renderEansList();
}

function closePModal() { document.getElementById('modal-p').style.display = 'none'; }

async function saveAll() {
  const form = document.getElementById('form-p');
  if (!form.reportValidity()) { switchTab('geral'); return; }

  const id = document.getElementById('f-id').value;
  const payload = {
    sku: document.getElementById('f-sku').value.trim(),
    nome: document.getElementById('f-nome').value.trim(),
    categoria_id: document.getElementById('f-categoria').value,
    unidade: document.getElementById('f-unidade').value,
    estoque_min: parseFloat(document.getElementById('f-emin').value) || 0,
    localizacao: document.getElementById('f-loc').value.trim() || null,
    custo_medio: parseFloat(document.getElementById('f-custo').value) || 0,
    ativo: document.getElementById('f-ativo').value === 'true',
    descricao: document.getElementById('f-desc').value.trim() || null
  };

  let prodId = id;
  let res;
  if (id) {
    res = await API.patch(`trans_produtos?id=eq.${id}`, payload);
  } else {
    res = await API.post('trans_produtos', payload, 'return=representation');
    if (res.ok && Array.isArray(res.data) && res.data.length) prodId = res.data[0].id;
  }
  if (!res.ok) { UI.toast(res.error || 'Erro ao salvar produto', 'erro'); return; }

  // Deletar EANs removidos
  for (const delId of _deletedEans) {
    await API.del(`trans_produtos_ean?id=eq.${delId}`);
  }

  // Upsert EANs (1 por 1 para capturar erros individuais de unique)
  let eanErrors = 0;
  for (const e of _currentEans) {
    const ean = (e.ean || '').trim();
    if (!ean) continue;
    if (e.id) {
      const r = await API.patch(`trans_produtos_ean?id=eq.${e.id}`, { ean, principal: !!e.principal });
      if (!r.ok) eanErrors++;
    } else {
      const r = await API.post('trans_produtos_ean', { produto_id: prodId, ean, principal: !!e.principal });
      if (!r.ok) eanErrors++;
    }
  }

  if (eanErrors) UI.toast(`Produto salvo, ${eanErrors} EAN(s) com erro (duplicado?)`, 'erro');
  else UI.toast(id ? 'Produto atualizado' : 'Produto criado', 'ok');

  closePModal();
  // Reload
  const [prodsR, eansR] = await Promise.all([
    API.get('trans_produtos?order=nome'),
    API.get('trans_produtos_ean?select=id,produto_id,ean,principal&limit=2000')
  ]);
  const eansMap = {};
  (eansR.ok ? eansR.data : []).forEach(e => {
    if (!eansMap[e.produto_id]) eansMap[e.produto_id] = [];
    eansMap[e.produto_id].push(e);
  });
  _prods = (prodsR.ok ? prodsR.data : []).map(p => ({ ...p, eans: eansMap[p.id] || [] }));
  renderTable();
}
</script>
</body>
</html>
