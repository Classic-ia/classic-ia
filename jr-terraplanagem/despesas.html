<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Despesas - JR Terraplanagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds.css">
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="ui_components.js"></script>
<script src="shell.js"></script>
<script src="page_bootstrap.js"></script>
<style>
.d-table { width:100%; border-collapse:collapse; font-size:13px; }
.d-table th, .d-table td { padding:10px 12px; text-align:left; border-bottom:1px solid #E2E8F0; }
.d-table th { background:#F8FAFC; font-weight:600; color:#475569; font-size:12px; text-transform:uppercase; letter-spacing:0.03em; }
.d-table tr:hover { background:#FEF3C7; }
.d-table .right { text-align:right; font-variant-numeric:tabular-nums; }
.d-table .num-os { font-family:ui-monospace,monospace; color:#D97706; font-weight:600; text-decoration:none; }
.d-table .num-small { font-family:ui-monospace,monospace; font-size:12px; color:#64748B; }
.d-table .v-money { font-weight:600; color:#DC2626; }
.tipo-badge { padding:3px 10px; border-radius:999px; font-size:11px; font-weight:600; }
.t-peca { background:#EFF6FF; color:#1E40AF; }
.t-manutencao { background:#FEF3C7; color:#92400E; }
.t-servico { background:#FCE7F3; color:#9D174D; }
.t-combustivel { background:#FEE2E2; color:#991B1B; }
.t-mao_de_obra { background:#ECFDF5; color:#065F46; }
.t-aluguel { background:#F3E8FF; color:#6B21A8; }
.t-outros { background:#F1F5F9; color:#475569; }

.filter-row { display:flex; gap:12px; align-items:end; flex-wrap:wrap; margin-bottom:16px; }
.filter-field { display:flex; flex-direction:column; gap:4px; }
.filter-field label { font-size:12px; font-weight:500; color:#475569; }
.filter-field input, .filter-field select {
  padding:8px 12px; border:1px solid #CBD5E1; border-radius:6px;
  font-size:13px; font-family:inherit; background:#fff; min-width:140px;
}
.summary-row { display:flex; gap:16px; margin-bottom:18px; }
.summary-card { flex:1; background:#fff; border:1px solid #E2E8F0; border-radius:10px; padding:14px 18px; }
.summary-label { font-size:11px; color:#64748B; text-transform:uppercase; letter-spacing:0.05em; font-weight:600; }
.summary-value { font-size:22px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
.empty-state { text-align:center; padding:40px; color:#64748B; }
.modal-form .fr { margin-bottom:14px; }
.modal-form .fr-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
.modal-form label { display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px; }
.modal-form input, .modal-form select, .modal-form textarea {
  width:100%; padding:9px 12px; border:1px solid #CBD5E1; border-radius:6px;
  font-size:13px; font-family:inherit; background:#fff; box-sizing:border-box;
}
.modal-form textarea { min-height:60px; resize:vertical; }
</style>
</head>
<body class="page-bg">

<div id="shell"></div>
<div id="shell-content" class="content-area page-padding">

  <div class="card">
    <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <h3>Despesas</h3>
        <p class="text-sm text-muted">Pecas, manutencao, combustivel, servicos externos, aluguel.</p>
      </div>
      <div style="display:flex;gap:8px;">
        <button id="btn-export" class="btn" style="padding:9px 16px;border:1px solid #CBD5E1;background:#fff;color:#475569;border-radius:8px;font-size:13px;cursor:pointer;">Exportar CSV</button>
        <button id="btn-nova" class="btn" style="background:#D97706;color:#fff;padding:9px 18px;border-radius:8px;font-weight:600;font-size:13px;border:none;cursor:pointer;">+ Nova Despesa</button>
      </div>
    </div>
    <div class="card-body">

      <div class="summary-row">
        <div class="summary-card"><div class="summary-label">Total</div><div class="summary-value" id="s-total" style="color:#DC2626;">—</div></div>
        <div class="summary-card"><div class="summary-label">Lancamentos</div><div class="summary-value" id="s-count" style="color:#1E293B;">0</div></div>
        <div class="summary-card"><div class="summary-label">Vinculadas a OS</div><div class="summary-value" id="s-os" style="color:#D97706;">0</div></div>
        <div class="summary-card"><div class="summary-label">Overhead</div><div class="summary-value" id="s-over" style="color:#64748B;">0</div></div>
      </div>

      <div class="filter-row">
        <div class="filter-field"><label>Buscar</label><input type="text" id="f-q" placeholder="descricao, NF, OS..."></div>
        <div class="filter-field"><label>Tipo</label>
          <select id="f-tipo">
            <option value="">Todos</option>
            <option value="peca">Peca</option>
            <option value="manutencao">Manutencao</option>
            <option value="combustivel">Combustivel</option>
            <option value="servico">Servico</option>
            <option value="mao_de_obra">Mao de obra</option>
            <option value="aluguel">Aluguel</option>
            <option value="outros">Outros</option>
          </select>
        </div>
        <div class="filter-field"><label>Maquina</label><select id="f-maquina"><option value="">Todas</option></select></div>
        <div class="filter-field"><label>De</label><input type="date" id="f-ini"></div>
        <div class="filter-field"><label>Ate</label><input type="date" id="f-fim"></div>
        <button id="btn-limpar" class="btn" style="padding:8px 14px;border:1px solid #CBD5E1;background:#fff;color:#475569;border-radius:6px;font-size:13px;cursor:pointer;">Limpar</button>
      </div>

      <div id="list-area">
        <div style="padding:30px;text-align:center;color:#64748B;">Carregando...</div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Nova Despesa -->
<div id="modal-nova" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;max-width:560px;width:92%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);">
    <div style="padding:16px 22px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;">
      <h3 style="margin:0;font-size:16px;font-weight:600;color:#1E293B;">Nova Despesa</h3>
      <button onclick="fecharNova()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#64748B;">&times;</button>
    </div>
    <div class="modal-form" style="padding:20px 22px;">
      <div class="fr-2">
        <div><label>Data *</label><input type="date" id="n-data"></div>
        <div><label>Tipo *</label>
          <select id="n-tipo">
            <option value="peca">Peca</option>
            <option value="manutencao">Manutencao</option>
            <option value="combustivel">Combustivel</option>
            <option value="servico">Servico</option>
            <option value="mao_de_obra">Mao de obra</option>
            <option value="aluguel">Aluguel</option>
            <option value="outros">Outros</option>
          </select>
        </div>
      </div>
      <div class="fr-2">
        <div><label>Valor *</label><input type="number" step="0.01" id="n-valor" placeholder="0,00"></div>
        <div><label>Fornecedor</label><select id="n-forn"><option value="">—</option></select></div>
      </div>
      <div class="fr-2">
        <div><label>Maquina</label><select id="n-maquina"><option value="">—</option></select></div>
        <div><label>OS (vincular)</label><select id="n-os"><option value="">—</option></select></div>
      </div>
      <div class="fr-2">
        <div><label>Numero NF</label><input type="text" id="n-nfnum"></div>
        <div><label>Chave NFe (44 dig.)</label><input type="text" id="n-nfchave"></div>
      </div>
      <div class="fr"><label>Descricao</label><textarea id="n-desc" placeholder="Detalhes da despesa"></textarea></div>
    </div>
    <div style="padding:14px 22px;border-top:1px solid #E2E8F0;display:flex;justify-content:flex-end;gap:8px;">
      <button onclick="fecharNova()" style="padding:9px 16px;border:1px solid #CBD5E1;background:#fff;color:#475569;border-radius:6px;font-size:13px;cursor:pointer;">Cancelar</button>
      <button id="btn-salvar" onclick="salvar()" style="padding:9px 20px;background:#D97706;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;">Salvar</button>
    </div>
  </div>
</div>

<script>
let todos = [];
let maquinas = [];
let fornecedores = [];
let osList = [];

(async () => {
  await PageBootstrap.init({
    page: 'despesas',
    title: 'Despesas',
    breadcrumb: 'Operacao > Despesas',
    perfisPermitidos: ['admin', 'gestor', 'financeiro', 'operador'],
    loadData: async () => {
      const [rD, rM, rF, rO] = await Promise.all([
        API.get('v_jr_despesas_detalhado?select=*&order=data.desc,created_at.desc&limit=2000'),
        API.get('jr_maquinas?select=id,codigo,descricao&order=codigo'),
        API.get('jr_fornecedores?select=id,razao_social&order=razao_social'),
        API.get('jr_ordens_servico?select=id,numero_os,cliente_id&status=in.(aberta,em_execucao)&order=numero_os.desc&limit=500'),
      ]);
      return {
        despesas: rD.ok ? rD.data : [],
        maquinas: rM.ok ? rM.data : [],
        fornecedores: rF.ok ? rF.data : [],
        os: rO.ok ? rO.data : [],
      };
    },
    render: (d) => {
      todos = d.despesas;
      maquinas = d.maquinas;
      fornecedores = d.fornecedores;
      osList = d.os;
      preencherSelects();
      aplicarFiltros();
    }
  });

  ['f-q','f-tipo','f-maquina','f-ini','f-fim'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener(el.tagName === 'SELECT' || el.type === 'date' ? 'change' : 'input', aplicarFiltros);
  });
  document.getElementById('btn-limpar').addEventListener('click', () => {
    ['f-q','f-tipo','f-maquina','f-ini','f-fim'].forEach(id => document.getElementById(id).value = '');
    aplicarFiltros();
  });
  document.getElementById('btn-nova').addEventListener('click', abrirNova);
  document.getElementById('btn-export').addEventListener('click', exportarCsv);
})();

function preencherSelects() {
  const optMaq = '<option value="">—</option>' + maquinas.map(m => `<option value="${m.id}">${API.esc(m.codigo)} - ${API.esc(m.descricao)}</option>`).join('');
  document.getElementById('n-maquina').innerHTML = optMaq;
  document.getElementById('f-maquina').innerHTML = '<option value="">Todas</option>' + maquinas.map(m => `<option value="${m.id}">${API.esc(m.codigo)}</option>`).join('');
  document.getElementById('n-forn').innerHTML = '<option value="">—</option>' + fornecedores.map(f => `<option value="${f.id}">${API.esc(f.razao_social)}</option>`).join('');
  document.getElementById('n-os').innerHTML = '<option value="">—</option>' + osList.map(o => `<option value="${o.id}">${API.esc(o.numero_os)}</option>`).join('');
}

function aplicarFiltros() {
  const q = (document.getElementById('f-q').value || '').toLowerCase().trim();
  const tipo = document.getElementById('f-tipo').value;
  const maq = document.getElementById('f-maquina').value;
  const ini = document.getElementById('f-ini').value;
  const fim = document.getElementById('f-fim').value;

  let lista = todos.slice();
  if (q) lista = lista.filter(d =>
    (d.descricao || '').toLowerCase().includes(q) ||
    (d.numero_os || '').toLowerCase().includes(q) ||
    (d.nota_fiscal_numero || '').toLowerCase().includes(q) ||
    (d.maquina_codigo || '').toLowerCase().includes(q) ||
    (d.fornecedor_nome || '').toLowerCase().includes(q)
  );
  if (tipo) lista = lista.filter(d => d.tipo === tipo);
  if (maq) lista = lista.filter(d => d.maquina_id === maq);
  if (ini) lista = lista.filter(d => d.data >= ini);
  if (fim) lista = lista.filter(d => d.data <= fim);

  renderResumo(lista);
  renderTabela(lista);
}

function renderResumo(lista) {
  const total = lista.reduce((a,d) => a + (Number(d.valor) || 0), 0);
  const comOs = lista.filter(d => d.os_id).length;
  document.getElementById('s-total').textContent = API.fmtMoeda(total);
  document.getElementById('s-count').textContent = lista.length;
  document.getElementById('s-os').textContent = comOs;
  document.getElementById('s-over').textContent = lista.length - comOs;
}

function renderTabela(lista) {
  const area = document.getElementById('list-area');
  if (!lista.length) { area.innerHTML = '<div class="empty-state">Nenhuma despesa encontrada.</div>'; return; }
  const podeRem = ['admin','gestor'].includes(API.getPerfil());

  let html = '<div style="overflow-x:auto;"><table class="d-table"><thead><tr>';
  html += '<th>Data</th><th>Tipo</th><th>Descricao</th><th>Maquina</th><th>OS</th><th>Fornecedor</th><th>NF</th><th class="right">Valor</th>';
  if (podeRem) html += '<th></th>';
  html += '</tr></thead><tbody>';
  lista.forEach(d => {
    html += `<tr>
      <td>${API.fmtData(d.data)}</td>
      <td><span class="tipo-badge t-${d.tipo}">${API.esc(d.tipo.replace('_',' '))}</span></td>
      <td style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${API.esc(d.descricao || '—')}</td>
      <td class="num-small">${API.esc(d.maquina_codigo || '—')}</td>
      <td>${d.numero_os ? `<a href="os_ficha.html?id=${encodeURIComponent(d.os_id)}" class="num-os">${API.esc(d.numero_os)}</a>` : '—'}</td>
      <td>${API.esc(d.fornecedor_nome || '—')}</td>
      <td class="num-small">${API.esc(d.nota_fiscal_numero || '—')}</td>
      <td class="right v-money">${API.fmtMoeda(d.valor)}</td>`;
    if (podeRem) html += `<td><button onclick="remover('${d.id}')" style="background:none;border:none;color:#DC2626;cursor:pointer;font-size:14px;">&times;</button></td>`;
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  area.innerHTML = html;
}

function abrirNova() {
  if (!API.canAccess('registrar_despesa')) { UI.toast('Sem permissao', 'err'); return; }
  document.getElementById('n-data').value = new Date().toISOString().slice(0,10);
  document.getElementById('n-tipo').value = 'peca';
  document.getElementById('n-valor').value = '';
  document.getElementById('n-forn').value = '';
  document.getElementById('n-maquina').value = '';
  document.getElementById('n-os').value = '';
  document.getElementById('n-nfnum').value = '';
  document.getElementById('n-nfchave').value = '';
  document.getElementById('n-desc').value = '';
  document.getElementById('modal-nova').style.display = 'flex';
}

function fecharNova() { document.getElementById('modal-nova').style.display = 'none'; }

async function salvar() {
  const data = document.getElementById('n-data').value;
  const tipo = document.getElementById('n-tipo').value;
  const valor = parseFloat(document.getElementById('n-valor').value);
  if (!data) { UI.toast('Data obrigatoria', 'err'); return; }
  if (isNaN(valor) || valor < 0) { UI.toast('Valor invalido', 'err'); return; }

  const btn = document.getElementById('btn-salvar');
  btn.disabled = true; btn.textContent = '...';

  const r = await API.rpc('jr_despesa_registrar', {
    p_data: data,
    p_tipo: tipo,
    p_valor: valor,
    p_descricao: document.getElementById('n-desc').value.trim() || null,
    p_maquina_id: document.getElementById('n-maquina').value || null,
    p_os_id: document.getElementById('n-os').value || null,
    p_fornecedor_id: document.getElementById('n-forn').value || null,
    p_nota_fiscal_numero: document.getElementById('n-nfnum').value.trim() || null,
    p_nf_chave: document.getElementById('n-nfchave').value.trim() || null,
  });

  btn.disabled = false; btn.textContent = 'Salvar';

  if (!r.ok) { UI.toast('Erro: ' + (r.error || ''), 'err'); return; }
  UI.toast('Despesa registrada', 'ok');
  fecharNova();
  await recarregar();
}

async function remover(id) {
  if (!confirm('Remover esta despesa?')) return;
  const r = await API.rpc('jr_despesa_remover', { p_despesa_id: id });
  if (!r.ok) { UI.toast('Erro: ' + (r.error || ''), 'err'); return; }
  UI.toast('Despesa removida', 'ok');
  await recarregar();
}

async function recarregar() {
  const r = await API.get('v_jr_despesas_detalhado?select=*&order=data.desc,created_at.desc&limit=2000');
  if (r.ok) { todos = r.data; aplicarFiltros(); }
}

function exportarCsv() {
  const lista = filtrarAtual();
  if (!lista.length) { UI.toast('Nada para exportar', 'warn'); return; }
  const cols = ['data','tipo','valor','descricao','maquina','os','fornecedor','nf_numero','nf_chave'];
  const rows = lista.map(d => [
    d.data || '',
    d.tipo || '',
    String(Number(d.valor || 0).toFixed(2)).replace('.', ','),
    (d.descricao || '').replace(/[\r\n]+/g, ' '),
    d.maquina_codigo || '',
    d.numero_os || '',
    d.fornecedor_nome || '',
    d.nota_fiscal_numero || '',
    d.nf_chave || '',
  ]);
  baixarCsv('despesas', cols, rows);
}

function filtrarAtual() {
  const q = (document.getElementById('f-q').value || '').toLowerCase().trim();
  const tipo = document.getElementById('f-tipo').value;
  const maq = document.getElementById('f-maquina').value;
  const ini = document.getElementById('f-ini').value;
  const fim = document.getElementById('f-fim').value;
  let lista = todos.slice();
  if (q) lista = lista.filter(d => (d.descricao || '').toLowerCase().includes(q) || (d.numero_os || '').toLowerCase().includes(q) || (d.nota_fiscal_numero || '').toLowerCase().includes(q) || (d.maquina_codigo || '').toLowerCase().includes(q) || (d.fornecedor_nome || '').toLowerCase().includes(q));
  if (tipo) lista = lista.filter(d => d.tipo === tipo);
  if (maq) lista = lista.filter(d => d.maquina_id === maq);
  if (ini) lista = lista.filter(d => d.data >= ini);
  if (fim) lista = lista.filter(d => d.data <= fim);
  return lista;
}

function baixarCsv(nome, cols, rows) {
  const csv = [cols.join(';')].concat(rows.map(r => r.map(v => {
    const s = String(v);
    return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(';'))).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${nome}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  UI.toast(`${rows.length} registros exportados`, 'ok');
}
</script>
</body>
</html>
