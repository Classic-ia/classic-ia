<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic RH &amp; SST - Custos de Transporte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds.css">
<script src="config.js"></script>
<script src="rh_auth.js"></script>
<script src="api.js"></script>
<script src="ui_components.js"></script>
<script src="shell.js"></script>
<script src="page_bootstrap.js"></script>
</head>
<body class="page-bg">
<div id="shell"></div>
<div id="shell-content" class="content-area page-padding">

  <!-- KPIs -->
  <div class="kpi-row mb-6" id="kpiRow">
    <div class="kpi-card"><div class="kpi-value" id="kpi-total">--</div><div class="kpi-label">Custo Total</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpi-clt">--</div><div class="kpi-label">Custo CLT</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpi-apac">--</div><div class="kpi-label">Custo APAC</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpi-rotas">--</div><div class="kpi-label">Rotas Ativas</div></div>
  </div>

  <!-- Filtros -->
  <div class="card mb-6">
    <div class="card-header">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <div>
          <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Competencia</label>
          <input type="month" id="filtroComp" class="input" style="max-width:180px;">
        </div>
        <div>
          <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Status</label>
          <select id="filtroStatus" class="input" style="max-width:160px;">
            <option value="">Todos</option>
            <option value="aberto">Aberto</option>
            <option value="pago">Pago</option>
          </select>
        </div>
      </div>
      <div id="actionBtns"></div>
    </div>
  </div>

  <!-- Tabela lancamentos -->
  <div class="card mb-6">
    <div class="card-header"><h3>Lancamentos de Transporte</h3></div>
    <div class="data-table-wrapper">
      <table class="data-table" id="tblTransporte">
        <thead><tr>
          <th>Competencia</th><th>Fornecedor</th><th>Documento</th>
          <th>Rotas</th><th>Funcs</th><th>CLT</th><th>APAC</th>
          <th>Base</th><th>Extras</th><th>Total</th><th>Status</th><th>Acoes</th>
        </tr></thead>
        <tbody id="tbodyTransporte">
          <tr><td colspan="12" class="table-empty"><div class="spinner" style="margin:0 auto;"></div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="table-footer" id="tblFooter" style="display:none;"><span id="tblCount">0</span></div>
  </div>

  <!-- Rateio por rota -->
  <div class="card mb-6" id="secaoRateio" style="display:none;">
    <div class="card-header"><h3 id="rateioTitle">Rateio por Rota</h3></div>
    <div class="data-table-wrapper">
      <table class="data-table">
        <thead><tr>
          <th>Rota</th><th>Vinculo</th><th>Funcionarios</th>
          <th>Valor Base</th><th>Extras</th><th>Total</th><th>Custo Unit.</th><th>Acoes</th>
        </tr></thead>
        <tbody id="tbodyRateio"></tbody>
      </table>
    </div>
    <div style="padding:16px;"><button class="btn btn-primary btn-sm" id="btnAddRateio">+ Adicionar Rota</button></div>
  </div>

</div>

<!-- Modal Cadastro -->
<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal" style="max-width:640px;">
    <div class="modal-header">
      <h3 id="modalTitle">Novo Lancamento</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div><label class="form-label">Fornecedor *</label><input type="text" id="fFornecedor" class="input" placeholder="Ex: Transporte Godoy"></div>
        <div><label class="form-label">CNPJ</label><input type="text" id="fCnpj" class="input" placeholder="00.000.000/0000-00"></div>
        <div><label class="form-label">Competencia *</label><input type="month" id="fCompetencia" class="input"></div>
        <div><label class="form-label">N. Documento</label><input type="text" id="fDocumento" class="input"></div>
        <div><label class="form-label">Data Emissao</label><input type="date" id="fEmissao" class="input"></div>
        <div><label class="form-label">Vencimento</label><input type="date" id="fVencimento" class="input"></div>
        <div><label class="form-label">Valor Total *</label><input type="number" id="fValor" class="input" step="0.01" min="0"></div>
        <div><label class="form-label">Status</label>
          <select id="fStatus" class="input">
            <option value="aberto">Aberto</option><option value="pago">Pago</option><option value="parcial">Parcial</option>
          </select>
        </div>
        <div style="grid-column:1/-1;"><label class="form-label">N. Contrato</label><input type="text" id="fContrato" class="input"></div>
        <div style="grid-column:1/-1;"><label class="form-label">Observacoes</label><textarea id="fObs" class="input" rows="2"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnSalvar">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal Rateio -->
<div class="modal-overlay" id="modalRateio" style="display:none;">
  <div class="modal" style="max-width:500px;">
    <div class="modal-header">
      <h3>Adicionar Rota</h3>
      <button class="modal-close" onclick="closeRateioModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div><label class="form-label">Rota *</label><input type="text" id="rRota" class="input" placeholder="Ex: Godoy Moreira"></div>
        <div><label class="form-label">Tipo Vinculo *</label>
          <select id="rVinculo" class="input">
            <option value="clt">CLT</option><option value="apac">APAC</option>
            <option value="estagiario">Estagiario</option><option value="terceiro">Terceiro</option>
          </select>
        </div>
        <div><label class="form-label">Qtd Funcionarios *</label><input type="number" id="rQtd" class="input" min="0"></div>
        <div><label class="form-label">Valor Base *</label><input type="number" id="rBase" class="input" step="0.01" min="0"></div>
        <div><label class="form-label">Valor Extras</label><input type="number" id="rExtras" class="input" step="0.01" min="0" value="0"></div>
        <div><label class="form-label">Valor Total</label><input type="number" id="rTotal" class="input" step="0.01" readonly style="opacity:.7;"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeRateioModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnSalvarRateio">Salvar Rota</button>
    </div>
  </div>
</div>

<script>
let _data = [];
let _rateios = [];
let _editId = null;
let _rateioParentId = null;
let _user = null;

PageBootstrap.init({
  page: 'ponto',
  title: 'Custos de Transporte',
  breadcrumb: 'Operacional > Custos de Transporte',
  perfisPermitidos: ['administrador','rh'],
  bindEvents, loadData, render,
});

function bindEvents(user) {
  _user = user;
  document.getElementById('filtroComp').addEventListener('change', reloadAndRender);
  document.getElementById('filtroStatus').addEventListener('change', reloadAndRender);

  if (API.canAccess('editar_funcionario')) {
    document.getElementById('actionBtns').innerHTML = '<button class="btn btn-primary btn-sm" id="btnNovo">+ Novo Lancamento</button>';
    document.getElementById('btnNovo').addEventListener('click', openNewModal);
  }
  document.getElementById('btnSalvar').addEventListener('click', saveTransporte);
  document.getElementById('btnAddRateio').addEventListener('click', openRateioModal);
  document.getElementById('btnSalvarRateio').addEventListener('click', saveRateio);
  document.getElementById('rBase').addEventListener('input', calcRateioTotal);
  document.getElementById('rExtras').addEventListener('input', calcRateioTotal);

  // Default competencia = mes atual
  const now = new Date();
  document.getElementById('filtroComp').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
}

async function loadData() {
  const comp = document.getElementById('filtroComp').value;
  const status = document.getElementById('filtroStatus').value;
  let endpoint = 'vw_rh_custos_transporte_mensal?order=competencia.desc';
  if (comp) endpoint += `&competencia=eq.${comp}-01`;
  if (status) endpoint += `&status_pagamento=eq.${status}`;
  const res = await API.get(endpoint);
  _data = res.ok ? (res.data || []) : [];

  // KPIs from all data for the period
  const all = await API.get('vw_custos_transporte_consolidado' + (comp ? `?competencia=eq.${comp}-01` : '?order=competencia.desc&limit=1'));
  return { items: _data, kpis: all.ok && all.data?.length ? all.data[0] : {} };
}

function render(result) {
  const { items, kpis } = result;
  document.getElementById('kpi-total').textContent = API.fmtMoeda(kpis.custo_total);
  document.getElementById('kpi-clt').textContent = API.fmtMoeda(kpis.custo_clt);
  document.getElementById('kpi-apac').textContent = API.fmtMoeda(kpis.custo_apac);
  document.getElementById('kpi-rotas').textContent = kpis.total_rotas || 0;
  renderTable(items);
}

function renderTable(items) {
  const tbody = document.getElementById('tbodyTransporte');
  const footer = document.getElementById('tblFooter');
  if (!items?.length) {
    tbody.innerHTML = '<tr><td colspan="12" class="table-empty">Nenhum lancamento encontrado</td></tr>';
    footer.style.display = 'none';
    return;
  }
  tbody.innerHTML = items.map(r => `<tr>
    <td>${API.fmtData(r.competencia)}</td>
    <td class="font-medium">${API.esc(r.fornecedor_nome)}</td>
    <td>${API.esc(r.numero_documento || '--')}</td>
    <td class="cell-center">${r.rotas || 0}</td>
    <td class="cell-center">${r.funcionarios || 0}</td>
    <td>${API.fmtMoeda(r.custo_clt)}</td>
    <td>${API.fmtMoeda(r.custo_apac)}</td>
    <td>${API.fmtMoeda(r.total_base)}</td>
    <td>${API.fmtMoeda(r.total_extras)}</td>
    <td class="font-medium">${API.fmtMoeda(r.custo_total_rateado)}</td>
    <td>${UI.badge(r.status_pagamento)}</td>
    <td><button class="btn btn-ghost btn-xs" onclick="viewRateio('${r.competencia}','${API.esc(r.fornecedor_nome)}')">Rateio</button></td>
  </tr>`).join('');
  footer.style.display = '';
  document.getElementById('tblCount').textContent = `${items.length} lancamento(s)`;
}

async function reloadAndRender() {
  const result = await loadData();
  render(result);
}

// === MODAL CADASTRO ===
function openNewModal() {
  if (!API.canAccess('editar_funcionario')) { UI.toast('Sem permissao', 'err'); return; }
  _editId = null;
  document.getElementById('modalTitle').textContent = 'Novo Lancamento de Transporte';
  ['fFornecedor','fCnpj','fDocumento','fContrato','fObs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fCompetencia').value = document.getElementById('filtroComp').value;
  document.getElementById('fValor').value = '';
  document.getElementById('fStatus').value = 'aberto';
  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

async function saveTransporte() {
  const fornecedor = document.getElementById('fFornecedor').value.trim();
  const comp = document.getElementById('fCompetencia').value;
  const valor = parseFloat(document.getElementById('fValor').value);
  if (!fornecedor) { UI.toast('Informe o fornecedor', 'warn'); return; }
  if (!comp) { UI.toast('Informe a competencia', 'warn'); return; }
  if (!valor || valor <= 0) { UI.toast('Informe o valor', 'warn'); return; }

  const payload = {
    fornecedor_nome: fornecedor,
    fornecedor_cnpj: document.getElementById('fCnpj').value.trim() || null,
    competencia: comp + '-01',
    numero_documento: document.getElementById('fDocumento').value.trim() || null,
    numero_contrato: document.getElementById('fContrato').value.trim() || null,
    data_emissao: document.getElementById('fEmissao').value || null,
    vencimento: document.getElementById('fVencimento').value || null,
    valor_total: valor,
    status_pagamento: document.getElementById('fStatus').value,
    observacoes: document.getElementById('fObs').value.trim() || null,
  };

  const btn = document.getElementById('btnSalvar');
  btn.disabled = true;
  const res = _editId
    ? await API.patch(`rh_custos_transporte?id=eq.${_editId}`, payload)
    : await API.post('rh_custos_transporte', payload, 'return=representation');

  btn.disabled = false;
  if (res.ok) {
    UI.toast('Lancamento salvo!', 'ok');
    closeModal();
    reloadAndRender();
  } else {
    UI.toast('Erro: ' + res.error, 'err');
  }
}

// === RATEIO ===
async function viewRateio(competencia, fornecedor) {
  // Find the transporte_id
  const res = await API.get(`rh_custos_transporte?competencia=eq.${competencia}&fornecedor_nome=eq.${encodeURIComponent(fornecedor)}&select=id,fornecedor_nome&limit=1`);
  if (!res.ok || !res.data?.length) { UI.toast('Lancamento nao encontrado', 'err'); return; }
  _rateioParentId = res.data[0].id;
  document.getElementById('rateioTitle').textContent = `Rateio: ${fornecedor} - ${API.fmtData(competencia)}`;
  document.getElementById('secaoRateio').style.display = '';
  await loadRateios();
}

async function loadRateios() {
  const res = await API.get(`rh_custos_transporte_rateio?transporte_id=eq.${_rateioParentId}&order=rota`);
  _rateios = res.ok ? (res.data || []) : [];
  const tbody = document.getElementById('tbodyRateio');
  if (!_rateios.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="table-empty">Nenhuma rota cadastrada</td></tr>';
    return;
  }
  tbody.innerHTML = _rateios.map(r => `<tr>
    <td class="font-medium">${API.esc(r.rota)}</td>
    <td>${UI.badge(r.tipo_vinculo)}</td>
    <td class="cell-center">${r.quantidade_funcionarios}</td>
    <td>${API.fmtMoeda(r.valor_base)}</td>
    <td>${API.fmtMoeda(r.valor_extras)}</td>
    <td class="font-medium">${API.fmtMoeda(r.valor_total)}</td>
    <td>${API.fmtMoeda(r.custo_unitario)}</td>
    <td><button class="btn btn-ghost btn-xs" onclick="deleteRateio('${r.id}')">Remover</button></td>
  </tr>`).join('');
}

function openRateioModal() {
  ['rRota'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('rVinculo').value = 'clt';
  document.getElementById('rQtd').value = '';
  document.getElementById('rBase').value = '';
  document.getElementById('rExtras').value = '0';
  document.getElementById('rTotal').value = '';
  document.getElementById('modalRateio').style.display = 'flex';
}
function closeRateioModal() { document.getElementById('modalRateio').style.display = 'none'; }

function calcRateioTotal() {
  const base = parseFloat(document.getElementById('rBase').value) || 0;
  const extras = parseFloat(document.getElementById('rExtras').value) || 0;
  document.getElementById('rTotal').value = (base + extras).toFixed(2);
}

async function saveRateio() {
  const rota = document.getElementById('rRota').value.trim();
  const qtd = parseInt(document.getElementById('rQtd').value) || 0;
  const base = parseFloat(document.getElementById('rBase').value) || 0;
  if (!rota) { UI.toast('Informe a rota', 'warn'); return; }
  if (qtd <= 0) { UI.toast('Informe a quantidade', 'warn'); return; }
  if (base <= 0) { UI.toast('Informe o valor base', 'warn'); return; }

  const extras = parseFloat(document.getElementById('rExtras').value) || 0;
  const payload = {
    transporte_id: _rateioParentId,
    rota,
    tipo_vinculo: document.getElementById('rVinculo').value,
    quantidade_funcionarios: qtd,
    valor_base: base,
    valor_extras: extras,
    valor_total: base + extras,
  };
  const res = await API.post('rh_custos_transporte_rateio', payload);
  if (res.ok) {
    UI.toast('Rota adicionada!', 'ok');
    closeRateioModal();
    loadRateios();
    reloadAndRender();
  } else {
    UI.toast('Erro: ' + res.error, 'err');
  }
}

async function deleteRateio(id) {
  if (!confirm('Remover esta rota?')) return;
  const res = await API.del(`rh_custos_transporte_rateio?id=eq.${id}`);
  if (res.ok) { UI.toast('Removida', 'ok'); loadRateios(); reloadAndRender(); }
  else UI.toast('Erro: ' + res.error, 'err');
}
</script>
</body>
</html>
