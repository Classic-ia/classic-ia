<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canal de Denúncias CIPA - Classic RH</title>
<script src="config.js"></script>
<link rel="stylesheet" href="ds.css">
</head>
<body class="standalone-bg">
<div class="card">
  <div class="header">
    <div class="logo">Classic RH</div>
    <h1><span class="shield">&#128737;</span> Canal de Denúncias CIPA</h1>
    <p class="subtitle">Sua identidade é protegida. Todas as denúncias são anônimas.</p>
  </div>
  <form id="formDenuncia">
    <label for="empresa">Empresa</label>
    <select id="empresa">
      <option value="classic">Classic Couros</option>
      <option value="mundial">Mundial Couros</option>
      <option value="transanacleto">Trans Anacleto</option>
      <option value="ja">J.A. Agroindustrial</option>
    </select>

    <label for="setor">Setor</label>
    <select id="setor" required>
      <option value="">Selecione o setor</option>
      <option>Ribeira</option>
      <option>Curtimento</option>
      <option>Acabamento</option>
      <option>Expedição</option>
      <option>Manutenção</option>
      <option>Administrativo</option>
      <option>Outro</option>
    </select>

    <label for="descricao">Descrição da denúncia</label>
    <textarea id="descricao" required minlength="20" placeholder="Descreva a situação de risco ou irregularidade"></textarea>
    <div class="char-count"><span id="charN">0</span>/20 caracteres mínimos</div>

    <button type="submit" class="btn" id="btnSubmit">Enviar Denúncia</button>
  </form>
  <div id="msg" class="msg"></div>

  <form id="formProtocolo" style="margin-top:24px;border-top:1px solid var(--border,#e2e8f0);padding-top:16px;">
    <label for="protocolo">Já enviou uma denúncia? Consulte pelo protocolo</label>
    <input type="text" id="protocolo" placeholder="Cole aqui o código do protocolo" autocomplete="off">
    <button type="submit" class="btn" style="margin-top:8px;">Consultar Protocolo</button>
  </form>
  <div id="msgProtocolo" class="msg"></div>

  <div class="footer">
    <p>Sua denúncia é anônima e não registra nenhum dado pessoal.</p>
    <p>CIPA — Classic Importação e Exportação de Couros Ltda</p>
  </div>
</div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const emp = params.get('empresa');
  if(emp && /^[a-z]+$/.test(emp)){
    const sel = document.getElementById('empresa');
    for(let i=0;i<sel.options.length;i++){ if(sel.options[i].value===emp) sel.selectedIndex=i; }
  }

  const desc = document.getElementById('descricao');
  const charN = document.getElementById('charN');
  desc.addEventListener('input', ()=>{ charN.textContent = desc.value.trim().length; });

  document.getElementById('formDenuncia').addEventListener('submit', async(e)=>{
    e.preventDefault();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btnSubmit');
    const texto = desc.value.trim();

    if(texto.length < 20){
      msg.className='msg err'; msg.textContent='A descrição deve ter no mínimo 20 caracteres.'; return;
    }
    const setor = document.getElementById('setor').value;
    if(!setor){
      msg.className='msg err'; msg.textContent='Selecione um setor.'; return;
    }

    btn.disabled = true; btn.textContent = 'Enviando...';
    msg.className='msg'; msg.style.display='none';

    try{
      const res = await fetch(SB_URL+'/rest/v1/rpc/cipa_registrar_denuncia',{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'apikey': SB_KEY,
          'Authorization':'Bearer '+SB_KEY
        },
        body: JSON.stringify({
          p_setor: setor,
          p_descricao: texto,
          p_empresa_slug: document.getElementById('empresa').value || null
        })
      });
      if(!res.ok) throw new Error('Erro '+res.status);
      const data = await res.json();
      if(!data || data.ok === false) throw new Error(data?.error || 'Erro ao registrar');
      msg.className='msg ok';
      msg.textContent='Denúncia registrada com sucesso. Protocolo: '+data.protocolo+' — guarde este código para consultar a resposta.';
      document.getElementById('formDenuncia').querySelectorAll('select,textarea,button').forEach(el=>el.disabled=true);
    }catch(err){
      msg.className='msg err';
      msg.textContent='Erro ao enviar denúncia. Tente novamente.';
      btn.disabled=false; btn.textContent='Enviar Denúncia';
    }
  });

  // Consulta de protocolo
  document.getElementById('formProtocolo').addEventListener('submit', async(e)=>{
    e.preventDefault();
    const out = document.getElementById('msgProtocolo');
    const cod = document.getElementById('protocolo').value.trim();
    if(!/^[0-9a-fA-F-]{36}$/.test(cod)){
      out.className='msg err'; out.textContent='Protocolo inválido — informe o código completo recebido no envio.'; return;
    }
    out.className='msg'; out.textContent='Consultando...';
    try{
      const res = await fetch(SB_URL+'/rest/v1/rpc/cipa_consultar_protocolo',{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'apikey': SB_KEY,
          'Authorization':'Bearer '+SB_KEY
        },
        body: JSON.stringify({ p_protocolo: cod })
      });
      const data = await res.json();
      if(!res.ok || !data || data.ok === false) throw new Error(data?.error || 'Erro '+res.status);
      const statusLabel = { aberta:'Recebida — aguardando análise', em_analise:'Em análise pela CIPA', respondida:'Respondida', arquivada:'Arquivada' };
      let txt = 'Situação: ' + (statusLabel[data.status] || data.status);
      if(data.resposta){ txt += ' — Resposta: ' + data.resposta; }
      out.className='msg ok'; out.textContent = txt;
    }catch(err){
      out.className='msg err';
      out.textContent = err.message === 'Protocolo nao encontrado' ? 'Protocolo não encontrado.' : 'Erro ao consultar. Tente novamente.';
    }
  });
})();
</script>
</body>
</html>
