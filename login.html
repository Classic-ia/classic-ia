/* ── LOGIN PAGE ─────────────────────────────────────────── */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-6);
  background: var(--bg);
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-12) var(--space-10) var(--space-10);
  width: 100%;
  max-width: 400px;
  box-shadow: var(--shadow-lg);
}
.login-logo {
  text-align: center;
  margin-bottom: var(--space-8);
}
.login-logo img {
  width: 64px;
  height: auto;
  margin: 0 auto var(--space-4);
  border-radius: var(--radius-md);
}
.login-logo h1 {
  font-size: var(--text-lg);
  font-weight: 700;
  color: var(--text);
}
.login-logo h1 em {
  font-style: normal;
  color: var(--primary);
}
.login-logo p {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-top: var(--space-1);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.login-field {
  margin-bottom: var(--space-5);
}
.login-field label {
  display: block;
  font-size: var(--text-xs);
  color: var(--text-secondary);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: var(--space-1);
}
.login-field input {
  width: 100%;
  padding: var(--space-3) var(--space-4);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: var(--text-base);
  font-family: var(--font-family);
  transition: border-color var(--transition-fast);
  outline: none;
}
.login-field input::placeholder {
  color: var(--text-muted);
}
.login-field input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}
.login-field input.error {
  border-color: var(--danger);
}

.login-btn {
  width: 100%;
  padding: var(--space-3);
  margin-top: var(--space-2);
  background: var(--primary);
  color: var(--text-inverse);
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-family);
  font-size: var(--text-sm);
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
}
.login-btn:hover {
  background: var(--primary-dark);
}
.login-btn:disabled {
  opacity: 0.5;
  cursor: default;
}

.login-spinner {
  display: none;
  width: 16px;
  height: 16px;
  border: 2px solid transparent;
  border-top-color: var(--text-inverse);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.login-error {
  display: none;
  margin-top: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--danger-light);
  border: 1px solid rgba(220, 38, 38, 0.2);
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  color: var(--danger-dark);
  text-align: center;
}

.login-expired {
  display: none;
  margin-bottom: var(--space-5);
  padding: var(--space-3) var(--space-4);
  background: var(--warning-light);
  border: 1px solid rgba(217, 119, 6, 0.2);
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  color: var(--warning-dark);
  text-align: center;
}

.login-footer {
  text-align: center;
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 1px solid var(--border);
}
.login-footer a {
  font-size: var(--text-xs);
  color: var(--text-muted);
  letter-spacing: 0.06em;
  transition: color var(--transition-fast);
}
.login-footer a:hover {
  color: var(--primary);
}
.login-version {
  font-size: 10px;
  color: var(--text-muted);
  text-align: center;
  margin-top: var(--space-4);
  opacity: 0.5;
}

<body class="page-bg">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="assets/logo-classic-icon.png.jpg" alt="Classic Couros" onerror="this.style.display='none'">

        onkeydown="if(event.key==='Enter') fazerLogin()">

<script>
// ── CONFIG ─────────────────────────────────────────────────
var CQ_URL = CQ_CFG.URL;
var CQ_KEY = CQ_CFG.KEY;
var RH_URL = RH_CFG.URL;
var RH_KEY = RH_CFG.KEY;

// ── SESSION CHECK ──────────────────────────────────────────
(function(){
  // Se ja tem sessao ativa → portal
  try {
    var cq = localStorage.getItem('cq_sess_v2');
    var rh = localStorage.getItem('rh_sess_v2');
    if (cq || rh) {
      var temSessao = false;
      if (cq) {
        var s = JSON.parse(cq);
        var idade = Date.now() - (s.ts || 0);
        if (idade < 3600000 && (s.access_token || (s.token && s.token.startsWith('demo-')))) temSessao = true;
        else localStorage.removeItem('cq_sess_v2');
      }
      if (rh) {
        var s2 = JSON.parse(rh);
        var idade2 = Date.now() - (s2.ts || 0);
        if (idade2 < 3600000 && s2.access_token) temSessao = true;
        else localStorage.removeItem('rh_sess_v2');
      }
      if (temSessao) { window.location.href = 'portal.html'; return; }
    }
  } catch(e) {
    localStorage.removeItem('cq_sess_v2');
    localStorage.removeItem('rh_sess_v2');
  }

  // Sessao expirada?
  var params = new URLSearchParams(window.location.search);
  if (params.get('exp') === '1') {
    document.getElementById('expiredBanner').style.display = 'block';
  }
})();

// ── LOGIN ──────────────────────────────────────────────────
async function tentarAuthSupabase(url, key, email, senha) {
  try {
    var r = await fetch(url + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': key },
      body: JSON.stringify({ email: email, password: senha })
    });
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

async function buscarPerfilCQ(url, key, token) {
  try {
    var r = await fetch(url + '/rest/v1/cq_usuarios?select=id,email,nome,perfil&email=eq.' + encodeURIComponent(token.user.email), {
      headers: { 'Content-Type':'application/json', 'apikey': key, 'Authorization':'Bearer ' + token.access_token }
    });
    if (!r.ok) return null;
    var rows = await r.json();
    return rows && rows.length > 0 ? rows[0] : null;
  } catch(e) { return null; }
}

async function buscarPerfilRH(url, key, token) {
  try {
    var r = await fetch(url + '/rest/v1/rpc/rh_meu_perfil', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': key, 'Authorization':'Bearer ' + token.access_token },
      body: '{}'
    });
    if (!r.ok) return null;
    var rows = await r.json();
    return rows && rows.length > 0 ? rows[0] : null;
  } catch(e) { return null; }
}

async function fazerLogin() {
  var email = document.getElementById('inp-email').value.trim();
  var senha = document.getElementById('inp-senha').value;
  var btn   = document.getElementById('btnLogin');
  var err   = document.getElementById('errMsg');
  var spin  = document.getElementById('spinner');
  var txt   = document.getElementById('btnTxt');

  // Limpar
  err.style.display = 'none';
  document.getElementById('inp-email').classList.remove('error');
  document.getElementById('inp-senha').classList.remove('error');

  if (!email) {
    document.getElementById('inp-email').classList.add('error');
    mostrarErro('Informe o e-mail'); return;
  }
  if (!senha) {
    document.getElementById('inp-senha').classList.add('error');
    mostrarErro('Informe a senha'); return;
  }

  // Loading
  btn.disabled = true;
  spin.style.display = 'block';
  txt.textContent = 'Entrando...';

  try {
    // Tentar ambos Supabase em paralelo
    var [authCQ, authRH] = await Promise.all([
      tentarAuthSupabase(CQ_URL, CQ_KEY, email, senha),
      RH_URL ? tentarAuthSupabase(RH_URL, RH_KEY, email, senha) : Promise.resolve(null)
    ]);

    if (!authCQ && !authRH) {
      throw new Error('E-mail ou senha incorretos.');
    }

    // Buscar perfis em paralelo
    var [perfilCQ, perfilRH] = await Promise.all([
      authCQ ? buscarPerfilCQ(CQ_URL, CQ_KEY, authCQ) : Promise.resolve(null),
      authRH ? buscarPerfilRH(RH_URL, RH_KEY, authRH) : Promise.resolve(null)
    ]);

    // Salvar sessoes
    if (authCQ) {
      localStorage.setItem('cq_sess_v2', JSON.stringify({
        token: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
        access_token: authCQ.access_token,
        refresh_token: authCQ.refresh_token,
        user: perfilCQ || { email: email },
        ts: Date.now()
      }));
    }

    if (authRH) {
      localStorage.setItem('rh_sess_v2', JSON.stringify({
        token: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
        access_token: authRH.access_token,
        refresh_token: authRH.refresh_token,
        user: perfilRH || { email: email },
        ts: Date.now()
      }));
    }

    // Redirecionar para portal
    var params = new URLSearchParams(window.location.search);
    window.location.href = params.get('next') || 'portal.html';

  } catch(e) {
    mostrarErro(e.message || 'Erro ao conectar. Tente novamente.');
    btn.disabled = false;
    spin.style.display = 'none';
    txt.textContent = 'Entrar';
  }
}

function mostrarErro(msg) {
  var err = document.getElementById('errMsg');
  err.textContent = msg;
  err.style.display = 'block';
}
</script>
