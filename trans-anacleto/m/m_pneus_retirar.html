<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Retirar Pneu — Trans Anacleto Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="m.css">
<script src="../config.js"></script>
<script src="../auth.js"></script>
<script src="../api.js"></script>
<script src="m_shell.js"></script>
<style>
  .destino-opts { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .destino-btn { padding:14px 4px; border:1.5px solid #cbd5e1; background:#fff; color:#0f172a;
    font-weight:600; border-radius:8px; text-align:center; font-size:13px; }
  .destino-btn.active { background:#2563eb; color:#fff; border-color:#2563eb; }
</style>
</head>
<body>
<div class="m-app">
  <div id="m-shell"></div>
  <main class="m-main">
    <div id="box-pneu" class="m-card m-loading"><div class="m-spinner"></div><div>Carregando...</div></div>

    <form id="form-retirar" style="display:none" onsubmit="submitForm(event)">
      <div class="m-card">
        <div class="m-card-title">KM do veiculo</div>
        <div class="m-field">
          <label>KM atual (odometro)</label>
          <input type="number" id="f-km" required min="0" step="1" inputmode="numeric">
          <div class="m-small m-muted" id="info-km"></div>
        </div>
      </div>

      <div class="m-card">
        <div class="m-card-title">Destino</div>
        <div class="destino-opts" id="destino-grid">
          <button type="button" class="destino-btn" data-dest="estoque" onclick="selDest('estoque')">Voltar p/ estoque</button>
          <button type="button" class="destino-btn" data-dest="recapagem" onclick="selDest('recapagem')">Recapagem</button>
          <button type="button" class="destino-btn" data-dest="sucata" onclick="selDest('sucata')">Sucata (descarte)</button>
          <button type="button" class="destino-btn" data-dest="troca_direta" onclick="selDest('troca_direta')">Troca direta</button>
        </div>
        <input type="hidden" id="f-destino" required>
      </div>

      <div class="m-card">
        <div class="m-card-title">Motivo</div>
        <div class="m-field">
          <select id="f-motivo-sel" onchange="sync()">
            <option value="">Selecione</option>
            <option value="desgaste">Desgaste natural</option>
            <option value="furo">Furo / avaria</option>
            <option value="preventiva">Preventiva (rodizio)</option>
            <option value="troca_direta">Troca direta</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="m-field">
          <label>Descricao complementar</label>
          <textarea id="f-motivo" rows="2" placeholder="Detalhes"></textarea>
        </div>
      </div>

      <div class="m-card">
        <div class="m-card-title">Foto <span id="foto-req-label" class="m-small m-muted"></span></div>
        <input type="file" id="f-foto" accept="image/*" capture="environment">
        <img id="foto-preview" class="m-foto-preview" style="display:none">
      </div>

      <div class="m-card">
        <button type="submit" class="m-btn m-btn-primary" id="btn-ok">Confirmar retirada</button>
        <a href="#" onclick="history.back();return false" class="m-btn m-btn-ghost">Cancelar</a>
      </div>
    </form>
  </main>
</div>

<script>
let _pneuId = null, _manutencaoId = null, _user = null, _pneu = null;

(async function init() {
  _user = await MShell.init();
  if (!_user) return;
  const url = new URL(window.location.href);
  _pneuId = url.searchParams.get('pneu_id');
  _manutencaoId = url.searchParams.get('manutencao_id') || null;
  if (!_pneuId) { MShell.toast('Pneu nao informado', 'erro'); setTimeout(()=>history.back(), 1200); return; }
  MShell.render({ title: 'Retirar pneu', back: 'm_pneus_scan.html', currentNav: 'pneus' });
  await carregar();
})();

async function carregar() {
  const rp = await API.get(`v_trans_pneus_full?id=eq.${_pneuId}&select=*`);
  if (!rp.ok || !rp.data.length) {
    document.getElementById('box-pneu').innerHTML = `<p>Pneu nao encontrado.</p>`;
    return;
  }
  _pneu = rp.data[0];
  if (_pneu.status !== 'instalado') {
    document.getElementById('box-pneu').innerHTML =
      `<div class="m-card-title">Status invalido</div><p>Status atual: <strong>${API.esc(_pneu.status)}</strong>.</p>`;
    return;
  }
  document.getElementById('box-pneu').className = 'm-card';
  document.getElementById('box-pneu').innerHTML = `
    <div class="m-small m-muted">Pneu</div>
    <div class="m-big m-mono">${API.esc(_pneu.codigo_interno)}</div>
    <div class="m-small m-muted" style="margin-top:6px">Instalado em</div>
    <div>Veic <strong>${API.esc(_pneu.veiculo_placa||'-')}</strong> • Posic <strong>${API.esc(_pneu.posicao_atual||'-')}</strong></div>
    <div class="m-small m-muted" style="margin-top:6px">KM no veiculo atual</div>
    <div>${API.fmtKm(_pneu.veiculo_km_atual)} (instalado em ${API.fmtKm(_pneu.km_instalado_atual)})</div>
  `;
  document.getElementById('f-km').value = _pneu.veiculo_km_atual || _pneu.km_instalado_atual || 0;
  document.getElementById('info-km').textContent = `Nao pode ser menor que ${API.fmtKm(_pneu.km_instalado_atual)}`;
  document.getElementById('f-foto').addEventListener('change', preview);
  document.getElementById('form-retirar').style.display = '';
}

function selDest(d) {
  document.getElementById('f-destino').value = d;
  document.querySelectorAll('.destino-btn').forEach(b => b.classList.toggle('active', b.dataset.dest === d));
  document.getElementById('foto-req-label').textContent = (d === 'sucata') ? '(obrigatoria)' : '(opcional)';
  if (d === 'troca_direta') document.getElementById('f-motivo-sel').value = 'troca_direta';
  sync();
}

function sync() {
  const sel = document.getElementById('f-motivo-sel').value;
  const ta = document.getElementById('f-motivo');
  if (sel && sel !== 'outro' && !ta.value.trim()) ta.value = document.querySelector(`#f-motivo-sel option[value="${sel}"]`)?.textContent || '';
}

function preview(e) {
  const f = e.target.files[0];
  const img = document.getElementById('foto-preview');
  if (!f) { img.style.display = 'none'; return; }
  img.src = URL.createObjectURL(f); img.style.display = 'block';
}

async function submitForm(e) {
  e.preventDefault();
  const dest = document.getElementById('f-destino').value;
  const km = parseInt(document.getElementById('f-km').value || '0', 10);
  const motivo = document.getElementById('f-motivo').value.trim() || document.getElementById('f-motivo-sel').value || 'outro';
  const foto = document.getElementById('f-foto').files[0];
  if (!dest) { MShell.toast('Escolha o destino', 'aviso'); return; }
  if (!motivo) { MShell.toast('Informe o motivo', 'aviso'); return; }
  if (dest === 'sucata' && !foto) { MShell.toast('Foto obrigatoria para sucata', 'aviso'); return; }
  if (km < (_pneu.km_instalado_atual || 0)) { MShell.toast('KM menor que instalacao', 'erro'); return; }

  const btn = document.getElementById('btn-ok');
  btn.disabled = true; btn.textContent = 'Enviando...';
  const fotoUrl = await uploadFotoOpcional();
  const r = await API.rpc('trans_pneu_retirar', {
    p_pneu_id: _pneuId,
    p_km_veiculo: km,
    p_destino: dest,
    p_motivo: motivo,
    p_foto_url: fotoUrl,
    p_observacao: null
  });
  if (!r.ok) {
    MShell.toast(r.error || 'Erro ao retirar', 'erro', 4000);
    btn.disabled = false; btn.textContent = 'Confirmar retirada';
    return;
  }
  if (_manutencaoId) {
    await API.post('trans_manutencao_pneus', {
      manutencao_id: _manutencaoId, pneu_id: _pneuId, acao: 'retirar'
    });
  }
  MShell.toast('Pneu retirado.', 'ok');
  setTimeout(() => {
    if (dest === 'recapagem') {
      window.location.href = `m_pneus_recapagem.html?pneu_id=${_pneuId}&modo=enviar${_manutencaoId?'&manutencao_id='+_manutencaoId:''}`;
    } else {
      window.location.href = _manutencaoId ? `m_manutencao_itens.html?id=${_manutencaoId}` : 'm_home.html';
    }
  }, 900);
}

async function uploadFotoOpcional() {
  const f = document.getElementById('f-foto').files[0];
  if (!f) return null;
  try {
    const path = `pneus/${_pneuId}/${Date.now()}-${f.name.replace(/[^a-z0-9.]/gi,'_')}`;
    const res = await fetch(`${SB_URL}/storage/v1/object/trans-pneus-fotos/${path}`, {
      method: 'POST',
      headers: {
        'Content-Type': f.type || 'application/octet-stream',
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + (JSON.parse(localStorage.getItem('trans_sess_v1')||'{}').access_token || SB_KEY),
        'x-upsert': 'true'
      },
      body: f
    });
    if (!res.ok) return null;
    return `${SB_URL}/storage/v1/object/public/trans-pneus-fotos/${path}`;
  } catch { return null; }
}
</script>
</body>
</html>
