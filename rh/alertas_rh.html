<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Alertas - Classic RH &amp; SST</title>
<script src="config.js"></script>
<script src="rh_auth.js"></script>
<script src="api.js"></script>
<script src="ui_components.js"></script>
<script src="page_bootstrap.js"></script>
<script src="shell.js"></script>
<link rel="stylesheet" href="ds.css">
</head>
<body class="page-bg">

<div id="shell"></div>
<div id="shell-content">

<div class="main">

  <!-- Loading -->
  <div id="loading-state" class="loading-state">
    <div class="loading-spinner"></div>
    Carregando alertas...
  </div>

  <!-- Content (hidden until loaded) -->
  <div id="content" style="display:none;">

    <!-- Refresh bar -->
    <div class="refresh-bar">
      <div class="refresh-info">
        <span class="refresh-dot"></span>
        Atualizado em <span id="last-refresh">--</span> — auto-refresh a cada 5 min
      </div>
    </div>

    <!-- KPI Summary -->
    <div class="kpi-summary">
      <div class="kpi-box urgente">
        <div class="kpi-num red" id="kpi-urgente">0</div>
        <div class="kpi-lbl">Urgentes</div>
      </div>
      <div class="kpi-box atencao">
        <div class="kpi-num orange" id="kpi-atencao">0</div>
        <div class="kpi-lbl">Atencao</div>
      </div>
      <div class="kpi-box ok">
        <div class="kpi-num green" id="kpi-ok">0</div>
        <div class="kpi-lbl">OK</div>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="todos">Todos <span class="count" id="fc-todos">0</span></button>
      <button class="filter-btn" data-filter="urgente">Urgentes <span class="count" id="fc-urgente">0</span></button>
      <button class="filter-btn" data-filter="atencao">Atencao <span class="count" id="fc-atencao">0</span></button>
    </div>

    <!-- Alert sections container -->
    <div id="sections-container"></div>

  </div>
</div>

</div><!-- /shell-content -->

<script>
(async () => {

  // ── Shell ──
  const user = await Shell.init({ page: 'pendencias', title: 'Pendencias e Alertas' });
  if (!user) return;
  API.setPerfil(user.perfil);

  // ── State ──
  let allAlerts = [];
  let activeFilter = 'todos';
  const HOJE = new Date();
  HOJE.setHours(0, 0, 0, 0);

  // ── Utility ──
  function diffDays(dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr + 'T00:00:00');
    return Math.ceil((d - HOJE) / (1000 * 60 * 60 * 24));
  }

  function fmtDate(d) { return API.fmtData(d); }

  function fmtDateObj(d) {
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yy = d.getFullYear();
    return dd + '/' + mm + '/' + yy;
  }

  function toISODate(d) {
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  function addDays(dateStr, days) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + days);
    return d;
  }

  function esc(s) { return API.esc(s); }

  // ── Load all data ──
  async function loadData() {
    let colaboradores = [], asos = [], treinamentos = [];
    try {
      const [resColab, resAsos, resTrein] = await Promise.all([
        API.get('rh_colaboradores?status=in.(ativo,afastado,ferias,experiencia)&select=id,nome,categoria,data_admissao,data_nascimento,cargo,unidade'),
        API.get('rh_asos?select=id,colaborador_id,tipo_aso,data_realizacao,data_vencimento,status'),
        API.get('rh_treinamentos?select=id,colaborador_id,treinamento,data_realizacao,data_vencimento,status'),
      ]);
      colaboradores = resColab.ok ? resColab.data : [];
      asos = resAsos.ok ? resAsos.data : [];
      treinamentos = resTrein.ok ? resTrein.data : [];
    } catch (err) {
      console.error('Erro ao carregar dados de alertas:', err);
      API.logEvent('UI_ERROR', { page: 'alertas_rh', error: err.message });
    }

    // Build colaborador map
    const colabMap = {};
    colaboradores.forEach(c => { colabMap[c.id] = c; });

    allAlerts = [];

    // ── (a) Contratos de Experiencia ──
    processContratosExperiencia(colaboradores);

    // ── (b) ASOs ──
    processASOs(asos, colabMap);

    // ── (c) Treinamentos ──
    processTreinamentos(treinamentos, colabMap);

    // ── (d) Ferias (periodo concessivo) ──
    processFeriasPeriodo(colaboradores);

    // ── (e) Aniversariantes ──
    processAniversariantes(colaboradores);

    renderAll();
  }

  // ── (a) Contratos de Experiencia ──
  function processContratosExperiencia(colaboradores) {
    // Filtrar por data_admissao nos ultimos 90 dias (periodo de experiencia)
    const experiencia = colaboradores.filter(c => {
      if (!c.data_admissao) return false;
      const admDate = new Date(c.data_admissao + 'T00:00:00');
      const diasDesdeAdmissao = Math.ceil((HOJE - admDate) / (1000 * 60 * 60 * 24));
      return diasDesdeAdmissao >= 0 && diasDesdeAdmissao <= 90;
    });

    experiencia.forEach(c => {
      const admissao = c.data_admissao;

      // Primeiro vencimento: 45 dias
      const venc45 = addDays(admissao, 45);
      const dias45 = Math.ceil((venc45 - HOJE) / (1000 * 60 * 60 * 24));

      // Segundo vencimento (maximo): 90 dias
      const venc90 = addDays(admissao, 90);
      const dias90 = Math.ceil((venc90 - HOJE) / (1000 * 60 * 60 * 24));

      // Se ja passou dos 90 dias, nao alertar (contrato ja encerrou ou foi efetivado)
      if (dias90 < 0) return;

      // Determinar qual vencimento alertar
      // Se ainda nao passou do primeiro periodo (45 dias)
      if (dias45 >= 0 && dias45 <= 30) {
        let nivel = 'ok';
        if (dias45 <= 7) nivel = 'urgente';
        else if (dias45 <= 30) nivel = 'atencao';

        allAlerts.push({
          categoria: 'contrato',
          nivel,
          nome: c.nome,
          detalhe: '1o periodo experiencia (45 dias) vence em ' + fmtDateObj(venc45),
          dataRef: toISODate(venc45),
          dias: dias45,
          link: 'colaboradores.html',
          linkLabel: 'Ver colaborador',
        });
      }

      // Alertar para o vencimento do segundo periodo (90 dias)
      if (dias90 >= 0 && dias90 <= 30) {
        let nivel = 'ok';
        if (dias90 <= 7) nivel = 'urgente';
        else if (dias90 <= 30) nivel = 'atencao';

        allAlerts.push({
          categoria: 'contrato',
          nivel,
          nome: c.nome,
          detalhe: '2o periodo experiencia (90 dias) vence em ' + fmtDateObj(venc90) + ' — DECISAO: efetivar ou desligar',
          dataRef: toISODate(venc90),
          dias: dias90,
          link: 'colaboradores.html',
          linkLabel: 'Ver colaborador',
        });
      }
    });
  }

  // ── (b) ASOs ──
  function processASOs(asos, colabMap) {
    asos.forEach(a => {
      const colab = colabMap[a.colaborador_id];
      if (!colab) return; // colaborador nao encontrado no filtro ativo
      if (!a.data_vencimento) return;

      const dias = diffDays(a.data_vencimento);
      if (dias === null) return;

      // Vencido ou vencendo em 30 dias
      if (dias > 30) return;

      let nivel = 'ok';
      if (dias <= 0) nivel = 'urgente';
      else if (dias <= 30) nivel = 'atencao';

      const statusTxt = dias <= 0
        ? 'VENCIDO ha ' + Math.abs(dias) + ' dia(s)'
        : 'Vence em ' + dias + ' dia(s)';

      allAlerts.push({
        categoria: 'aso',
        nivel,
        nome: colab.nome,
        detalhe: (a.tipo_aso || 'ASO').toUpperCase() + ' — ' + statusTxt,
        dataRef: a.data_vencimento,
        dias: dias,
        link: 'colaboradores.html',
        linkLabel: 'Ver ASO',
      });
    });
  }

  // ── (c) Treinamentos ──
  function processTreinamentos(treinamentos, colabMap) {
    treinamentos.forEach(t => {
      const colab = colabMap[t.colaborador_id];
      if (!colab) return;
      if (!t.data_vencimento) return;

      const dias = diffDays(t.data_vencimento);
      if (dias === null) return;

      // Vencido ou vencendo em 30 dias
      if (dias > 30) return;

      let nivel = 'ok';
      if (dias <= 0) nivel = 'urgente';
      else if (dias <= 30) nivel = 'atencao';

      const statusTxt = dias <= 0
        ? 'VENCIDO ha ' + Math.abs(dias) + ' dia(s)'
        : 'Vence em ' + dias + ' dia(s)';

      allAlerts.push({
        categoria: 'treinamento',
        nivel,
        nome: colab.nome,
        detalhe: (t.treinamento || 'Treinamento') + ' — ' + statusTxt,
        dataRef: t.data_vencimento,
        dias: dias,
        link: 'colaboradores.html',
        linkLabel: 'Ver treinamento',
      });
    });
  }

  // ── (d) Ferias — Periodo Concessivo ──
  function processFeriasPeriodo(colaboradores) {
    colaboradores.forEach(c => {
      if (!c.data_admissao) return;

      const admissao = new Date(c.data_admissao + 'T00:00:00');
      const hojeMs = HOJE.getTime();

      // Calcular periodos aquisitivos a partir da admissao
      // Periodo aquisitivo N: admissao + N*12 meses ate admissao + (N+1)*12 meses
      // Periodo concessivo correspondente: admissao + (N+1)*12 ate admissao + (N+2)*12

      // Quantos anos completos desde admissao?
      let anosCompletos = 0;
      let check = new Date(admissao);
      while (true) {
        let next = new Date(check);
        next.setFullYear(next.getFullYear() + 1);
        if (next <= HOJE) {
          anosCompletos++;
          check = next;
        } else {
          break;
        }
      }

      // Se menos de 1 ano, ainda nao tem periodo concessivo
      if (anosCompletos < 1) return;

      // Periodo concessivo mais recente que pode estar vencendo:
      // Aquisitivo: admissao + (anosCompletos-1)*12m a admissao + anosCompletos*12m
      // Concessivo: admissao + anosCompletos*12m a admissao + (anosCompletos+1)*12m
      const fimConcessivo = new Date(admissao);
      fimConcessivo.setFullYear(admissao.getFullYear() + anosCompletos + 1);

      const diasParaFim = Math.ceil((fimConcessivo - HOJE) / (1000 * 60 * 60 * 24));

      // Se ja passou, o periodo venceu (ferias nao gozadas = problema serio)
      // Alertar se <= 60 dias para vencer
      if (diasParaFim > 60) return;

      let nivel = 'ok';
      if (diasParaFim <= 0) nivel = 'urgente';
      else if (diasParaFim <= 30) nivel = 'urgente';
      else if (diasParaFim <= 60) nivel = 'atencao';

      const statusTxt = diasParaFim <= 0
        ? 'PERIODO CONCESSIVO VENCIDO ha ' + Math.abs(diasParaFim) + ' dia(s) — RISCO TRABALHISTA'
        : 'Periodo concessivo vence em ' + diasParaFim + ' dia(s)';

      const periodoRef = anosCompletos + 'o periodo aquisitivo';

      allAlerts.push({
        categoria: 'ferias',
        nivel,
        nome: c.nome,
        detalhe: periodoRef + ' — ' + statusTxt,
        dataRef: toISODate(fimConcessivo),
        dias: diasParaFim,
        link: 'colaboradores.html',
        linkLabel: 'Ver colaborador',
      });
    });
  }

  // ── (e) Aniversariantes do Mes ──
  function processAniversariantes(colaboradores) {
    const mesAtual = HOJE.getMonth() + 1; // 1-12
    colaboradores.forEach(c => {
      if (!c.data_nascimento) return;
      const parts = c.data_nascimento.split('-');
      const mesNasc = parseInt(parts[1]);
      if (mesNasc !== mesAtual) return;

      const diaNasc = parseInt(parts[2]);
      const anoNasc = parseInt(parts[0]);
      const idade = HOJE.getFullYear() - anoNasc;
      const diaHoje = HOJE.getDate();
      const diasPara = diaNasc - diaHoje;

      let nivel = 'ok';
      if (diasPara >= 0 && diasPara <= 3) nivel = 'atencao';
      if (diasPara === 0) nivel = 'urgente';

      allAlerts.push({
        categoria: 'aniversario',
        nivel,
        nome: c.nome,
        detalhe: fmtDate(c.data_nascimento) + ' — completa ' + idade + ' anos',
        dataRef: HOJE.getFullYear() + '-' + String(mesAtual).padStart(2,'0') + '-' + String(diaNasc).padStart(2,'0'),
        dias: diasPara,
        link: 'colaboradores.html',
        linkLabel: 'Ver colaborador',
      });
    });
  }

  // ── Render ──
  function renderAll() {
    // Sort: urgente first, then by dias ascending
    allAlerts.sort((a, b) => {
      const order = { urgente: 0, atencao: 1, ok: 2 };
      if (order[a.nivel] !== order[b.nivel]) return order[a.nivel] - order[b.nivel];
      return a.dias - b.dias;
    });

    // KPIs
    const urgentes = allAlerts.filter(a => a.nivel === 'urgente').length;
    const atencao = allAlerts.filter(a => a.nivel === 'atencao').length;
    const ok = allAlerts.filter(a => a.nivel === 'ok').length;

    document.getElementById('kpi-urgente').textContent = urgentes;
    document.getElementById('kpi-atencao').textContent = atencao;
    document.getElementById('kpi-ok').textContent = ok;

    // Filter counts
    document.getElementById('fc-todos').textContent = allAlerts.length;
    document.getElementById('fc-urgente').textContent = urgentes;
    document.getElementById('fc-atencao').textContent = atencao;

    // Render sections
    renderSections();

    // Update timestamp
    const now = new Date();
    document.getElementById('last-refresh').textContent =
      String(now.getHours()).padStart(2, '0') + ':' +
      String(now.getMinutes()).padStart(2, '0') + ':' +
      String(now.getSeconds()).padStart(2, '0');

    // Show content
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }

  function getFilteredAlerts(categoria) {
    let filtered = allAlerts.filter(a => a.categoria === categoria);
    if (activeFilter === 'urgente') filtered = filtered.filter(a => a.nivel === 'urgente');
    else if (activeFilter === 'atencao') filtered = filtered.filter(a => a.nivel === 'atencao');
    return filtered;
  }

  function renderSections() {
    const container = document.getElementById('sections-container');

    const sections = [
      {
        id: 'contrato',
        title: 'Contratos de Experiencia Vencendo',
        subtitle: 'Admitidos nos ultimos 90 dias — periodos de 45 e 90 dias',
        icon: '&#128196;',
        iconClass: 'orange',
      },
      {
        id: 'aso',
        title: 'ASOs Vencidos / Vencendo',
        subtitle: 'Atestados de Saude Ocupacional',
        icon: '&#9764;',
        iconClass: 'red',
      },
      {
        id: 'treinamento',
        title: 'Treinamentos Vencidos / Vencendo',
        subtitle: 'Treinamentos obrigatorios e NRs',
        icon: '&#9998;',
        iconClass: 'blue',
      },
      {
        id: 'ferias',
        title: 'Ferias — Periodo Concessivo',
        subtitle: 'Colaboradores que precisam tirar ferias',
        icon: '&#9992;',
        iconClass: 'green',
      },
      {
        id: 'aniversario',
        title: 'Aniversariantes do Mes',
        subtitle: 'Datas de nascimento dos colaboradores',
        icon: '&#9733;',
        iconClass: 'blue',
      },
    ];

    let html = '';

    sections.forEach(sec => {
      const alerts = getFilteredAlerts(sec.id);
      const urgCount = alerts.filter(a => a.nivel === 'urgente').length;
      const atcCount = alerts.filter(a => a.nivel === 'atencao').length;
      const totalCount = alerts.length;

      // Determine badge
      let badgeHtml = '';
      if (urgCount > 0) {
        badgeHtml = '<span class="section-badge"><span class="dot dot-red"></span><span style="color:var(--err)">' + urgCount + ' urgente(s)</span></span>';
        if (atcCount > 0) badgeHtml += ' <span class="section-badge" style="margin-left:8px"><span class="dot dot-orange"></span><span style="color:var(--warn)">' + atcCount + ' atencao</span></span>';
      } else if (atcCount > 0) {
        badgeHtml = '<span class="section-badge"><span class="dot dot-orange"></span><span style="color:var(--warn)">' + atcCount + ' atencao</span></span>';
      } else {
        badgeHtml = '<span class="section-badge"><span class="dot dot-green"></span><span style="color:var(--ok)">Tudo em dia</span></span>';
      }

      // Auto-open if has alerts
      const openClass = totalCount > 0 ? ' open' : '';

      html += '<div class="alert-section' + openClass + '" data-section="' + sec.id + '">';
      html += '<div class="section-header" onclick="toggleSection(this)">';
      html += '<div class="section-left">';
      html += '<div class="section-icon ' + sec.iconClass + '">' + sec.icon + '</div>';
      html += '<div><div class="section-title">' + sec.title + '</div>';
      html += '<div class="section-subtitle">' + sec.subtitle + '</div></div>';
      html += '</div>';
      html += '<div style="display:flex;align-items:center;">' + badgeHtml;
      html += '<span class="section-chevron">&#9660;</span>';
      html += '</div>';
      html += '</div>';

      html += '<div class="section-body"><div class="section-content">';

      if (alerts.length === 0) {
        html += '<div class="empty-section">';
        html += '<div class="icon-ok">&#10003;</div>';
        html += 'Nenhum alerta nesta categoria';
        html += '</div>';
      } else {
        html += '<div class="alert-list">';
        alerts.forEach(a => {
          const cardClass = a.nivel === 'urgente' ? 'urgente' : (a.nivel === 'atencao' ? 'atencao' : 'ok-card');
          const levelClass = a.nivel === 'urgente' ? 'level-red' : (a.nivel === 'atencao' ? 'level-orange' : 'level-green');
          const daysClass = a.nivel === 'urgente' ? 'days-red' : (a.nivel === 'atencao' ? 'days-orange' : 'days-green');

          let daysLabel;
          if (a.dias < 0) {
            daysLabel = Math.abs(a.dias) + 'd atras';
          } else if (a.dias === 0) {
            daysLabel = 'HOJE';
          } else {
            daysLabel = a.dias + 'd';
          }

          let levelLabel;
          if (a.dias <= 0) levelLabel = '!!';
          else if (a.dias <= 7) levelLabel = '!';
          else levelLabel = a.dias + 'd';

          html += '<div class="alert-card ' + cardClass + '">';
          html += '<div class="alert-level ' + levelClass + '">' + levelLabel + '</div>';
          html += '<div class="alert-info">';
          html += '<div class="alert-name">' + esc(a.nome) + '</div>';
          html += '<div class="alert-detail">' + esc(a.detalhe) + '</div>';
          html += '</div>';
          html += '<div class="alert-meta">';
          html += '<div class="alert-days ' + daysClass + '">' + daysLabel + '</div>';
          html += '<div class="alert-date">' + fmtDate(a.dataRef) + '</div>';
          html += '</div>';
          html += '<a href="' + a.link + '" class="alert-action">' + a.linkLabel + '</a>';
          html += '</div>';
        });
        html += '</div>';
      }

      html += '</div></div>';
      html += '</div>';
    });

    container.innerHTML = html;
  }

  // ── Section toggle ──
  window.toggleSection = function(header) {
    header.closest('.alert-section').classList.toggle('open');
  };

  // ── Filter buttons ──
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderSections();
    });
  });

  // ── Initial load ──
  await loadData();

  // ── Auto-refresh every 5 minutes ──
  setInterval(async () => {
    allAlerts = [];
    await loadData();
  }, 5 * 60 * 1000);

})();
</script>
</body>
</html>
