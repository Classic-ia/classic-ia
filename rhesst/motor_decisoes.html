<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor de Decisoes — Classic RH & SST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="rh_auth.js"></script>
<script src="rh_api.js"></script>
<style>
:root{--bg:#07111c;--surface:#0d1b2a;--surface2:#112233;--surface3:#1a3040;--border:#1e3a52;--accent:#c8a96e;--text:#e8f0f5;--muted:#5d7f95;--ok:#27ae60;--warn:#f39c12;--err:#e74c3c;--info:#2E6B8A}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(46,107,138,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(46,107,138,.04) 1px,transparent 1px);background-size:40px 40px}
.header{position:sticky;top:0;z-index:100;background:rgba(7,17,28,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:12px}
.back-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;text-decoration:none;font-family:'DM Sans'}
.back-btn:hover{color:var(--text);border-color:var(--accent)}
.page-title{font-family:'Syne';font-weight:800;font-size:18px;color:var(--accent)}
.page-sub{font-size:11px;color:var(--muted)}
.main{max-width:1100px;margin:0 auto;padding:24px 20px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.kpi-val{font-family:'Syne';font-weight:800;font-size:24px;color:var(--accent)}
.kpi-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.section-title{font-family:'Syne';font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.problem-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden;transition:.2s}
.problem-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.problem-header{padding:16px 18px;cursor:pointer;display:flex;align-items:flex-start;gap:14px}
.problem-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.risk-alto .problem-icon{background:rgba(231,76,60,.15)}
.risk-medio .problem-icon{background:rgba(243,156,18,.15)}
.risk-baixo .problem-icon{background:rgba(46,107,138,.15)}
.problem-title{font-family:'Syne';font-weight:700;font-size:14px;margin-bottom:4px}
.problem-diag{font-size:12px;color:var(--muted);line-height:1.5}
.problem-causa{font-size:11px;color:var(--warn);margin-top:6px;font-style:italic}
.problem-meta{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600}
.tag-red{background:rgba(231,76,60,.15);color:var(--err)}
.tag-yellow{background:rgba(243,156,18,.15);color:var(--warn)}
.tag-green{background:rgba(39,174,96,.15);color:var(--ok)}
.tag-blue{background:rgba(46,107,138,.15);color:var(--info)}
.problem-body{padding:0 18px 16px;display:none}
.problem-card.open .problem-body{display:block}
.action-list{list-style:none;padding:0}
.action-item{background:var(--surface2);border-radius:10px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px}
.action-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s}
.action-check:hover{border-color:var(--ok)}
.action-check.done{background:var(--ok);border-color:var(--ok);color:#fff;font-size:12px}
.action-text{flex:1;font-size:13px}
.action-resp{font-size:10px;color:var(--muted);text-transform:uppercase;background:var(--surface3);padding:2px 8px;border-radius:4px}
.action-prazo{font-size:10px;color:var(--warn)}
.impacto{font-family:'DM Mono';font-size:14px;font-weight:700;color:var(--err)}
.spinner{width:20px;height:20px;border:2px solid var(--surface3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){.kpi-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <a href="app.html" class="back-btn">← Voltar</a>
    <div><div class="page-title">Motor de Decisoes</div><div class="page-sub">Deteccao automatica + diagnostico + plano de acao</div></div>
  </div>
  <div id="rh-user-chip"></div>
</div>
<div class="main">
  <div class="kpi-row" id="kpis">
    <div class="kpi"><div class="kpi-val" id="k-problemas">—</div><div class="kpi-lbl">Problemas Detectados</div></div>
    <div class="kpi"><div class="kpi-val" id="k-risco">—</div><div class="kpi-lbl">Alto Risco</div></div>
    <div class="kpi"><div class="kpi-val" id="k-acoes">—</div><div class="kpi-lbl">Acoes Necessarias</div></div>
    <div class="kpi"><div class="kpi-val" id="k-impacto">—</div><div class="kpi-lbl">Impacto Total (R$)</div></div>
  </div>
  <div class="section-title">Problemas Detectados</div>
  <div id="problems"><div style="text-align:center;padding:40px;color:var(--muted)"><div class="spinner"></div> Analisando dados...</div></div>
</div>
<script>
const ICONS = {recorrencia:'🔄',afastamento_prolongado:'🏥',setor_critico:'🏭',sst_epi:'🛡️'};
const RISK_LABELS = {alto:'Alto Risco',medio:'Medio',baixo:'Baixo'};
const RESP_LABELS = {rh:'RH',sst:'SST',gestor:'Gestor',sistema:'Sistema',administrador:'Admin'};

document.addEventListener('DOMContentLoaded', async () => {
  await RHAuth.init();
  const jwt = RHAuth.getAuthToken();
  try {
    const r = await fetch(`${SB_URL}/rest/v1/rpc/motor_decisoes`, {
      method:'POST', headers:{'Authorization':'Bearer '+jwt,'apikey':SB_KEY,'Content-Type':'application/json'}, body:'{}'
    });
    const data = await r.json();
    render(data);
  } catch(e) {
    document.getElementById('problems').innerHTML = `<div style="color:var(--err);text-align:center;padding:40px">Erro: ${e.message}</div>`;
  }
});

function render(d) {
  document.getElementById('k-problemas').textContent = d.total_problemas;
  document.getElementById('k-risco').textContent = d.resumo.alto_risco;
  document.getElementById('k-risco').style.color = d.resumo.alto_risco > 0 ? 'var(--err)' : 'var(--ok)';
  document.getElementById('k-acoes').textContent = d.resumo.acoes_total;
  document.getElementById('k-impacto').textContent = 'R$ ' + Number(d.resumo.impacto_total).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});

  const el = document.getElementById('problems');
  if (!d.problemas || d.problemas.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--ok);font-size:16px">Nenhum problema detectado</div>';
    return;
  }

  el.innerHTML = d.problemas.map((p, i) => {
    const icon = ICONS[p.tipo] || '⚠️';
    const riskClass = 'risk-' + (p.risco || 'baixo');
    const riskTag = p.risco === 'alto' ? 'tag-red' : p.risco === 'medio' ? 'tag-yellow' : 'tag-blue';
    const title = p.funcionario ? p.funcionario : (p.setor || p.tipo);
    const subtitle = p.funcionario ? `${p.cargo || ''} — ${p.setor || ''}` : '';

    return `
    <div class="problem-card ${riskClass}" id="card-${i}">
      <div class="problem-header" onclick="document.getElementById('card-${i}').classList.toggle('open')">
        <div class="problem-icon">${icon}</div>
        <div style="flex:1">
          <div class="problem-title">${title}</div>
          ${subtitle ? `<div style="font-size:11px;color:var(--muted)">${subtitle}</div>` : ''}
          <div class="problem-diag">${p.diagnostico}</div>
          <div class="problem-causa">${p.causa_provavel || ''}</div>
          <div class="problem-meta">
            <span class="tag ${riskTag}">${RISK_LABELS[p.risco] || p.risco}</span>
            <span class="tag tag-blue">${p.tipo.replace(/_/g,' ')}</span>
            ${p.impacto_financeiro ? `<span class="impacto">R$ ${Number(p.impacto_financeiro).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>` : ''}
          </div>
        </div>
        <div style="color:var(--muted);font-size:18px">▾</div>
      </div>
      <div class="problem-body">
        <div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Plano de Acao</div>
        <ul class="action-list">
          ${(p.plano_acao || []).map((a, j) => `
          <li class="action-item">
            <div class="action-check" onclick="this.classList.toggle('done');this.innerHTML=this.classList.contains('done')?'✓':''">
            </div>
            <div class="action-text">${a.acao}</div>
            <span class="action-resp">${RESP_LABELS[a.responsavel] || a.responsavel}</span>
            <span class="action-prazo">${a.prazo_dias}d</span>
          </li>`).join('')}
        </ul>
      </div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
