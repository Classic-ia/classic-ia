<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login &middot; Classic Couros</title>
<link rel="icon" type="image/jpeg" href="assets/logo-classic-icon.png.jpg">
<script src="config.js"></script>
<script src="cq_auth.js"></script>
<link rel="stylesheet" href="landing.css">
</head>
<body class="auth-page">

<main class="auth-card" role="main">

  <div class="auth-brand">
    <img class="auth-brand-logo" id="logoImg" src="assets/logo-classic-icon.png.jpg"
         alt="Classic Couros" onerror="this.style.display='none'">
    <div class="auth-brand-title">Classic Couros</div>
    <div class="auth-brand-sub">Acesso Restrito</div>
  </div>

  <div class="auth-expired" id="expiredBanner">
    &#9200; Sessao expirada por inatividade. Faca login novamente.
  </div>

  <form class="auth-form" onsubmit="fazerLogin(); return false;" novalidate>

    <div class="auth-field">
      <label for="inp-email">E-mail</label>
      <input type="email" id="inp-email" placeholder="usuario@classiccouros.com.br"
             autocomplete="email" autofocus>
    </div>

    <div class="auth-field">
      <label for="inp-senha">Senha</label>
      <input type="password" id="inp-senha" placeholder="Sua senha"
             autocomplete="current-password">
    </div>

    <div class="auth-error" id="errMsg" role="alert">
      <span>&#9888;</span>
      <span id="errTxt"></span>
    </div>

    <button class="auth-btn" type="submit" id="btnLogin">
      <div class="spinner" id="spinner"></div>
      <span id="btnTxt">Entrar</span>
    </button>

  </form>

  <div class="auth-links">
    <button onclick="entrarModoDemo()">Modo demonstracao (sem servidor)</button>
    <a href="rh/login.html">Ir para RH &amp; Seguranca do Trabalho</a>
  </div>

  <div class="auth-footer">Classic Couros &middot; 2026</div>

</main>

<script>
(function(){
  var el = document.getElementById('logoImg');
  var s = localStorage.getItem('classic_logo');
  if (s) el.src = s;

  try {
    var raw = localStorage.getItem('cq_sess_v2');
    if (raw) {
      var sess = JSON.parse(raw);
      if (sess.token && sess.user && sess.ts) {
        var umHora = 60 * 60 * 1000;
        var idade  = Date.now() - (sess.ts || 0);
        var temJwt = !!sess.access_token;
        var isDemoToken = sess.token && sess.token.startsWith('demo-');
        if (idade < umHora && (temJwt || isDemoToken)) {
          window.location.href = 'app.html';
          return;
        } else {
          localStorage.removeItem('cq_sess_v2');
        }
      } else {
        localStorage.removeItem('cq_sess_v2');
      }
    }
  } catch(e) {
    localStorage.removeItem('cq_sess_v2');
  }

  var params = new URLSearchParams(window.location.search);
  if (params.get('exp') === '1') {
    document.getElementById('expiredBanner').classList.add('visible');
  }
})();

async function fazerLogin() {
  var email = document.getElementById('inp-email').value.trim();
  var senha = document.getElementById('inp-senha').value;
  var btn   = document.getElementById('btnLogin');
  var err   = document.getElementById('errMsg');
  var spin  = document.getElementById('spinner');
  var txt   = document.getElementById('btnTxt');

  err.classList.remove('visible');
  document.getElementById('inp-email').classList.remove('error');
  document.getElementById('inp-senha').classList.remove('error');

  if (!email) {
    document.getElementById('inp-email').classList.add('error');
    mostrarErro('Informe o e-mail'); return;
  }
  if (!senha) {
    document.getElementById('inp-senha').classList.add('error');
    mostrarErro('Informe a senha'); return;
  }

  btn.disabled = true;
  spin.style.display = 'block';
  txt.textContent = 'Entrando...';

  try {
    await CQAuth.login(email, senha);
    var params = new URLSearchParams(window.location.search);
    window.location.href = params.get('next') || 'app.html';
  } catch (e) {
    mostrarErro(e.message || 'Erro ao conectar. Tente novamente.');
    btn.disabled = false;
    spin.style.display = 'none';
    txt.textContent = 'Entrar';
  }
}

function mostrarErro(msg) {
  document.getElementById('errTxt').textContent = msg;
  document.getElementById('errMsg').classList.add('visible');
}
</script>
</body>
</html>
