<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07111c; --surface: #0d1b2a; --surface2: #162535; --border: #1e3a52;
    --accent: #c8a96e; --accent2: #e8c98e; --text: #e8f0f5; --muted: #5d7f95;
    --blue: #2E6B8A; --blue2: #3d8aad;
    --green: #27ae60; --yellow: #f39c12; --red: #e74c3c; --orange: #e67e22;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
  .bg-pattern {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(46,107,138,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46,107,138,.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  header {
    position:sticky; top:0; z-index:100;
    background:rgba(7,17,28,.92); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:14px 24px; display:flex; align-items:center; justify-content:space-between;
  }
  .logo { display:flex; align-items:center; gap:12px; }
  .logo-icon {
    width:36px; height:36px;
    background:linear-gradient(135deg,#1a3a52,var(--blue));
    border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .logo-text { font-family:'Syne',sans-serif; font-size:18px; font-weight:800; letter-spacing:0.05em; }
  .logo-text span { color:var(--accent); }
  .header-right { display:flex; align-items:center; gap:16px; }
  #headerUser { font-size:12px; color:var(--muted); }
  .btn-sair {
    background:transparent; border:1px solid var(--border); border-radius:8px;
    color:var(--muted); font-size:11px; padding:6px 14px; cursor:pointer;
    letter-spacing:0.08em; text-transform:uppercase; transition:all 0.2s;
  }
  .btn-sair:hover { border-color:var(--blue); color:var(--text); }
  .btn-cq {
    background:transparent; border:1px solid var(--border); border-radius:8px;
    color:var(--muted); font-size:11px; padding:6px 14px; cursor:pointer;
    letter-spacing:0.08em; text-transform:uppercase; transition:all 0.2s;
    text-decoration:none;
  }
  .btn-cq:hover { border-color:var(--blue); color:var(--text); }

  main { position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:32px 24px; }
  .welcome { margin-bottom:32px; padding-bottom:20px; border-bottom:1px solid var(--border); }
  .welcome-tag { font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
  .welcome-title { font-family:'Syne',sans-serif; font-size:26px; font-weight:800; line-height:1.15; }
  .welcome-title span { color:var(--accent); }
  .welcome-sub { font-size:13px; color:var(--muted); margin-top:6px; }
  .welcome-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .btn-refresh {
    background:transparent; border:1px solid var(--border); border-radius:8px;
    color:var(--muted); font-size:11px; padding:6px 14px; cursor:pointer;
    letter-spacing:0.06em; transition:all 0.2s; font-family:'DM Sans',sans-serif;
    flex-shrink:0;
  }
  .btn-refresh:hover { border-color:var(--blue); color:var(--text); }
  .btn-refresh.loading { opacity:.5; pointer-events:none; }

  .section-block { margin-bottom:36px; }
  .section-title {
    font-family:'Syne',sans-serif;
    font-size:11px; font-weight:700;
    letter-spacing:0.18em; text-transform:uppercase;
    color:var(--muted);
    margin-bottom:14px;
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
  }
  .section-title::before {
    content:''; width:3px; height:12px;
    background:var(--accent); border-radius:1px; display:inline-block;
  }

  .grid-ops { display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; }
  .card-ops {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:24px 22px; min-height:140px;
    cursor:pointer; text-decoration:none; color:var(--text);
    display:block; position:relative;
    transition:border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    animation:fadeIn 0.4s ease both;
  }
  .card-ops:hover {
    border-color:var(--blue); transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .card-ops .card-icon { font-size:28px; margin-bottom:12px; }
  .card-ops .card-title { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; letter-spacing:0.04em; margin-bottom:6px; }
  .card-ops .card-desc { font-size:12px; color:var(--muted); line-height:1.5; }
  .card-badge {
    display:inline-block; margin-top:10px;
    font-size:9px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--accent); border:1px solid rgba(200,169,110,0.25); border-radius:6px; padding:2px 8px;
  }
  /* Card indicators — max 2 per card */
  .card-indicators { display:flex; gap:12px; margin-top:12px; }
  .card-ind {
    display:flex; align-items:baseline; gap:4px;
  }
  .card-ind-val {
    font-family:'Syne',sans-serif; font-size:18px; font-weight:800;
  }
  .card-ind-val.ok { color:var(--green); }
  .card-ind-val.warn { color:var(--yellow); }
  .card-ind-val.err { color:var(--red); }
  .card-ind-val.neutral { color:var(--accent); }
  .card-ind-label { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }

  .grid-3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:20px; cursor:pointer; text-decoration:none; color:var(--text);
    display:block; transition:border-color 0.2s,transform 0.15s;
    animation:fadeIn 0.4s ease both;
  }
  .card:hover { border-color:var(--blue); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.3); }
  .card-icon { font-size:24px; margin-bottom:12px; }
  .card-title { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; letter-spacing:0.04em; margin-bottom:4px; }
  .card-desc { font-size:11px; color:var(--muted); line-height:1.5; }

  @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
  .card-ops:nth-child(1){animation-delay:0.05s}
  .card-ops:nth-child(2){animation-delay:0.10s}
  .card-ops:nth-child(3){animation-delay:0.15s}
  .card-ops:nth-child(4){animation-delay:0.20s}
  .card-ops:nth-child(5){animation-delay:0.25s}

  .hidden { display:none !important; }

  /* KPI Strip */
  .kpi-strip {
    position:relative; z-index:1;
    display:flex; gap:0; justify-content:center;
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:0;
  }
  .kpi-box {
    flex:1; max-width:280px; padding:16px 24px;
    text-align:center; border-right:1px solid var(--border);
  }
  .kpi-box:last-child { border-right:none; }
  .kpi-box.clickable { cursor:pointer; transition: background 0.2s; }
  .kpi-box.clickable:hover { background: rgba(46,107,138,0.08); }
  .kpi-value {
    font-family:'Syne',sans-serif; font-size:26px; font-weight:800;
    color:var(--accent); line-height:1;
  }
  .kpi-label {
    font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--muted); margin-top:4px;
  }

  /* Alerts strip */
  .alertas-strip {
    position:relative; z-index:1;
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:12px 24px; display:flex; gap:14px; flex-wrap:wrap; align-items:center;
  }
  .alerta-chip {
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 14px; border-radius:8px; font-size:11px; font-weight:600;
    cursor:pointer; text-decoration:none; color:var(--text);
    transition:all .2s; border:1px solid transparent;
  }
  .alerta-chip:hover { transform:translateY(-1px); }
  .alerta-chip.crit { background:rgba(231,76,60,.12); border-color:rgba(231,76,60,.3); }
  .alerta-chip.crit .alerta-dot { background:var(--red); }
  .alerta-chip.warn { background:rgba(243,156,18,.10); border-color:rgba(243,156,18,.25); }
  .alerta-chip.warn .alerta-dot { background:var(--yellow); }
  .alerta-chip.info { background:rgba(46,107,138,.10); border-color:rgba(46,107,138,.25); }
  .alerta-chip.info .alerta-dot { background:var(--blue); }
  .alerta-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .alerta-count { font-family:'Syne',sans-serif; font-weight:800; }
  .alertas-label {
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); font-weight:700; margin-right:4px;
  }

  /* Roadmap — visually secondary */
  .roadmap-section {
    margin-top:32px; padding-top:24px; border-top:1px solid var(--border);
    opacity:0.7; transition:opacity .3s;
  }
  .roadmap-section:hover { opacity:1; }
  .roadmap-title {
    font-family:'Syne',sans-serif; font-size:10px; font-weight:700;
    letter-spacing:0.18em; text-transform:uppercase; color:var(--muted);
    margin-bottom:12px; display:flex; align-items:center; gap:8px;
  }
  .roadmap-title::before {
    content:''; width:2px; height:10px; background:var(--border); display:inline-block;
  }
  .roadmap-grid { display:flex; gap:12px; flex-wrap:wrap; }
  .roadmap-chip {
    font-size:10px; color:var(--muted); padding:4px 12px;
    border:1px solid var(--border); border-radius:6px;
    letter-spacing:.04em;
  }

  @media (max-width:768px) {
    .grid-ops { grid-template-columns:1fr; }
    .grid-3   { grid-template-columns:1fr; }
    .kpi-strip { flex-direction:column; }
    .kpi-box { border-right:none; border-bottom:1px solid var(--border); }
    .kpi-box:last-child { border-bottom:none; }
    .alertas-strip { padding:10px 16px; }
    header { padding:12px 16px; }
    main { padding:24px 16px; }
    .welcome-title { font-size:22px; }
  }
  @media (min-width:769px) and (max-width:1024px) {
    .grid-3 { grid-template-columns:repeat(2, 1fr); }
  }
</style>
</head>

/* ═══════════════════════════════════════
   dashboard_executivo_corporativo()
   Centraliza consultas reais para KPIs,
   alertas e indicadores dos cards.
   Cache em memória para evitar queries duplicadas.
   ═══════════════════════════════════════ */
const _execCache = {};

function _dateTokens() {
  const hoje = new Date().toISOString().slice(0,10);
  const d30 = new Date(Date.now() + 30*86400000).toISOString().slice(0,10);
  const now = new Date();
  const comp = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  return { hoje, d30, comp };
}

async function _resolveQuery(query) {
  if (_execCache[query] !== undefined) return _execCache[query];
  const tk = _dateTokens();
  // Special KPI handlers
  if (query === '_kpi_aso_vencer') {
    try {
      const rows = await RH_API.get(`rh_aso?data_validade=gte.${tk.hoje}&data_validade=lte.${tk.d30}&select=id`);
      const v = (rows || []).length;
      _execCache[query] = v;
      return v;
    } catch(e) { _execCache[query] = 0; return 0; }
  }
  if (query === '_kpi_apuracao') {
    try {
      const rows = await RH_API.get(`rh_apuracao_mensal?competencia=eq.${tk.comp}&select=id,status`);
      if (rows && rows.length > 0) {
        const pend = rows.filter(r => r.status !== 'validado').length;
        const v = pend > 0 ? pend + ' pend.' : 'OK';
        _execCache[query] = v;
        return v;
      }
      _execCache[query] = 'N/A';
      return 'N/A';
    } catch(e) { _execCache[query] = 'N/A'; return 'N/A'; }
  }
  // Generic count query
  try {
    let q = query.replace(/\{hoje\}/g, tk.hoje).replace(/\{d30\}/g, tk.d30);
    const rows = await RH_API.get(q);
    const v = (rows || []).length;
    _execCache[query] = v;
    return v;
  } catch(e) { _execCache[query] = 0; return 0; }
}

/* Refresh manual — limpa cache e recarrega tudo */
async function refreshDados() {
  const btn = document.getElementById('btnRefresh');
  if (btn) btn.classList.add('loading');
  // Limpar cache
  Object.keys(_execCache).forEach(k => delete _execCache[k]);
  // Limpar alertas (re-render)
  const strip = document.getElementById('alertasStrip');
  strip.style.display = '';
  strip.querySelectorAll('.alerta-chip').forEach(el => el.remove());
  try {
    await Promise.all([
      dashboard_executivo_corporativo(),
      renderAlertas(),
      carregarIndicadoresCards()
    ]);
  } catch(e) { console.warn('Refresh:', e); }
  if (btn) btn.classList.remove('loading');
}

async function dashboard_executivo_corporativo() {
  const tk = _dateTokens();
  const results = {};

  // KPIs do topo — queries reais paralelas
  const [ativos, asoVencer, vagas, apuracao] = await Promise.all([
    _resolveQuery('rh_funcionarios?status=eq.ativo&select=id'),
    _resolveQuery('_kpi_aso_vencer'),
    _resolveQuery('rs_vagas?status=eq.aberta&select=id'),
    _resolveQuery('_kpi_apuracao')
  ]);

  results.kpiAtivos = ativos;
  results.kpiAsoVencer = asoVencer;
  results.kpiVagas = vagas;
  results.kpiApuracao = apuracao;

  // Renderizar KPIs no topo
  document.getElementById('kpiAtivos').textContent = ativos;
  document.getElementById('kpiAsoVencer').textContent = asoVencer;
  document.getElementById('kpiVagas').textContent = vagas;
  document.getElementById('kpiApuracao').textContent = typeof apuracao === 'number' ? apuracao : apuracao;

  return results;
}

/* ═══════════════════════════════════════
   Alertas — renderiza chips com dados reais,
   cada chip leva a rota filtrada
   ═══════════════════════════════════════ */
async function renderAlertas() {
  const strip = document.getElementById('alertasStrip');
  const promises = ALERTAS_CONFIG.map(async (a) => {
    const val = await _resolveQuery(a.query);
    const num = typeof val === 'number' ? val : parseInt(val) || 0;
    if (num < a.minimo) return null;
    return { ...a, valor: num };
  });
  const alertas = (await Promise.all(promises)).filter(Boolean);

  if (alertas.length === 0) {
    strip.style.display = 'none';
    return;
  }

  alertas.forEach(a => {
    const chip = document.createElement('a');
    chip.className = 'alerta-chip ' + a.nivel;
    chip.href = a.href;
    chip.innerHTML = `<span class="alerta-dot"></span><span class="alerta-count">${a.valor}</span> ${a.label}`;
    strip.appendChild(chip);
  });
}

/* ═══════════════════════════════════════
   Render Sections — com indicadores (max 2)
   ═══════════════════════════════════════ */
function renderSections(perfilUsuario) {
  const container = document.getElementById('sectionsContainer');
  container.innerHTML = '';

  SECTIONS.forEach(section => {
    const visiveis = section.modulos.filter(m => m.perfis.includes(perfilUsuario));
    if (visiveis.length === 0) return;

    const block = document.createElement('div');
    block.className = 'section-block';

    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = section.titulo;
    block.appendChild(title);

    const grid = document.createElement('div');
    grid.className = section.gridClass;

    visiveis.forEach((m, i) => {
      const a = document.createElement('a');
      a.className = section.cardClass;
      a.href = m.href;
      a.style.animationDelay = (i * 0.05 + 0.05) + 's';

      const iconHtml = m.icon
        ? `<img src="${m.icon}" alt="" style="width:28px;height:28px;object-fit:contain;" onerror="this.outerHTML='<span style=font-size:28px>${m.iconFallback || ''}</span>'">`
        : `<span style="font-size:28px">${m.iconFallback || ''}</span>`;

      // Indicadores placeholder (max 2)
      const inds = (m.indicadores || []).slice(0, 2);
      const indHtml = inds.length > 0
        ? `<div class="card-indicators">${inds.map(ind =>
            `<div class="card-ind"><span class="card-ind-val neutral" id="${ind.id}">--</span><span class="card-ind-label">${ind.label}</span></div>`
          ).join('')}</div>`
        : '';

      a.innerHTML = `
        <div class="card-icon">${iconHtml}</div>
        <div class="card-title">${m.titulo}</div>
        <div class="card-desc">${m.desc}</div>
        ${indHtml}
        <div class="card-badge">${m.badge}</div>`;
      grid.appendChild(a);
    });

    block.appendChild(grid);
    container.appendChild(block);
  });
}

/* Preenche indicadores dos cards com dados reais */
async function carregarIndicadoresCards() {
  const todos = [];
  SECTIONS.forEach(s => s.modulos.forEach(m => {
    (m.indicadores || []).slice(0, 2).forEach(ind => todos.push(ind));
  }));
  await Promise.all(todos.map(async (ind) => {
    const val = await _resolveQuery(ind.query);
    const el = document.getElementById(ind.id);
    if (!el) return;
    el.textContent = val;
    // Aplicar classe de criticidade
    const crit = ind.criticidade || 'neutral';
    el.className = 'card-ind-val';
    if (typeof val === 'number' && val > 0 && crit !== 'neutral') {
      el.classList.add(crit);
    } else {
      el.classList.add(val === 0 ? 'ok' : 'neutral');
    }
  }));
}

/* ═══════════════════════════════════════
   Roadmap — visualmente secundario
   ═══════════════════════════════════════ */
function renderRoadmap() {
  const container = document.getElementById('roadmapContainer');
  if (!ROADMAP_CONFIG || ROADMAP_CONFIG.length === 0) { container.style.display = 'none'; return; }
  container.innerHTML = `
    <div class="roadmap-title">Roadmap</div>
    <div class="roadmap-grid">
      ${ROADMAP_CONFIG.map(item => `<span class="roadmap-chip">${item}</span>`).join('')}
    </div>`;
}

function traduzPerfil(p) {
  const t = {administrador:'Administrador',rh:'Recursos Humanos',sst:'SST',diretoria:'Diretoria',financeiro:'Financeiro',gestor:'Gestor'};
  return t[p] || p;
}

/* ═══════════════════════════════════════
   Init
   ═══════════════════════════════════════ */
(async () => {
  const perfil = await RHAuth.init();
  if (!perfil) return;

  // Perfil "qualidade" nao tem modulos RH — redirecionar para CQ
  if (perfil.perfil === 'qualidade') {
    window.location.href = 'index_2.html';
    return;
  }

  document.getElementById('headerUser').textContent =
    (perfil.nome || perfil.email) + ' \u00b7 ' + traduzPerfil(perfil.perfil);
  document.getElementById('welcomeSub').textContent =
    'Bem-vindo, ' + (perfil.nome || perfil.email) + '. Selecione um modulo abaixo.';

  renderSections(perfil.perfil);
  renderRoadmap();

  // Dados reais — paralelo
  await Promise.all([
    dashboard_executivo_corporativo(),
    renderAlertas(),
    carregarIndicadoresCards()
  ]);
})();
</script>
