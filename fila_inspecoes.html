<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0e0e">
<title>Fila de Inspeções — Classic CQ</title>
<link rel="stylesheet" href="ds.css">
</head>
<body class="page-bg">

<!-- HEADER -->
<div class="header">
  <a href="app.html" class="back-link">← Menu</a>
  <div class="header-info">
    <div class="header-title">Fila de Inspeções</div>
    <div class="header-sub">Controle de Qualidade — Classic Couros</div>
  </div>
  <div id="cq-user-chip"></div>
</div>

<div class="page">

  <!-- CONTADORES -->
  <div class="counters" id="contadores"></div>

  <!-- FILTROS -->
  <div class="filtros">
    <select class="filtro-input" id="filtro-status" style="min-width:160px;">
      <option value="">Todos os status</option>
      <option value="aguardando_inspecao">Aguardando Inspeção</option>
      <option value="inspecionado">Inspecionado</option>
      <option value="rascunho">Rascunho</option>
      <option value="em_analise">Em Análise</option>
      <option value="aguardando_revisao">Aguardando Revisão</option>
      <option value="aprovada">Aprovada</option>
      <option value="reprovada">Reprovada</option>
      <option value="encerrada">Encerrada</option>
    </select>
    <div id="filtro-forn-container" style="flex:1;min-width:180px;"></div>
    <input type="hidden" id="filtro-fornecedor" value="">
    <input type="text" class="filtro-input" id="filtro-produto" placeholder="Produto...">
    <input type="text" class="filtro-input" id="filtro-lote" placeholder="Lote (requisição)...">
    <input type="text" class="filtro-input" id="filtro-etiqueta" placeholder="Etiqueta...">
    <input type="date" class="filtro-input" id="filtro-data-inicio" style="min-width:130px;">
    <input type="date" class="filtro-input" id="filtro-data-fim" style="min-width:130px;">
    <button class="filtro-input" id="btn-filtrar" style="
      min-width:auto;flex:0;cursor:pointer;
      background:var(--accent3);border-color:var(--accent);
      color:var(--accent);font-weight:600;
    ">Filtrar</button>
    <button class="filtro-input" id="btn-limpar" style="
      min-width:auto;flex:0;cursor:pointer;
      color:var(--muted);font-weight:500;
    ">Limpar</button>
  </div>

  <!-- AÇÃO RÁPIDA -->
  <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
    <a href="inspecao_qualidade.html" id="btn-nova" style="
      display:none;padding:8px 18px;border-radius:var(--radius-sm);
      background:var(--accent);color:#0e0e0e;font-size:13px;font-weight:700;
      text-decoration:none;transition:all .2s;
    ">+ Nova Inspeção</a>
  </div>

  <!-- ALERTAS DE QUALIDADE -->
  <div class="alertas-section" id="alertas-section" style="display:none;">
    <div class="alertas-title">
      🚨 Alertas de Qualidade — Omaso
      <span class="badge-count" id="alertas-count">0</span>
    </div>
    <div id="alertas-container"></div>
  </div>

  <!-- SELECIONAR TODOS -->
  <div class="sel-todos" id="sel-todos">
    <label>
      <input type="checkbox" class="insp-check" id="chk-todos" onchange="toggleTodos(this.checked)">
      Selecionar todas
    </label>
  </div>

  <!-- LISTA -->
  <div id="lista-container">
    <div class="loading">
      <div class="spinner"></div>
      <div style="font-size:12px;color:var(--muted);">Carregando inspeções...</div>
    </div>
  </div>

  <!-- PAGINAÇÃO -->
  <div class="paginacao" id="paginacao"></div>

</div>

<!-- BARRA FLUTUANTE DE SELEÇÃO -->
<div class="sel-bar" id="sel-bar">
  <span class="sel-bar-count" id="sel-bar-count">0 selecionadas</span>
  <div class="sel-bar-actions">
    <button class="sel-bar-btn whatsapp" onclick="enviarWhatsApp()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      WhatsApp
    </button>
    <button class="sel-bar-btn email" onclick="enviarEmail()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      Email
    </button>
    <button class="sel-bar-btn cancelar" onclick="limparSelecao()">Cancelar</button>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script src="config.js"></script>
<script src="cq_api.js"></script>
<script src="cq_auth.js"></script>
<script src="cq_workflow.js"></script>
<script src="cq_fornecedores.js"></script>
<script>
// ══════════════════════════════════════════════════════════
// FILA DE INSPEÇÕES — Classic CQ
// ══════════════════════════════════════════════════════════

let paginaAtual = 1;
const POR_PAGINA = 20;
let filtroStatusAtivo = '';
let _dadosAtuais = [];
const _selecionados = new Map(); // id → dados da inspeção

// ── INIT ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  const user = await CQAuth.init({
    perfisPermitidos: ['administrador','qualidade','diretoria','financeiro'],
  });
  if (!user) return;

  CQWorkflow.injetarCSS();

  // Botão "Nova Inspeção" só para quem pode criar
  if (['administrador','qualidade'].includes(user.perfil)) {
    document.getElementById('btn-nova').style.display = 'inline-block';
  }

  // Fornecedor dropdown (seleção via componente CQFornecedores)
  if (typeof CQFornecedores !== 'undefined') {
    CQFornecedores.renderizar('filtro-forn-container', function(f) {
      document.getElementById('filtro-fornecedor').value = f.nome || f.codigo || '';
    });
    // Ajustar estilo do input gerado pelo componente
    setTimeout(() => {
      const fi = document.querySelector('#filtro-forn-container input');
      if (fi) {
        fi.classList.add('filtro-input');
        fi.placeholder = 'Fornecedor...';
        fi.style.width = '100%';
      }
    }, 50);
  }

  // Eventos
  document.getElementById('btn-filtrar').onclick = () => { paginaAtual = 1; carregarLista(); };
  document.getElementById('btn-limpar').onclick = limparFiltros;
  document.getElementById('filtro-status').onchange = () => { paginaAtual = 1; carregarLista(); };

  // Enter para filtrar em campos de texto
  ['filtro-produto','filtro-lote','filtro-etiqueta'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') { paginaAtual = 1; carregarLista(); }
    });
  });

  // Carregar
  await carregarAlertasQualidade();
  await carregarContadores();
  await carregarLista();
});

// ── HELPERS SUPABASE ──────────────────────────────────────
function _sbHeaders() {
  const SB_KEY = CQAuth.getSbKey();
  const JWT = CQAuth.getAuthToken() || SB_KEY;
  return { 'apikey': SB_KEY, 'Authorization': `Bearer ${JWT}` };
}
async function _sbGet(endpoint) {
  const r = await fetch(`${CQAuth.getSbUrl()}/rest/v1/${endpoint}`, { headers: _sbHeaders() });
  if (!r.ok) return [];
  return await r.json();
}

// ── BUSCAR PCRs + CRUZAR COM INSPEÇÕES ──────────────────
let _todosRecebimentos = [];
let _inspecoesExistentes = {};

async function carregarDadosFila() {
  // 1. Buscar TODOS os recebimentos (PCRs importadas)
  _todosRecebimentos = await _sbGet('cq_recebimentos?select=*&order=criado_em.desc&limit=500');

  // 2. Buscar inspeções já feitas (por lote) para cruzar
  const inspecoes = await _sbGet('registros_cq_inspecao?select=id,id_inspecao,lote_atak,fornecedor,produto,status_workflow,percentual_defeitos,total_defeitos,inspetor,criado_em&order=criado_em.desc&limit=500');
  _inspecoesExistentes = {};
  for (const insp of inspecoes) {
    const key = (insp.lote_atak || '').trim();
    if (key) _inspecoesExistentes[key] = insp;
  }

  // 3. Agrupar recebimentos por lote (um lote pode ter vários produtos)
  const lotes = {};
  for (const r of _todosRecebimentos) {
    const lote = (r.lote || '').trim();
    if (!lote) continue;
    if (!lotes[lote]) {
      lotes[lote] = {
        lote,
        fornecedor: r.fornecedor || '',
        produtos: [],
        qtd_total: 0,
        data_recebimento: r.data_recebimento || r.criado_em || '',
        id_primeiro: r.id,
        numero_documento: r.numero_documento || '',
      };
    }
    lotes[lote].produtos.push(r.produto || 'Omaso Bovino');
    lotes[lote].qtd_total += parseFloat(r.qtd_recebida || r.qtd_prevista || 0);
  }

  // 4. Montar lista unificada: cada lote = 1 card
  const listaUnificada = Object.values(lotes).map(l => {
    const insp = _inspecoesExistentes[l.lote];
    const produtosUnicos = [...new Set(l.produtos)];
    return {
      id: insp ? insp.id : l.id_primeiro,
      id_inspecao: insp ? insp.id_inspecao : '',
      id_recebimento: l.numero_documento || `PCR-${l.lote}`,
      lote_atak: l.lote,
      fornecedor: insp ? insp.fornecedor : l.fornecedor,
      produto: produtosUnicos.join(', '),
      qtd_total: Math.round(l.qtd_total),
      data_recebimento: l.data_recebimento,
      criado_em: insp ? insp.criado_em : l.data_recebimento,
      status_workflow: insp ? (insp.status_workflow || 'inspecionado') : 'aguardando_inspecao',
      percentual_defeitos: insp ? insp.percentual_defeitos : null,
      total_defeitos: insp ? insp.total_defeitos : null,
      inspetor: insp ? insp.inspetor : '',
      _temInspecao: !!insp,
    };
  });

  return listaUnificada;
}

// ── CONTADORES ────────────────────────────────────────────
async function carregarContadores() {
  const container = document.getElementById('contadores');
  const statusList = [
    { key: '',                     label: 'Todas',              cor: 'var(--accent)' },
    { key: 'aguardando_inspecao',  label: 'Aguardando',         cor: '#f39c12' },
    { key: 'inspecionado',         label: 'Inspecionado',       cor: '#27ae60' },
    { key: 'aguardando_revisao',   label: 'Revisão',            cor: '#8e44ad' },
    { key: 'reprovada',            label: 'Reprovada',          cor: '#e74c3c' },
    { key: 'aprovada',             label: 'Aprovada',           cor: '#2ecc71' },
    { key: 'encerrada',            label: 'Encerrada',          cor: '#2c3e50' },
  ];

  try {
    const dados = await carregarDadosFila();
    _dadosFila = dados;

    let contagens = {};
    for (const r of dados) {
      const s = r.status_workflow || 'aguardando_inspecao';
      contagens[s] = (contagens[s] || 0) + 1;
    }

    container.innerHTML = statusList.map(s => {
      const count = s.key === '' ? dados.length : (contagens[s.key] || 0);
      const active = filtroStatusAtivo === s.key ? 'active' : '';
      return `<div class="counter-card ${active}" data-status="${s.key}" onclick="filtrarPorStatus('${s.key}')">
        <div class="counter-num" style="color:${s.cor}">${count}</div>
        <div class="counter-label">${s.label}</div>
      </div>`;
    }).join('');
  } catch (e) {
    console.error('Erro contadores:', e);
    container.innerHTML = '<div style="color:var(--muted);font-size:12px;">Erro ao carregar contadores</div>';
  }
}

function filtrarPorStatus(status) {
  filtroStatusAtivo = status;
  document.getElementById('filtro-status').value = status;
  paginaAtual = 1;
  carregarContadores();
  carregarLista();
}

// ── DADOS DA FILA ────────────────────────────────────────
let _dadosFila = [];

// ── CARREGAR LISTA ────────────────────────────────────────
async function carregarLista() {
  const container = document.getElementById('lista-container');
  container.innerHTML = '<div class="loading"><div class="spinner"></div><div style="font-size:12px;color:var(--muted);">Carregando...</div></div>';

  try {
    // Usar dados já carregados pelo carregarContadores, ou carregar agora
    if (!_dadosFila || _dadosFila.length === 0) {
      _dadosFila = await carregarDadosFila();
    }

    // Aplicar filtros locais
    const fStatus     = document.getElementById('filtro-status').value;
    const fFornecedor = (document.getElementById('filtro-fornecedor').value || '').toLowerCase().trim();
    const fProduto    = (document.getElementById('filtro-produto').value || '').toLowerCase().trim();
    const fLote       = (document.getElementById('filtro-lote').value || '').toLowerCase().trim();
    const fEtiqueta   = (document.getElementById('filtro-etiqueta').value || '').toLowerCase().trim();
    const fDataIni    = document.getElementById('filtro-data-inicio').value;
    const fDataFim    = document.getElementById('filtro-data-fim').value;

    let filtrados = _dadosFila.filter(r => {
      if (fStatus && r.status_workflow !== fStatus) return false;
      if (fFornecedor && !(r.fornecedor || '').toLowerCase().includes(fFornecedor)) return false;
      if (fProduto && !(r.produto || '').toLowerCase().includes(fProduto)) return false;
      if (fLote && !(r.lote_atak || '').toLowerCase().includes(fLote)) return false;
      if (fEtiqueta && !(r.etiqueta || '').toLowerCase().includes(fEtiqueta)) return false;
      if (fDataIni) {
        const d = (r.criado_em || r.data_recebimento || '').slice(0,10);
        if (d < fDataIni) return false;
      }
      if (fDataFim) {
        const d = (r.criado_em || r.data_recebimento || '').slice(0,10);
        if (d > fDataFim) return false;
      }
      return true;
    });

    // Paginação
    const inicio = (paginaAtual - 1) * POR_PAGINA;
    const paginados = filtrados.slice(inicio, inicio + POR_PAGINA);

    if (paginados.length === 0) {
      container.innerHTML = `<div class="lista-vazia">
        <div class="lista-vazia-icon">📋</div>
        <div class="lista-vazia-msg">Nenhum lote encontrado${fStatus ? ' com este filtro' : ''}</div>
      </div>`;
      document.getElementById('paginacao').innerHTML = '';
      document.getElementById('sel-todos').classList.remove('show');
      return;
    }

    _dadosAtuais = paginados;
    container.innerHTML = paginados.map(renderCard).join('');
    document.getElementById('sel-todos').classList.add('show');
    renderPaginacao(filtrados.length);
    atualizarBarraSelecao();
  } catch (e) {
    console.error('Erro carregarLista:', e);
    container.innerHTML = `<div class="lista-vazia">
      <div class="lista-vazia-icon">⚠️</div>
      <div class="lista-vazia-msg">Erro ao carregar: ${e.message}</div>
    </div>`;
  }
}

// ── RENDER CARD (universal — funciona com qualquer fonte de dados) ────
function renderCard(insp) {
  try {
    const statusWf = insp.status_workflow || insp.status || 'pendente_inspecao';
    const extraClass = statusWf === 'reprovada' ? 'reprovada' : (statusWf === 'aguardando_revisao' || statusWf === 'pendente_inspecao') ? 'aguardando' : '';

    const pctDefeitos = insp.percentual_defeitos != null
      ? parseFloat(insp.percentual_defeitos).toFixed(1) + '%'
      : '—';

    const pctCor = insp.percentual_defeitos > 15 ? '#e74c3c'
      : insp.percentual_defeitos > 5 ? '#f39c12'
      : '#27ae60';

    const ncCount = insp.total_ncs || 0;

    // Status badge
    const statusCores = {
      aguardando_inspecao:'#f39c12', inspecionado:'#27ae60', rascunho:'#5d7f95',
      em_analise:'#3498db', aguardando_revisao:'#8e44ad', aprovada:'#2ecc71',
      reprovada:'#e74c3c', encerrada:'#2c3e50'
    };
    const statusLabels = {
      aguardando_inspecao:'Aguardando Inspeção', inspecionado:'Inspecionado',
      rascunho:'Rascunho', em_analise:'Em Análise', aguardando_revisao:'Revisão',
      aprovada:'Aprovada', reprovada:'Reprovada', encerrada:'Encerrada'
    };
    const sc = statusCores[statusWf] || '#5d7f95';
    const statusBadge = `<span style="font-size:10px;padding:3px 10px;border-radius:4px;background:${sc}22;color:${sc};border:1px solid ${sc}40;font-weight:600;">${statusLabels[statusWf] || statusWf}</span>`;

    let statusFinalBadge = '';
    try { if (insp.status_final) statusFinalBadge = CQWorkflow.renderStatusFinalBadge(insp.status_final); } catch(e) {}

    // Data formatada — seguro
    const dataRaw = insp.criado_em || insp.created_at || insp.data_inspecao || insp.data_recebimento || insp.data_entrada || '';
    let dataFmt = '';
    try { dataFmt = CQWorkflow.formatarData(dataRaw); }
    catch(e) { dataFmt = dataRaw ? new Date(dataRaw).toLocaleDateString('pt-BR') : ''; }

    // Lote — ao clicar, abrir inspecao pre-preenchida
    const lote = insp.lote_atak || insp.lote || '';
    const fornecedor = insp.fornecedor || insp.frigorifico || '';
    const produto = insp.produto || '';
    const qtd = insp.qtd_total || insp.quantidade_lote || insp.quantidade_analisada || insp.qtd_amostra || '';
    const etiqueta = insp.etiqueta || '';

    // Se tem id de inspecao, abre a inspecao existente. Se nao, abre nova com dados pre-preenchidos
    const hasInspecaoId = insp.id && insp.id_inspecao;
    const onclickAction = hasInspecaoId
      ? `abrirInspecao('${insp.id}')`
      : `window.location.href='inspecao_qualidade.html?lote=${encodeURIComponent(lote)}&fornecedor=${encodeURIComponent(fornecedor)}&produto=${encodeURIComponent(produto)}&qtd=${encodeURIComponent(qtd)}&etiqueta=${encodeURIComponent(etiqueta)}'`;

    const dataJson = encodeURIComponent(JSON.stringify({
      id: insp.id, id_inspecao: insp.id_inspecao || insp.id_recebimento || '',
      fornecedor, produto, lote_atak: lote, etiqueta,
      percentual_defeitos: insp.percentual_defeitos, total_defeitos: insp.total_defeitos,
    }));

    return `<div class="insp-card ${extraClass}" id="card-${insp.id}">
      <input type="checkbox" class="insp-check" data-id="${insp.id}" data-insp="${dataJson}"
        onclick="event.stopPropagation(); toggleSelecao('${insp.id}')" />
      <div class="insp-content" onclick="${onclickAction}">
        <div class="insp-top">
          <span class="insp-id">${insp.id_inspecao || insp.id_recebimento || insp.numero_documento || insp.id?.slice(0,8) || ''}</span>
          ${statusBadge}
          ${statusFinalBadge}
          <span class="insp-data">${dataFmt}</span>
        </div>
        <div class="insp-mid">
          <div class="insp-field">
            <span class="insp-field-label">Fornecedor: </span>
            <span class="insp-field-value">${fornecedor || '—'}</span>
          </div>
          <div class="insp-field">
            <span class="insp-field-label">Produto: </span>
            <span class="insp-field-value">${produto || '—'}</span>
          </div>
          <div class="insp-field">
            <span class="insp-field-label">Lote: </span>
            <span class="insp-field-value">${lote || '—'}</span>
          </div>
          ${etiqueta ? `<div class="insp-field">
            <span class="insp-field-label">Etiqueta: </span>
            <span class="insp-field-value">${etiqueta}</span>
          </div>` : ''}
      </div>
      <div class="insp-bottom">
        <span class="insp-defeito" style="background:${pctCor}18;color:${pctCor};border:1px solid ${pctCor}40;">
          ${insp._temInspecao ? pctDefeitos + ' defeitos' : (qtd ? qtd + ' kg recebidos' : 'Aguardando inspeção')}
        </span>
        ${ncCount > 0 ? `<span class="insp-nc-badge">NC: ${ncCount}</span>` : ''}
        <span class="insp-inspetor">${insp.usuario_nome || insp.inspetor || insp.analizador || ''}</span>
      </div>
    </div>
    <button class="insp-share-btn" title="Enviar relatório" onclick="event.stopPropagation(); enviarUnico('${insp.id}')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    </button>
  </div>`;
  } catch(cardErr) {
    console.error('renderCard erro:', cardErr, insp);
    const lote = insp.lote_atak || insp.lote || '';
    const forn = insp.fornecedor || '';
    return `<div class="insp-card aguardando" onclick="window.location.href='inspecao_qualidade.html?lote=${encodeURIComponent(lote)}&fornecedor=${encodeURIComponent(forn)}'">
      <div class="insp-content">
        <div class="insp-top">
          <span class="insp-id">${insp.id_recebimento || insp.id?.slice(0,8) || ''}</span>
          <span style="font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(243,156,18,.15);color:#f39c12;border:1px solid rgba(243,156,18,.3);font-weight:600;">Aguardando</span>
        </div>
        <div class="insp-mid">
          <div class="insp-field"><span class="insp-field-label">Fornecedor: </span><span class="insp-field-value">${forn}</span></div>
          <div class="insp-field"><span class="insp-field-label">Produto: </span><span class="insp-field-value">${insp.produto || ''}</span></div>
          <div class="insp-field"><span class="insp-field-label">Lote: </span><span class="insp-field-value">${lote}</span></div>
        </div>
      </div>
    </div>`;
  }
}

// ── PAGINAÇÃO ─────────────────────────────────────────────
function renderPaginacao(totalItems) {
  const container = document.getElementById('paginacao');
  if (totalItems < POR_PAGINA && paginaAtual === 1) {
    container.innerHTML = '';
    return;
  }

  container.innerHTML = `
    <button class="pag-btn" onclick="mudarPagina(-1)" ${paginaAtual <= 1 ? 'disabled' : ''}>← Anterior</button>
    <span class="pag-info">Página ${paginaAtual}</span>
    <button class="pag-btn" onclick="mudarPagina(1)" ${totalItems < POR_PAGINA ? 'disabled' : ''}>Próxima →</button>
  `;
}

function mudarPagina(delta) {
  paginaAtual += delta;
  if (paginaAtual < 1) paginaAtual = 1;
  carregarLista();
  window.scrollTo(0, 0);
}

// ── AÇÕES ─────────────────────────────────────────────────
function abrirInspecao(id) {
  window.location.href = `inspecao_qualidade.html?id=${id}`;
}

function limparFiltros() {
  document.getElementById('filtro-status').value = '';
  document.getElementById('filtro-fornecedor').value = '';
  document.getElementById('filtro-produto').value = '';
  document.getElementById('filtro-lote').value = '';
  document.getElementById('filtro-etiqueta').value = '';
  document.getElementById('filtro-data-inicio').value = '';
  document.getElementById('filtro-data-fim').value = '';
  if (typeof CQFornecedores !== 'undefined') {
    CQFornecedores.limpar('filtro-forn-container');
    CQFornecedores.renderizar('filtro-forn-container', function(f) {
      document.getElementById('filtro-fornecedor').value = f.nome || f.codigo || '';
    });
  }
  filtroStatusAtivo = '';
  paginaAtual = 1;
  carregarContadores();
  carregarLista();
}

// ── ALERTAS DE QUALIDADE ──────────────────────────────────
async function carregarAlertasQualidade() {
  const section = document.getElementById('alertas-section');
  const container = document.getElementById('alertas-container');
  const countBadge = document.getElementById('alertas-count');

  try {
    const alertas = await CQ_API.get('cq_alertas_qualidade?status=in.(aberto,visto,em_tratamento)&order=criado_em.desc&limit=50');

    if (!alertas || alertas.length === 0) {
      section.style.display = 'none';
      return;
    }

    section.style.display = 'block';
    countBadge.textContent = alertas.length;

    container.innerHTML = alertas.map(a => {
      const isC = a.gravidade === 'critica';
      const gravClass = isC ? 'critica' : 'atencao';
      const cardClass = isC ? '' : 'atencao';
      const dataFmt = new Date(a.criado_em).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });

      const statusTag = a.status === 'aberto'
        ? '<span class="alerta-status-tag" style="background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.3);">Aberto</span>'
        : a.status === 'visto'
        ? '<span class="alerta-status-tag" style="background:rgba(52,152,219,.15);color:#3498db;border:1px solid rgba(52,152,219,.3);">Visto</span>'
        : a.status === 'em_tratamento'
        ? '<span class="alerta-status-tag" style="background:rgba(243,156,18,.15);color:#f39c12;border:1px solid rgba(243,156,18,.3);">Em Tratamento</span>'
        : '';

      return `<div class="alerta-card ${cardClass}">
        <div class="alerta-header">
          <span class="alerta-frigo">${a.frigorifico}</span>
          <span class="alerta-grav ${gravClass}">${isC ? '🚨 CRÍTICO' : '⚠ ATENÇÃO'}</span>
          ${statusTag}
          ${a.numero_pedido ? `<span style="font-size:10px;color:#c8a96e;font-family:monospace;">Ped. ${a.numero_pedido}</span>` : ''}
          <span class="alerta-data">${dataFmt} · ${a.criado_por || ''}</span>
        </div>
        <div class="alerta-metricas">
          <div class="met"><span class="met-label">Total:</span> <span class="met-val">${(a.total_pecas||0).toLocaleString('pt-BR')}</span></div>
          <div class="met"><span class="met-label" style="color:#27ae60;">A:</span> <span class="met-val" style="color:#27ae60;">${(a.pcs_a||0).toLocaleString('pt-BR')} (${(a.pct_a||0).toFixed(1)}%)</span></div>
          <div class="met"><span class="met-label" style="color:#f39c12;">B:</span> <span class="met-val" style="color:#f39c12;">${(a.pcs_b||0).toLocaleString('pt-BR')} (${(a.pct_b||0).toFixed(1)}%)</span></div>
          <div class="met"><span class="met-label" style="color:#e74c3c;">C:</span> <span class="met-val" style="color:#e74c3c;">${(a.pcs_c||0).toLocaleString('pt-BR')} (${(a.pct_c||0).toFixed(1)}%)</span></div>
          ${a.numero_carga ? `<div class="met"><span class="met-label">Carga:</span> <span class="met-val">${a.numero_carga}</span></div>` : ''}
        </div>
        <div class="alerta-acoes">
          ${a.status === 'aberto' ? `<button onclick="atualizarAlerta('${a.id}','visto')">👁 Marcar como Visto</button>` : ''}
          ${a.status !== 'em_tratamento' ? `<button onclick="atualizarAlerta('${a.id}','em_tratamento')">🔧 Em Tratamento</button>` : ''}
          <button class="btn-resolver" onclick="resolverAlerta('${a.id}')">✓ Resolver</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    console.error('Erro ao carregar alertas:', e);
    section.style.display = 'none';
  }
}

async function atualizarAlerta(id, novoStatus) {
  try {
    await CQ_API.fetch(`cq_alertas_qualidade?id=eq.${id}`, {
      method: 'PATCH',
      body: { status: novoStatus, atualizado_em: new Date().toISOString() },
    });
    toast(`Alerta atualizado → ${novoStatus}`, 'ok');
    await carregarAlertasQualidade();
  } catch (e) {
    toast('Erro ao atualizar alerta: ' + e.message, 'err');
  }
}

async function resolverAlerta(id) {
  const obs = prompt('Observação da resolução (opcional):');
  const user = CQAuth.getUser();
  try {
    await CQ_API.fetch(`cq_alertas_qualidade?id=eq.${id}`, {
      method: 'PATCH',
      body: {
        status: 'resolvido',
        resolvido_por: user?.nome || user?.email || 'sistema',
        data_resolucao: new Date().toISOString(),
        obs_resolucao: obs || null,
        atualizado_em: new Date().toISOString(),
      },
    });
    toast('Alerta resolvido ✓', 'ok');
    await carregarAlertasQualidade();
  } catch (e) {
    toast('Erro ao resolver: ' + e.message, 'err');
  }
}

// ── SELEÇÃO E ENVIO ──────────────────────────────────────

function toggleSelecao(id) {
  const card = document.getElementById('card-' + id);
  const chk = card?.querySelector('.insp-check');
  if (!chk) return;

  if (_selecionados.has(id)) {
    _selecionados.delete(id);
    card.classList.remove('selecionado');
    chk.checked = false;
  } else {
    try {
      const dados = JSON.parse(decodeURIComponent(chk.dataset.insp));
      _selecionados.set(id, dados);
      card.classList.add('selecionado');
      chk.checked = true;
    } catch(e) { console.warn('Erro ao parsear dados:', e); }
  }
  atualizarBarraSelecao();
}

function toggleTodos(checked) {
  document.querySelectorAll('.insp-check[data-id]').forEach(chk => {
    const id = chk.dataset.id;
    if (checked && !_selecionados.has(id)) {
      toggleSelecao(id);
    } else if (!checked && _selecionados.has(id)) {
      toggleSelecao(id);
    }
  });
}

function limparSelecao() {
  _selecionados.clear();
  document.querySelectorAll('.insp-card.selecionado').forEach(c => c.classList.remove('selecionado'));
  document.querySelectorAll('.insp-check').forEach(c => c.checked = false);
  atualizarBarraSelecao();
}

function atualizarBarraSelecao() {
  const bar = document.getElementById('sel-bar');
  const count = _selecionados.size;
  if (count > 0) {
    bar.classList.add('show');
    document.getElementById('sel-bar-count').textContent =
      count === 1 ? '1 selecionada' : count + ' selecionadas';
  } else {
    bar.classList.remove('show');
  }
}

// ── Montar texto do relatório ─────────────────────────────
function montarRelatorio(lista) {
  const linhas = [];
  linhas.push('*CLASSIC COUROS — Relatório de Inspeção CQ*');
  linhas.push('Gerado: ' + new Date().toLocaleString('pt-BR'));
  linhas.push('');

  lista.forEach((insp, i) => {
    if (lista.length > 1) linhas.push(`━━━ Inspeção ${i+1}/${lista.length} ━━━`);
    linhas.push(`*Nº:* ${insp.id_inspecao || '—'}`);
    linhas.push(`*Data:* ${insp.data_inspecao || '—'}`);
    const localForn = [insp.fornecedor_cidade, insp.fornecedor_uf].filter(Boolean).join('/');
    linhas.push(`*Fornecedor:* ${insp.fornecedor || '—'}${localForn ? ' — '+localForn : ''}`);
    linhas.push(`*Produto:* ${insp.produto || '—'}`);
    linhas.push(`*Lote:* ${insp.lote_atak || '—'}`);
    if (insp.etiqueta) linhas.push(`*Etiqueta:* ${insp.etiqueta}`);
    linhas.push(`*Defeitos:* ${insp.total_defeitos || 0} (${insp.percentual_defeitos != null ? parseFloat(insp.percentual_defeitos).toFixed(1) : '0'}%)`);
    linhas.push(`*Classificação:* ${insp.classificacao || '—'}`);
    linhas.push(`*Status:* ${(insp.status_final || '—').toUpperCase()}`);
    linhas.push(`*Inspetor:* ${insp.inspetor || '—'}`);
    linhas.push('');
  });

  return linhas.join('\n');
}

function montarRelatorioEmail(lista) {
  const linhas = [];
  linhas.push('CLASSIC COUROS - Relatório de Inspeção CQ');
  linhas.push('Gerado: ' + new Date().toLocaleString('pt-BR'));
  linhas.push('');

  lista.forEach((insp, i) => {
    const localForn = [insp.fornecedor_cidade, insp.fornecedor_uf].filter(Boolean).join('/');
    if (lista.length > 1) linhas.push(`--- Inspeção ${i+1}/${lista.length} ---`);
    linhas.push(`Nº: ${insp.id_inspecao || '—'}`);
    linhas.push(`Data: ${insp.data_inspecao || '—'}`);
    linhas.push(`Fornecedor: ${insp.fornecedor || '—'}${localForn ? ' — '+localForn : ''}`);
    linhas.push(`Produto: ${insp.produto || '—'}`);
    linhas.push(`Lote: ${insp.lote_atak || '—'}`);
    if (insp.etiqueta) linhas.push(`Etiqueta: ${insp.etiqueta}`);
    linhas.push(`Defeitos: ${insp.total_defeitos || 0} (${insp.percentual_defeitos != null ? parseFloat(insp.percentual_defeitos).toFixed(1) : '0'}%)`);
    linhas.push(`Classificação: ${insp.classificacao || '—'}`);
    linhas.push(`Status: ${(insp.status_final || '—').toUpperCase()}`);
    linhas.push(`Inspetor: ${insp.inspetor || '—'}`);
    linhas.push('');
  });

  return linhas.join('\n');
}

// ── Enviar individual (botão share no card) ──────────────
function enviarUnico(id) {
  const chk = document.querySelector(`.insp-check[data-id="${id}"]`);
  if (!chk) return;
  let dados;
  try { dados = JSON.parse(decodeURIComponent(chk.dataset.insp)); } catch(e) { return; }

  // Tentar Web Share API (melhor no celular)
  const texto = montarRelatorio([dados]);
  if (navigator.share) {
    navigator.share({
      title: 'Inspeção ' + (dados.id_inspecao || ''),
      text: texto,
    }).catch(() => {});
  } else {
    // Fallback: abrir opções WhatsApp/Email
    _selecionados.clear();
    _selecionados.set(id, dados);
    atualizarBarraSelecao();
    toast('Selecione WhatsApp ou Email na barra abaixo', 'ok');
  }
}

// ── Enviar WhatsApp ──────────────────────────────────────
function enviarWhatsApp() {
  if (_selecionados.size === 0) { toast('Nenhuma inspeção selecionada', 'err'); return; }
  const lista = Array.from(_selecionados.values());
  const texto = montarRelatorio(lista);

  // Tentar Web Share API primeiro (melhor UX no celular)
  if (navigator.share) {
    navigator.share({
      title: 'Relatório CQ — ' + lista.length + ' inspeção(ões)',
      text: texto,
    }).catch(() => {
      // Fallback para wa.me
      window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
    });
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
  }
}

// ── Enviar Email ─────────────────────────────────────────
function enviarEmail() {
  if (_selecionados.size === 0) { toast('Nenhuma inspeção selecionada', 'err'); return; }
  const lista = Array.from(_selecionados.values());
  const corpo = montarRelatorioEmail(lista);

  const assunto = lista.length === 1
    ? 'Relatório Inspeção CQ - ' + (lista[0].id_inspecao || '')
    : 'Relatório CQ - ' + lista.length + ' inspeções';

  window.location.href = 'mailto:?subject=' + encodeURIComponent(assunto) + '&body=' + encodeURIComponent(corpo);
}

// ── TOAST ─────────────────────────────────────────────────
function toast(msg, tipo = 'ok') {
  const container = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast ${tipo}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}
</script>
