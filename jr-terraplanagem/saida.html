<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saida de Estoque - JR Terraplanagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds.css">
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="ui_components.js"></script>
<script src="shell.js"></script>
<script src="page_bootstrap.js"></script>
<style>
.terminal { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.box { background:#fff; border:1px solid #E2E8F0; border-radius:12px; padding:22px; }
.box h4 { margin:0 0 14px 0; font-size:14px; color:#475569; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; }
.ean-input { width:100%; padding:18px 22px; font-size:18px; font-family:ui-monospace,monospace; border:2px solid #DC2626; border-radius:10px; box-sizing:border-box; }
.ean-input:focus { outline:none; box-shadow:0 0 0 3px rgba(220,38,38,0.2); }
.produto-card { padding:14px; background:#FEE2E2; border-radius:8px; border:1px solid #FECACA; }
.produto-card .sku { font-family:ui-monospace,monospace; color:#DC2626; font-weight:700; }
.produto-card .nome { font-size:15px; font-weight:600; margin-top:4px; color:#7F1D1D; }
.produto-card .meta { font-size:12px; color:#991B1B; margin-top:6px; }
.lote-row { display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid #F1F5F9; font-size:13px; }
.lote-row.sugerido { background:#FEF3C7; }
.lote-row .li { flex:1; }
.lote-row .lote-name { font-family:ui-monospace,monospace; font-weight:600; color:#D97706; }
.lote-row .lote-meta { font-size:11px; color:#64748B; }
.lote-row .saldo { font-weight:700; color:#059669; font-variant-numeric:tabular-nums; }
.lote-row .badge-status { padding:2px 8px; border-radius:4px; font-size:10px; font-weight:600; }
.bs-liberado { background:#ECFDF5; color:#065F46; }
.bs-bloqueado { background:#FEE2E2; color:#991B1B; }
.bs-quarentena { background:#FEF3C7; color:#92400E; }
.fr { margin-bottom:14px; }
.fr-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
.fr label, .fr-2 label { display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px; }
.fr input, .fr-2 input, .fr select, .fr-2 select {
  width:100%; padding:9px 12px; border:1px solid #CBD5E1; border-radius:6px; font-size:13px; box-sizing:border-box;
}
.btn-saida { background:#DC2626;color:#fff;padding:12px 24px;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer; }
.btn-saida:disabled { opacity:0.5; cursor:not-allowed; }
.history { margin-top:16px; max-height:340px; overflow-y:auto; }
.hist-row { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid #F1F5F9; font-size:13px; }
.hist-row .lote { font-family:ui-monospace,monospace; color:#D97706; font-weight:600; font-size:12px; }
.hist-row .qt { font-weight:700; color:#DC2626; font-variant-numeric:tabular-nums; }
.empty-prod { padding:40px;text-align:center;color:#94A3B8;border:2px dashed #E2E8F0;border-radius:10px; }
</style>
</head>
<body class="page-bg">
<div id="shell"></div>
<div id="shell-content" class="content-area page-padding">

  <div class="card">
    <div class="card-header">
      <h3>Saida de Estoque</h3>
      <p class="text-sm text-muted">Bipe o EAN. FEFO sugere o lote com validade mais proxima.</p>
    </div>
    <div class="card-body">
      <div class="terminal">

        <div class="box">
          <h4>1. Identificar produto</h4>
          <input type="text" id="i-ean" class="ean-input" placeholder="Bipe ou digite EAN..." autocomplete="off" autofocus>
          <div id="prod-info" style="margin-top:14px;">
            <div class="empty-prod">Aguardando bipagem...</div>
          </div>
          <div id="lote-list" style="margin-top:14px;"></div>
        </div>

        <div class="box">
          <h4>2. Confirmar saida</h4>
          <form id="form-saida" onsubmit="event.preventDefault();salvar();">
            <div class="fr">
              <label>Lote selecionado</label>
              <input type="text" id="i-lote-display" readonly placeholder="Selecione um lote a esquerda" style="background:#F8FAFC;">
              <input type="hidden" id="i-lote-id">
            </div>
            <div class="fr-2">
              <div><label>Quantidade *</label><input type="number" step="0.001" id="i-qt" value="1" required></div>
              <div><label>Documento (OS, manut...)</label><input type="text" id="i-doc"></div>
            </div>
            <div class="fr-2">
              <div><label>Vincular OS</label><select id="i-os"><option value="">—</option></select></div>
              <div><label>Maquina</label><select id="i-maq"><option value="">—</option></select></div>
            </div>
            <div class="fr"><label>Observacao</label><input type="text" id="i-obs"></div>
            <button type="submit" id="btn-saida" class="btn-saida" style="width:100%;" disabled>Confirmar saida (Enter)</button>
          </form>
        </div>

      </div>

      <div class="box" style="margin-top:20px;">
        <h4>Ultimas saidas (sessao)</h4>
        <div id="history" class="history"><div style="padding:30px;text-align:center;color:#94A3B8;font-size:13px;">Nada nesta sessao ainda.</div></div>
      </div>

    </div>
  </div>
</div>

<script>
let produtoAtual = null;
let osList = [];
let maquinas = [];
let historico = [];

(async () => {
  await PageBootstrap.init({
    page: 'saida',
    title: 'Saida de Estoque',
    breadcrumb: 'Estoque > Saida',
    perfisPermitidos: ['admin','gestor','operador','financeiro'],
    loadData: async () => {
      const [rO, rM] = await Promise.all([
        API.get('jr_ordens_servico?select=id,numero_os&status=in.(aberta,em_execucao)&order=numero_os.desc&limit=300'),
        API.get('jr_maquinas?select=id,codigo,descricao&order=codigo'),
      ]);
      return { os: rO.ok ? rO.data : [], maquinas: rM.ok ? rM.data : [] };
    },
    render: (d) => {
      osList = d.os; maquinas = d.maquinas;
      document.getElementById('i-os').innerHTML = '<option value="">—</option>' + osList.map(o => `<option value="${o.id}">${API.esc(o.numero_os)}</option>`).join('');
      document.getElementById('i-maq').innerHTML = '<option value="">—</option>' + maquinas.map(m => `<option value="${m.id}">${API.esc(m.codigo)} - ${API.esc(m.descricao)}</option>`).join('');
    }
  });

  const inp = document.getElementById('i-ean');
  inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); buscarPorEan(inp.value.trim()); } });
})();

async function buscarPorEan(ean) {
  if (!ean) return;
  const r = await API.rpc('jr_buscar_produto_por_ean', { p_ean: ean });
  if (!r.ok || !r.data?.ok) {
    UI.toast(r.data?.error || 'EAN nao cadastrado', 'warn');
    document.getElementById('prod-info').innerHTML = `<div class="empty-prod" style="color:#DC2626;border-color:#FECACA;">EAN nao cadastrado: <b>${API.esc(ean)}</b></div>`;
    document.getElementById('lote-list').innerHTML = '';
    document.getElementById('btn-saida').disabled = true;
    return;
  }
  produtoAtual = r.data.produto;
  produtoAtual._lotes = r.data.lotes_liberados || [];
  produtoAtual._ean_lido = ean;
  renderProduto();
  renderLotes();
}

function renderProduto() {
  const p = produtoAtual;
  const saldo = p._lotes.reduce((a,l) => a + Number(l.saldo || 0), 0);
  document.getElementById('prod-info').innerHTML = `
    <div class="produto-card">
      <div class="sku">${API.esc(p.sku)}</div>
      <div class="nome">${API.esc(p.nome)}</div>
      <div class="meta">EAN: <b>${API.esc(p._ean_lido)}</b> · UN: ${API.esc(p.unidade)} · Saldo total: <b>${saldo.toLocaleString('pt-BR')}</b></div>
    </div>`;
}

function renderLotes() {
  const lotes = produtoAtual._lotes;
  const el = document.getElementById('lote-list');
  if (!lotes.length) {
    el.innerHTML = '<div class="empty-prod" style="color:#92400E;border-color:#FDE68A;background:#FEF3C7;">Sem lotes liberados com saldo</div>';
    document.getElementById('btn-saida').disabled = true;
    return;
  }
  el.innerHTML = '<div style="font-size:11px;text-transform:uppercase;color:#64748B;font-weight:700;margin-bottom:6px;">Lotes liberados (FEFO)</div>' +
    lotes.map((l, i) => `
      <div class="lote-row ${i===0?'sugerido':''}" onclick='selecionarLote(${JSON.stringify(l.lote_id)}, ${JSON.stringify(l.lote_interno)})' style="cursor:pointer;">
        <div class="li">
          <div><span class="lote-name">${API.esc(l.lote_interno)}</span> ${i===0?'<span style="color:#92400E;font-size:10px;font-weight:700;margin-left:6px;">FEFO</span>':''}</div>
          <div class="lote-meta">Forn.: ${API.esc(l.lote_fornecedor || '—')} · Validade: ${l.data_validade ? API.fmtData(l.data_validade) : 'sem'}</div>
        </div>
        <span class="saldo">${Number(l.saldo).toLocaleString('pt-BR')}</span>
      </div>
    `).join('');
  // Auto-seleciona o primeiro (FEFO)
  selecionarLote(lotes[0].lote_id, lotes[0].lote_interno);
}

function selecionarLote(loteId, loteInterno) {
  document.getElementById('i-lote-id').value = loteId;
  document.getElementById('i-lote-display').value = loteInterno;
  document.getElementById('btn-saida').disabled = false;
  document.getElementById('i-qt').focus();
  document.getElementById('i-qt').select();
}

async function salvar() {
  const loteId = document.getElementById('i-lote-id').value;
  if (!loteId) { UI.toast('Selecione um lote', 'err'); return; }
  const qt = parseFloat(document.getElementById('i-qt').value);
  if (isNaN(qt) || qt <= 0) { UI.toast('Quantidade invalida', 'err'); return; }

  const btn = document.getElementById('btn-saida');
  btn.disabled = true; btn.textContent = '...';

  const r = await API.rpc('jr_saida_estoque', {
    p_lote_id: loteId,
    p_quantidade: qt,
    p_ean_lido: produtoAtual?._ean_lido || null,
    p_documento: document.getElementById('i-doc').value.trim() || null,
    p_os_id: document.getElementById('i-os').value || null,
    p_maquina_id: document.getElementById('i-maq').value || null,
    p_observacao: document.getElementById('i-obs').value.trim() || null,
  });

  btn.disabled = false; btn.textContent = 'Confirmar saida (Enter)';
  if (!r.ok || !r.data?.ok) {
    UI.toast('Erro: ' + (r.data?.error || r.error || ''), 'err');
    return;
  }

  historico.unshift({
    sku: produtoAtual.sku, nome: produtoAtual.nome,
    qt, lote: document.getElementById('i-lote-display').value,
    saldo: r.data.saldo_restante,
    when: new Date().toLocaleTimeString('pt-BR').slice(0,5),
  });
  renderHistorico();
  UI.toast(`Saida OK · saldo restante: ${r.data.saldo_restante}`, 'ok');
  resetForm();
}

function resetForm() {
  produtoAtual = null;
  document.getElementById('i-ean').value = '';
  document.getElementById('i-lote-id').value = '';
  document.getElementById('i-lote-display').value = '';
  document.getElementById('i-qt').value = '1';
  document.getElementById('i-doc').value = '';
  document.getElementById('i-os').value = '';
  document.getElementById('i-maq').value = '';
  document.getElementById('i-obs').value = '';
  document.getElementById('prod-info').innerHTML = '<div class="empty-prod">Aguardando bipagem...</div>';
  document.getElementById('lote-list').innerHTML = '';
  document.getElementById('btn-saida').disabled = true;
  document.getElementById('i-ean').focus();
}

function renderHistorico() {
  const el = document.getElementById('history');
  if (!historico.length) { el.innerHTML = '<div style="padding:30px;text-align:center;color:#94A3B8;font-size:13px;">Nada nesta sessao ainda.</div>'; return; }
  el.innerHTML = historico.map(h => `
    <div class="hist-row">
      <div>
        <div><b>${API.esc(h.sku)}</b> - ${API.esc(h.nome)}</div>
        <div class="lote">Lote ${API.esc(h.lote)} · ${h.when} · saldo: ${h.saldo}</div>
      </div>
      <span class="qt">−${h.qt.toLocaleString('pt-BR')}</span>
    </div>
  `).join('');
}
</script>
</body>
</html>
