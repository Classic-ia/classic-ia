<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão CIPA - Classic RH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds.css">
<script src="config.js"></script>
<script src="rh_auth.js"></script>
<script src="api.js"></script>
<script src="shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
.cipa-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--border);margin-bottom:24px;padding-bottom:0}
.cipa-tabs button{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;padding:10px 16px;font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;white-space:nowrap;font-family:inherit;transition:color .2s,border-color .2s}
.cipa-tabs button:hover{color:var(--text-primary)}
.cipa-tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tp{display:none}.tp.active{display:block}
.progress-track{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:4px;background:var(--primary);transition:width .4s}
.alert-box{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.alert-box.red{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
.alert-box.yellow{background:rgba(234,179,8,.12);color:#ca8a04;border:1px solid rgba(234,179,8,.25)}
.reunion-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;cursor:pointer;transition:border-color .2s}
.reunion-card:hover{border-color:var(--primary)}
.reunion-card .rc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.reunion-card .rc-body{font-size:13px;color:var(--text-secondary);line-height:1.5}
.reunion-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.reunion-card.expanded .reunion-detail{display:block}
.insp-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.toggle-btn{padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:none;color:var(--text-secondary);transition:all .2s}
.toggle-btn.conforme{background:rgba(34,197,94,.12);color:#16a34a;border-color:rgba(34,197,94,.3)}
.toggle-btn.nc{background:rgba(239,68,68,.1);color:#ef4444;border-color:rgba(239,68,68,.3)}
.den-row{cursor:pointer;transition:background .15s}
.den-row:hover{background:rgba(37,99,235,.04)}
.den-detail{display:none;padding:12px 16px;background:var(--bg-page);border-top:1px solid var(--border)}
.den-row.expanded + tr .den-detail{display:block}
.chart-box{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px}
.chart-box canvas{max-height:280px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal-box{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-box h3{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-box .fg{margin-bottom:14px}
.modal-box .fg label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.modal-box .fg input,.modal-box .fg select,.modal-box .fg textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg-page);color:var(--text-primary)}
.modal-box textarea{min-height:80px;resize:vertical}
.modal-box .fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:640px){.cipa-tabs button{padding:8px 10px;font-size:12px}.modal-box .fg-row{grid-template-columns:1fr}}
</style>
</head>
<body class="page-bg">
<div id="shell"></div>
<div id="shell-content" class="content-area page-padding">

<div class="cipa-tabs" id="tabBar">
  <button class="active" data-t="painel">Painel</button>
  <button data-t="membros">Membros</button>
  <button data-t="reunioes">Reuniões</button>
  <button data-t="inspecoes">Inspeções</button>
  <button data-t="denuncias">Denúncias</button>
  <button data-t="indicadores">Indicadores</button>
</div>

<!-- TAB PAINEL -->
<div class="tp active" id="tp-painel">
  <div id="mandatoAlert"></div>
  <div class="card mb-4" id="mandatoInfo" style="padding:20px">
    <h4 class="text-secondary mb-2" style="font-size:13px;text-transform:uppercase;letter-spacing:.04em">Mandato Ativo</h4>
    <div id="mandatoBody"><span class="text-muted">Carregando...</span></div>
  </div>
  <div class="kpi-row mb-4">
    <div class="kpi-card"><div class="kpi-value" id="kMembros">-</div><div class="kpi-label">Membros</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kReunioes">-</div><div class="kpi-label">Reuniões</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kInspecoes">-</div><div class="kpi-label">Inspeções Mês</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kDenuncias">-</div><div class="kpi-label">Denúncias Abertas</div></div>
  </div>
</div>

<!-- TAB MEMBROS -->
<div class="tp" id="tp-membros">
  <div class="toolbar mb-4">
    <input class="input" id="searchMembro" placeholder="Buscar membro..." oninput="renderMembros()">
    <button class="btn btn-primary btn-sm" onclick="openMembroModal()">+ Membro</button>
  </div>
  <div class="card"><div class="table-responsive">
    <table><thead><tr>
      <th>Nome</th><th>Cargo CIPA</th><th>Tipo</th><th>Categoria</th><th>Treinado</th><th>Estabilidade Até</th><th>Ações</th>
    </tr></thead><tbody id="tbMembros"></tbody></table>
  </div></div>
</div>

<!-- TAB REUNIÕES -->
<div class="tp" id="tp-reunioes">
  <div class="toolbar mb-4">
    <button class="btn btn-primary btn-sm" onclick="openReuniaoModal()">+ Reunião</button>
  </div>
  <div id="listReunioes"></div>
</div>

<!-- TAB INSPEÇÕES -->
<div class="tp" id="tp-inspecoes">
  <div class="toolbar mb-4">
    <button class="btn btn-primary btn-sm" onclick="openInspecaoModal()">+ Inspeção</button>
  </div>
  <div id="listInspecoes"></div>
</div>

<!-- TAB DENÚNCIAS -->
<div class="tp" id="tp-denuncias">
  <div class="toolbar mb-4">
    <select class="input" id="filterDenStatus" onchange="renderDenuncias()" style="max-width:200px">
      <option value="">Todas</option><option value="aberta">Abertas</option><option value="em_analise">Em Análise</option><option value="resolvida">Resolvidas</option>
    </select>
  </div>
  <div class="card"><div class="table-responsive">
    <table><thead><tr><th>Data</th><th>Setor</th><th>Status</th><th>Anônima</th></tr></thead><tbody id="tbDenuncias"></tbody></table>
  </div></div>
</div>

<!-- TAB INDICADORES -->
<div class="tp" id="tp-indicadores">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <div class="chart-box"><h4 style="font-size:13px;margin-bottom:12px">Reuniões por Mês</h4><canvas id="chartReunioes"></canvas></div>
    <div class="chart-box"><h4 style="font-size:13px;margin-bottom:12px">Denúncias por Status</h4><canvas id="chartDenuncias"></canvas></div>
  </div>
  <div class="chart-box"><h4 style="font-size:13px;margin-bottom:12px">Não Conformidades por Setor</h4><canvas id="chartNC"></canvas></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <h3><span id="modalTitle"></span><button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-secondary)">&times;</button></h3>
    <div id="modalContent"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary btn-sm" id="modalSaveBtn" onclick="modalSaveFn()">Salvar</button>
    </div>
  </div>
</div>

</div>
<script>
let mandato=null, membros=[], reunioes=[], inspecoes=[], denuncias=[], checklist=[];
let modalSaveFn=()=>{};
const esc=s=>API.esc?API.esc(s):String(s||'').replace(/</g,'&lt;');
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('pt-BR'):'—';
const today=new Date().toISOString().slice(0,10);
const mesAtual=today.slice(0,7);

function showModal(title,html,onSave){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalContent').innerHTML=html;
  modalSaveFn=onSave||closeModal;
  document.getElementById('modal').classList.add('active');
}
function closeModal(){document.getElementById('modal').classList.remove('active');modalSaveFn=()=>{};}

/* TABS */
document.getElementById('tabBar').addEventListener('click',e=>{
  const b=e.target.closest('button[data-t]');if(!b)return;
  document.querySelectorAll('.cipa-tabs button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tp').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('tp-'+b.dataset.t).classList.add('active');
  if(b.dataset.t==='indicadores')renderCharts();
});

/* INIT */
(async function(){
  const user=await Shell.init({page:'cipa',title:'Gestão CIPA'});
  if(!user)return;
  await loadMandato();
  await Promise.all([loadMembros(),loadReunioes(),loadInspecoes(),loadDenuncias(),loadChecklist()]);
  renderPainel();renderMembros();renderReunioes();renderInspecoes();renderDenuncias();
})();

/* DATA LOADERS */
async function loadMandato(){
  const r=await API.get('cipa_mandato?select=*&status=eq.ativo&limit=1');
  if(r.ok&&r.data.length)mandato=r.data[0];
}
async function loadMembros(){
  if(!mandato)return;
  const r=await API.get('cipa_membros?select=*&mandato_id=eq.'+mandato.id+'&order=nome');
  if(r.ok)membros=r.data;
}
async function loadReunioes(){
  if(!mandato)return;
  const r=await API.get('cipa_reunioes?select=*&mandato_id=eq.'+mandato.id+'&order=data.desc');
  if(r.ok)reunioes=r.data;
}
async function loadInspecoes(){
  const r=await API.get('cipa_inspecoes?select=*&order=data.desc');
  if(r.ok)inspecoes=r.data;
}
async function loadDenuncias(){
  const r=await API.get('cipa_denuncias?select=*&order=created_at.desc');
  if(r.ok)denuncias=r.data;
}
async function loadChecklist(){
  const r=await API.get('cipa_checklist_padrao?select=*&ativo=eq.true&order=ordem');
  if(r.ok)checklist=r.data;
}

/* PAINEL */
function renderPainel(){
  const el=document.getElementById('mandatoBody');
  const al=document.getElementById('mandatoAlert');
  if(!mandato){el.innerHTML='<span class="text-muted">Nenhum mandato ativo</span>';return;}
  const ini=new Date(mandato.data_inicio+'T00:00:00'),fim=new Date(mandato.data_fim+'T00:00:00'),now=new Date();
  const total=Math.max((fim-ini)/864e5,1),elapsed=Math.min(Math.max((now-ini)/864e5,0),total);
  const pct=Math.round(elapsed/total*100),remain=Math.max(Math.round((fim-now)/864e5),0);
  el.innerHTML=`<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">
    <div><strong>Mandato ${esc(mandato.numero)}</strong></div>
    <div class="text-secondary" style="font-size:13px">${fmtDate(mandato.data_inicio)} a ${fmtDate(mandato.data_fim)}</div>
  </div>
  <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-top:4px">
    <span>${pct}% transcorrido</span><span>${remain} dias restantes</span>
  </div>
  <div style="margin-top:8px;font-size:12px;color:var(--text-secondary)">Grau de Risco: <strong>${esc(mandato.grau_risco||'—')}</strong> | Efetivos: <strong>${mandato.efetivos||0}</strong> | Suplentes: <strong>${mandato.suplentes||0}</strong></div>`;
  al.innerHTML='';
  if(remain<60)al.innerHTML=`<div class="alert-box red">Mandato vence em ${remain} dias! Inicie o processo eleitoral.</div>`;
  else if(remain<90)al.innerHTML=`<div class="alert-box yellow">Mandato vence em ${remain} dias. Planeje a próxima eleição.</div>`;
  document.getElementById('kMembros').textContent=membros.filter(m=>m.ativo).length;
  document.getElementById('kReunioes').textContent=reunioes.filter(r=>r.status==='realizada').length;
  document.getElementById('kInspecoes').textContent=inspecoes.filter(i=>(i.data||'').slice(0,7)===mesAtual).length;
  document.getElementById('kDenuncias').textContent=denuncias.filter(d=>d.status==='aberta').length;
}

/* MEMBROS */
function renderMembros(){
  const q=(document.getElementById('searchMembro').value||'').toLowerCase();
  const filtered=membros.filter(m=>!q||m.nome.toLowerCase().includes(q));
  document.getElementById('tbMembros').innerHTML=filtered.length?filtered.map(m=>`<tr>
    <td>${esc(m.nome)}</td>
    <td><span class="badge badge-primary">${esc(m.cargo_cipa||'—')}</span></td>
    <td>${esc(m.tipo||'—')}</td>
    <td>${esc(m.categoria||'—')}</td>
    <td>${m.treinado?'<span class="badge badge-success">Sim</span>':'<span class="badge badge-danger">Não</span>'}</td>
    <td>${fmtDate(m.estabilidade_ate)}</td>
    <td>${!m.treinado?`<button class="btn btn-sm btn-outline" onclick="marcarTreinado('${m.id}')">Marcar Treinado</button>`:''}</td>
  </tr>`).join(''):'<tr><td colspan="7" class="text-muted" style="text-align:center;padding:24px">Nenhum membro</td></tr>';
}

function openMembroModal(){
  showModal('Novo Membro',`
    <div class="fg"><label>Nome</label><input id="mNome"></div>
    <div class="fg-row">
      <div class="fg"><label>Cargo CIPA</label><select id="mCargo"><option>Presidente</option><option>Vice-Presidente</option><option>Secretário</option><option>Membro Titular</option><option>Membro Suplente</option></select></div>
      <div class="fg"><label>Tipo</label><select id="mTipo"><option value="empregador">Empregador</option><option value="empregado">Empregado</option></select></div>
    </div>
    <div class="fg"><label>Categoria</label><select id="mCat"><option value="efetivo">Efetivo</option><option value="suplente">Suplente</option></select></div>
  `,saveMembro);
}

async function saveMembro(){
  const nome=document.getElementById('mNome').value.trim();
  if(!nome||!mandato)return;
  const payload={mandato_id:mandato.id,nome,cargo_cipa:document.getElementById('mCargo').value,
    tipo:document.getElementById('mTipo').value,categoria:document.getElementById('mCat').value,
    data_posse:today,ativo:true,treinado:false};
  const r=await API.post('cipa_membros',payload);
  if(r.ok){closeModal();await loadMembros();renderMembros();renderPainel();}
}

async function marcarTreinado(id){
  const r=await API.patch('cipa_membros?id=eq.'+id,{treinado:true,data_treinamento:today});
  if(r.ok){await loadMembros();renderMembros();}
}

/* REUNIÕES */
function renderReunioes(){
  const el=document.getElementById('listReunioes');
  if(!reunioes.length){el.innerHTML='<div class="text-muted" style="text-align:center;padding:40px">Nenhuma reunião cadastrada</div>';return;}
  el.innerHTML=reunioes.map(r=>{
    const badge=r.status==='realizada'?'badge-success':r.status==='cancelada'?'badge-danger':'badge-warning';
    return `<div class="reunion-card" id="rc-${r.id}" onclick="toggleReuniao('${r.id}')">
      <div class="rc-head">
        <div><strong>Reunião ${esc(r.numero)}</strong> — ${fmtDate(r.data)}</div>
        <div><span class="badge ${badge}">${esc(r.status||'agendada')}</span> <span class="badge badge-secondary">${esc(r.tipo||'ordinária')}</span></div>
      </div>
      <div class="rc-body">${esc(r.pauta||'Sem pauta')}</div>
      <div class="reunion-detail" id="rd-${r.id}">
        <h5 style="font-size:13px;font-weight:600;margin-bottom:8px">Ata</h5>
        <div style="font-size:13px;white-space:pre-wrap;margin-bottom:12px">${esc(r.ata_texto||'Sem ata registrada')}</div>
        <div id="pres-${r.id}"></div>
      </div>
    </div>`;
  }).join('');
}

async function toggleReuniao(id){
  const card=document.getElementById('rc-'+id);
  const wasExpanded=card.classList.contains('expanded');
  document.querySelectorAll('.reunion-card.expanded').forEach(c=>c.classList.remove('expanded'));
  if(wasExpanded)return;
  card.classList.add('expanded');
  const presEl=document.getElementById('pres-'+id);
  presEl.innerHTML='<span class="text-muted">Carregando...</span>';
  const [pRes,aRes]=await Promise.all([
    API.get('cipa_presencas?select=*&reuniao_id=eq.'+id),
    API.get('cipa_assinaturas?select=*&reuniao_id=eq.'+id)
  ]);
  const presencas=pRes.ok?pRes.data:[];
  const assinaturas=aRes.ok?aRes.data:[];
  const signedIds=new Set(assinaturas.map(a=>a.membro_id));
  const presentIds=new Set(presencas.filter(p=>p.presente).map(p=>p.membro_id));
  presEl.innerHTML='<h5 style="font-size:13px;font-weight:600;margin-bottom:8px">Presenças & Assinaturas</h5>'+
    membros.filter(m=>m.ativo).map(m=>{
      const pres=presentIds.has(m.id);
      const signed=signedIds.has(m.id);
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid var(--border)">
        <span>${esc(m.nome)} ${pres?'&#10003;':'<span class="text-muted">ausente</span>'}</span>
        <span>${signed?'<span class="badge badge-success">Assinado</span>':(pres?`<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();assinar('${id}','${m.id}')">Assinar</button>`:'')}</span>
      </div>`;
    }).join('');
}

async function assinar(reuniaoId,membroId){
  const r=await API.post('cipa_assinaturas',{reuniao_id:reuniaoId,membro_id:membroId,assinado_em:new Date().toISOString()});
  if(r.ok)toggleReuniao(reuniaoId);
}

function openReuniaoModal(){
  const nextNum=reunioes.length?Math.max(...reunioes.map(r=>parseInt(r.numero)||0))+1:1;
  showModal('Nova Reunião',`
    <div class="fg-row">
      <div class="fg"><label>Número</label><input id="rNum" value="${nextNum}"></div>
      <div class="fg"><label>Data</label><input type="date" id="rData" value="${today}"></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>Tipo</label><select id="rTipo"><option value="ordinaria">Ordinária</option><option value="extraordinaria">Extraordinária</option></select></div>
      <div class="fg"><label>Local</label><input id="rLocal"></div>
    </div>
    <div class="fg"><label>Pauta</label><textarea id="rPauta"></textarea></div>
    <div class="fg"><label>Ata</label><textarea id="rAta"></textarea>
      <button class="btn btn-sm btn-outline" style="margin-top:6px" onclick="gerarAtaIA()">Gerar Ata IA</button>
    </div>
  `,saveReuniao);
}

async function gerarAtaIA(){
  const pauta=document.getElementById('rPauta').value;
  if(!pauta){alert('Preencha a pauta primeiro');return;}
  try{
    const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:'Gere uma ata de reunião CIPA baseada nesta pauta: '+pauta,type:'cipa_ata'})});
    if(!r.ok)throw new Error('IA indisponível');
    const d=await r.json();
    document.getElementById('rAta').value=d.text||d.content||'';
  }catch(e){alert('Erro ao gerar ata: '+e.message);}
}

async function saveReuniao(){
  if(!mandato)return;
  const payload={mandato_id:mandato.id,numero:document.getElementById('rNum').value,
    data:document.getElementById('rData').value,tipo:document.getElementById('rTipo').value,
    local:document.getElementById('rLocal').value,pauta:document.getElementById('rPauta').value,
    ata_texto:document.getElementById('rAta').value,status:'agendada'};
  const r=await API.post('cipa_reunioes',payload);
  if(r.ok){closeModal();await loadReunioes();renderReunioes();renderPainel();}
}

/* INSPEÇÕES */
function renderInspecoes(){
  const el=document.getElementById('listInspecoes');
  if(!inspecoes.length){el.innerHTML='<div class="text-muted" style="text-align:center;padding:40px">Nenhuma inspeção cadastrada</div>';return;}
  el.innerHTML=inspecoes.map(i=>{
    const nc=i.nao_conformidades||0;
    return `<div class="insp-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <strong>${fmtDate(i.data)}</strong>
        <span class="badge ${nc>0?'badge-danger':'badge-success'}">${nc} NC</span>
      </div>
      <div style="font-size:13px;color:var(--text-secondary)">Setor: ${esc(i.setor||'—')} | ${esc(i.observacoes||'')}</div>
    </div>`;
  }).join('');
}

function openInspecaoModal(){
  const setores=[...new Set(checklist.map(c=>c.setor).filter(Boolean))];
  showModal('Nova Inspeção',`
    <div class="fg-row">
      <div class="fg"><label>Setor</label><select id="iSetor" onchange="loadChecklistItems()">
        <option value="">Selecione</option>${setores.map(s=>`<option>${esc(s)}</option>`).join('')}
      </select></div>
      <div class="fg"><label>Data</label><input type="date" id="iData" value="${today}"></div>
    </div>
    <div class="fg"><label>Observações</label><textarea id="iObs"></textarea></div>
    <div id="checklistArea"></div>
  `,saveInspecao);
}

function loadChecklistItems(){
  const setor=document.getElementById('iSetor').value;
  const items=checklist.filter(c=>c.setor===setor);
  document.getElementById('checklistArea').innerHTML=items.length?
    '<label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;display:block">Checklist</label>'+
    items.map((c,i)=>`<div class="toggle-row">
      <span>${esc(c.item)}</span>
      <button class="toggle-btn conforme" id="tgl-${i}" onclick="toggleCheck(this)"  data-item="${esc(c.item)}" data-status="conforme">Conforme</button>
    </div>`).join(''):'';
}

function toggleCheck(btn){
  if(btn.dataset.status==='conforme'){btn.dataset.status='nc';btn.textContent='NC';btn.className='toggle-btn nc';}
  else{btn.dataset.status='conforme';btn.textContent='Conforme';btn.className='toggle-btn conforme';}
}

async function saveInspecao(){
  const setor=document.getElementById('iSetor').value;
  if(!setor)return;
  const btns=document.querySelectorAll('#checklistArea .toggle-btn');
  const resultado=[],ncCount=btns.length?[...btns].filter(b=>b.dataset.status==='nc').length:0;
  btns.forEach(b=>resultado.push({item:b.dataset.item,status:b.dataset.status}));
  const payload={data:document.getElementById('iData').value,setor,observacoes:document.getElementById('iObs').value,
    resultado_json:resultado,nao_conformidades:ncCount};
  const r=await API.post('cipa_inspecoes',payload);
  if(r.ok){closeModal();await loadInspecoes();renderInspecoes();renderPainel();}
}

/* DENÚNCIAS */
function renderDenuncias(){
  const f=document.getElementById('filterDenStatus').value;
  const filtered=denuncias.filter(d=>!f||d.status===f);
  document.getElementById('tbDenuncias').innerHTML=filtered.length?filtered.map(d=>{
    const badge=d.status==='aberta'?'badge-danger':d.status==='resolvida'?'badge-success':'badge-warning';
    return `<tr class="den-row" onclick="toggleDenuncia(this)">
      <td>${fmtDate((d.created_at||'').slice(0,10))}</td>
      <td>${esc(d.setor||'—')}</td>
      <td><span class="badge ${badge}">${esc(d.status)}</span></td>
      <td>${d.anonima?'Sim':'Não'}</td>
    </tr><tr><td colspan="4"><div class="den-detail">
      <p style="font-size:13px;margin-bottom:12px;white-space:pre-wrap">${esc(d.descricao)}</p>
      ${d.resposta?`<p style="font-size:13px"><strong>Resposta:</strong> ${esc(d.resposta)}</p>`:`
        <div class="fg"><label>Resposta</label><textarea id="denResp-${d.id}" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;min-height:60px">${esc(d.resposta||'')}</textarea></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-sm btn-primary" onclick="event.stopPropagation();responderDenuncia('${d.id}','em_analise')">Em Análise</button>
          <button class="btn btn-sm btn-success" onclick="event.stopPropagation();responderDenuncia('${d.id}','resolvida')">Resolver</button>
        </div>`}
    </div></td></tr>`;
  }).join(''):'<tr><td colspan="4" class="text-muted" style="text-align:center;padding:24px">Nenhuma denúncia</td></tr>';
}

function toggleDenuncia(row){
  const wasExp=row.classList.contains('expanded');
  document.querySelectorAll('.den-row.expanded').forEach(r=>r.classList.remove('expanded'));
  if(!wasExp)row.classList.add('expanded');
}

async function responderDenuncia(id,status){
  const resp=document.getElementById('denResp-'+id).value;
  const r=await API.patch('cipa_denuncias?id=eq.'+id,{resposta:resp,status});
  if(r.ok){await loadDenuncias();renderDenuncias();renderPainel();}
}

/* INDICADORES */
let charts={};
function renderCharts(){
  const ctx1=document.getElementById('chartReunioes').getContext('2d');
  const ctx2=document.getElementById('chartDenuncias').getContext('2d');
  const ctx3=document.getElementById('chartNC').getContext('2d');
  Object.values(charts).forEach(c=>c.destroy());

  const meses={};
  reunioes.forEach(r=>{const m=(r.data||'').slice(0,7);if(m)meses[m]=(meses[m]||0)+1;});
  const mLabels=Object.keys(meses).sort().slice(-12);
  charts.reunioes=new Chart(ctx1,{type:'bar',data:{labels:mLabels,datasets:[{label:'Reuniões',data:mLabels.map(m=>meses[m]||0),backgroundColor:'rgba(37,99,235,.6)'}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}});

  const denStatus={};
  denuncias.forEach(d=>{const s=d.status||'aberta';denStatus[s]=(denStatus[s]||0)+1;});
  const dLabels=Object.keys(denStatus);
  const dColors=['#ef4444','#f59e0b','#22c55e','#6366f1'];
  charts.denuncias=new Chart(ctx2,{type:'doughnut',data:{labels:dLabels,datasets:[{data:dLabels.map(l=>denStatus[l]),backgroundColor:dColors.slice(0,dLabels.length)}]},options:{responsive:true}});

  const ncSetor={};
  inspecoes.forEach(i=>{if(i.nao_conformidades&&i.setor)ncSetor[i.setor]=(ncSetor[i.setor]||0)+i.nao_conformidades;});
  const nLabels=Object.keys(ncSetor).sort((a,b)=>ncSetor[b]-ncSetor[a]);
  charts.nc=new Chart(ctx3,{type:'bar',data:{labels:nLabels,datasets:[{label:'NC',data:nLabels.map(l=>ncSetor[l]),backgroundColor:'rgba(239,68,68,.6)'}]},options:{responsive:true,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{stepSize:1}}}}});
}
</script>
</body>
