<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Login — Trans Anacleto Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="m.css">
<script src="../config.js"></script>
<script src="../auth.js"></script>
<style>
  body { display:flex; align-items:center; justify-content:center; padding:24px; }
  .m-login-card { width:100%; max-width:400px; }
  .m-logo { text-align:center; margin-bottom:28px; }
  .m-logo-icon { width:64px; height:64px; border-radius:16px; background:#2563eb; color:#fff;
    display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .m-logo h1 { font-size:20px; font-weight:700; margin:0; }
  .m-logo p { font-size:13px; color:#64748b; margin:4px 0 0; }
  .m-erro { display:none; background:#fee2e2; color:#991b1b; padding:10px 14px; border-radius:8px;
    font-size:13px; text-align:center; margin-top:12px; }
  .m-versao { text-align:center; margin-top:16px; font-size:11px; color:#94a3b8; }
  .m-desktop-link { text-align:center; margin-top:14px; font-size:12px; }
  .m-desktop-link a { color:#2563eb; text-decoration:none; font-weight:500; }
</style>
</head>
<body>
<div class="m-login-card">
  <div class="m-card">
    <div class="m-logo">
      <div class="m-logo-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13"/>
          <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
          <circle cx="5.5" cy="18.5" r="2.5"/>
          <circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
      </div>
      <h1>Trans Anacleto</h1>
      <p>App Operacional</p>
    </div>

    <form id="form-login" onsubmit="doLogin(event)">
      <div class="m-field">
        <label>E-mail</label>
        <input type="email" id="f-email" required autocomplete="email" inputmode="email" placeholder="seu@email.com">
      </div>
      <div class="m-field">
        <label>Senha</label>
        <input type="password" id="f-senha" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="m-btn m-btn-primary" id="btn-login">Entrar</button>
    </form>

    <div class="m-erro" id="erro"></div>
    <div class="m-desktop-link"><a href="../login.html">&larr; Versao desktop</a></div>
    <div class="m-versao">Trans Anacleto Mobile v2026.04</div>
  </div>
</div>

<script>
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const erro = document.getElementById('erro');
  erro.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Autenticando...';
  try {
    const email = document.getElementById('f-email').value.trim();
    const senha = document.getElementById('f-senha').value;
    await TransAuth.login(email, senha);
    window.location.href = 'm_home.html';
  } catch(err) {
    erro.textContent = err.message;
    erro.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
