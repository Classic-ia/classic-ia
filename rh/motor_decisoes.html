<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor de Decisoes — Classic RH & SST</title>
<script src="config.js"></script>
<script src="rh_auth.js"></script>
<link rel="stylesheet" href="ds.css">
<script src="api.js"></script>
<script src="ui_components.js"></script>
<script src="page_bootstrap.js"></script>
<script src="shell.js"></script>
</head>
<body class="page-bg">
<div class="header">
  <div class="header-left">
    <a href="app.html" class="back-btn">← Voltar</a>
    <div><div class="page-title">Motor de Decisoes</div><div class="page-sub">Deteccao automatica + diagnostico + plano de acao</div></div>
  </div>
  <div id="rh-user-chip"></div>
</div>
<div class="main">
  <div class="kpi-row" id="kpis">
    <a class="kpi" href="#problems" style="text-decoration:none;color:inherit;cursor:pointer"><div class="kpi-val" id="k-problemas">—</div><div class="kpi-lbl">Problemas Detectados</div></a>
    <a class="kpi" href="alertas_rh.html" style="text-decoration:none;color:inherit;cursor:pointer"><div class="kpi-val" id="k-risco">—</div><div class="kpi-lbl">Alto Risco</div></a>
    <a class="kpi" href="alertas_rh.html" style="text-decoration:none;color:inherit;cursor:pointer"><div class="kpi-val" id="k-acoes">—</div><div class="kpi-lbl">Acoes Necessarias</div></a>
    <a class="kpi" href="relatorio_atestados.html" style="text-decoration:none;color:inherit;cursor:pointer"><div class="kpi-val" id="k-impacto">—</div><div class="kpi-lbl">Impacto Total (R$)</div></a>
  </div>
  <div class="section-title">Problemas Detectados</div>
  <div id="problems"><div style="text-align:center;padding:40px;color:var(--muted)"><div class="spinner"></div> Analisando dados...</div></div>
</div>
<script>
const ICONS = {recorrencia:'🔄',afastamento_prolongado:'🏥',setor_critico:'🏭',sst_epi:'🛡️'};
const RISK_LABELS = {alto:'Alto Risco',medio:'Medio',baixo:'Baixo'};
const RESP_LABELS = {rh:'RH',sst:'SST',gestor:'Gestor',sistema:'Sistema',administrador:'Admin'};

document.addEventListener('DOMContentLoaded', async () => {
  await RHAuth.init();
  try {
    const res = await API.rpc('motor_decisoes', {});
    if (!res.ok) throw new Error(res.error || 'Erro ao carregar dados');
    render(res.data);
  } catch(e) {
    document.getElementById('problems').innerHTML = `<div style="color:var(--err);text-align:center;padding:40px">Erro: ${API.esc(e.message)}</div>`;
  }
});

function render(d) {
  document.getElementById('k-problemas').textContent = d.total_problemas;
  document.getElementById('k-risco').textContent = d.resumo.alto_risco;
  document.getElementById('k-risco').style.color = d.resumo.alto_risco > 0 ? 'var(--err)' : 'var(--ok)';
  document.getElementById('k-acoes').textContent = d.resumo.acoes_total;
  document.getElementById('k-impacto').textContent = 'R$ ' + Number(d.resumo.impacto_total).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});

  const el = document.getElementById('problems');
  if (!d.problemas || d.problemas.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--ok);font-size:16px">Nenhum problema detectado</div>';
    return;
  }

  el.innerHTML = d.problemas.map((p, i) => {
    const icon = ICONS[p.tipo] || '⚠️';
    const riskClass = 'risk-' + (p.risco || 'baixo');
    const riskTag = p.risco === 'alto' ? 'tag-red' : p.risco === 'medio' ? 'tag-yellow' : 'tag-blue';
    const title = p.funcionario ? p.funcionario : (p.setor || p.tipo);
    const subtitle = p.funcionario ? `${p.cargo || ''} — ${p.setor || ''}` : '';

    return `
    <div class="problem-card ${riskClass}" id="card-${i}">
      <div class="problem-header" onclick="document.getElementById('card-${i}').classList.toggle('open')">
        <div class="problem-icon">${icon}</div>
        <div style="flex:1">
          <div class="problem-title">${title}</div>
          ${subtitle ? `<div style="font-size:12px;color:var(--muted)">${subtitle}</div>` : ''}
          <div class="problem-diag">${p.diagnostico}</div>
          <div class="problem-causa">${p.causa_provavel || ''}</div>
          <div class="problem-meta">
            <span class="tag ${riskTag}">${RISK_LABELS[p.risco] || p.risco}</span>
            <span class="tag tag-blue">${p.tipo.replace(/_/g,' ')}</span>
            ${p.impacto_financeiro ? `<span class="impacto">R$ ${Number(p.impacto_financeiro).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>` : ''}
          </div>
          <div class="click-hint">Clique para ver diagnostico e plano de acao</div>
        </div>
        <div class="problem-arrow">&#9660;</div>
      </div>
      <div class="problem-body">
        <div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Plano de Acao</div>
        <ul class="action-list">
          ${(p.plano_acao || []).map((a, j) => `
          <li class="action-item">
            <div class="action-check" onclick="this.classList.toggle('done');this.innerHTML=this.classList.contains('done')?'✓':''">
            </div>
            <div class="action-text">${a.acao}</div>
            <span class="action-resp">${RESP_LABELS[a.responsavel] || a.responsavel}</span>
            <span class="action-prazo">${a.prazo_dias}d</span>
          </li>`).join('')}
        </ul>
      </div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
