<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Instalar Pneu — Trans Anacleto Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="m.css">
<script src="../config.js"></script>
<script src="../auth.js"></script>
<script src="../api.js"></script>
<script src="m_shell.js"></script>
</head>
<body>
<div class="m-app">
  <div id="m-shell"></div>
  <main class="m-main">
    <div id="box-pneu" class="m-card m-loading"><div class="m-spinner"></div><div>Carregando...</div></div>

    <form id="form-instalar" style="display:none" onsubmit="submitForm(event)">
      <div class="m-card">
        <div class="m-card-title">Veiculo</div>
        <div class="m-field">
          <label>Placa / frota</label>
          <select id="f-veiculo" required onchange="atualizarKm()"></select>
        </div>
        <div class="m-field">
          <label>KM atual do veiculo</label>
          <input type="number" id="f-km" required min="0" step="1" inputmode="numeric">
          <div class="m-small m-muted" id="info-km"></div>
        </div>
      </div>

      <div class="m-card">
        <div class="m-card-title">Posicao</div>
        <div id="pos-grid" class="pos-grid"></div>
        <input type="hidden" id="f-posicao" required>
      </div>

      <div class="m-card">
        <div class="m-card-title">Foto (opcional)</div>
        <input type="file" id="f-foto" accept="image/*" capture="environment">
        <img id="foto-preview" class="m-foto-preview" style="display:none">
      </div>

      <div class="m-card">
        <div class="m-field">
          <label>Observacao (opcional)</label>
          <textarea id="f-obs" rows="2"></textarea>
        </div>
        <button type="submit" class="m-btn m-btn-primary" id="btn-ok">Confirmar instalacao</button>
        <a href="#" onclick="history.back();return false" class="m-btn m-btn-ghost">Cancelar</a>
      </div>
    </form>
  </main>
</div>

<script>
let _pneuId = null, _manutencaoId = null, _user = null, _pneu = null;

const POSICOES = [
  ['DE','DD'],
  ['TE','TD'],
  ['3EE','3EI','3DI','3DE'],
  ['4EE','4EI','4DI','4DE'],
  ['estepe']
];

(async function init() {
  _user = await MShell.init();
  if (!_user) return;
  const url = new URL(window.location.href);
  _pneuId = url.searchParams.get('pneu_id');
  _manutencaoId = url.searchParams.get('manutencao_id') || null;
  if (!_pneuId) { MShell.toast('Pneu nao informado', 'erro'); setTimeout(()=>history.back(), 1200); return; }
  MShell.render({
    title: 'Instalar pneu',
    back: `m_pneus_scan.html?codigo=${encodeURIComponent('')}`,
    currentNav: 'pneus'
  });
  await carregar();
})();

async function carregar() {
  const [rp, rv] = await Promise.all([
    API.get(`v_trans_pneus_full?id=eq.${_pneuId}&select=*`),
    API.get('trans_veiculos?status=in.(ativo,parado,manutencao)&order=placa&select=id,placa,modelo,km_atual')
  ]);
  if (!rp.ok || !rp.data.length) {
    document.getElementById('box-pneu').innerHTML = `<p>Pneu nao encontrado.</p>`;
    return;
  }
  _pneu = rp.data[0];
  if (_pneu.status !== 'estoque' && _pneu.status !== 'reserva') {
    document.getElementById('box-pneu').innerHTML =
      `<div class="m-card-title">Status invalido</div>
       <p>Status atual: <strong>${API.esc(_pneu.status)}</strong>. Nao e possivel instalar.</p>`;
    return;
  }
  document.getElementById('box-pneu').className = 'm-card';
  document.getElementById('box-pneu').innerHTML = `
    <div class="m-small m-muted">Pneu</div>
    <div class="m-big m-mono">${API.esc(_pneu.codigo_interno)}</div>
    <div class="m-small m-muted" style="margin-top:6px">Modelo</div>
    <div>${API.esc(_pneu.marca||'')} ${API.esc(_pneu.modelo||'')} <span class="m-muted">${API.esc(_pneu.medida||'')}</span></div>
  `;

  const sel = document.getElementById('f-veiculo');
  sel.innerHTML = '<option value="">Selecione</option>' + rv.data.map(v =>
    `<option value="${v.id}" data-km="${v.km_atual||0}">${API.esc(v.placa)} — ${API.esc(v.modelo||'')}</option>`
  ).join('');

  // grid de posicoes
  const grid = document.getElementById('pos-grid');
  grid.innerHTML = POSICOES.map(row =>
    `<div class="pos-grid-row">${row.map(p =>
      `<button type="button" class="pos-btn" data-pos="${p}" onclick="selPos('${p}')">${p}</button>`
    ).join('')}</div>`
  ).join('');

  document.getElementById('f-foto').addEventListener('change', preview);
  document.getElementById('form-instalar').style.display = '';
}

function atualizarKm() {
  const sel = document.getElementById('f-veiculo');
  const opt = sel.selectedOptions[0];
  const km = opt ? (opt.dataset.km || 0) : 0;
  document.getElementById('f-km').value = km;
  document.getElementById('info-km').textContent = `KM atual do veiculo: ${API.fmtKm(km)} (nao pode retroceder)`;
}

function selPos(p) {
  document.getElementById('f-posicao').value = p;
  document.querySelectorAll('.pos-btn').forEach(b => b.classList.toggle('active', b.dataset.pos === p));
}

function preview(e) {
  const f = e.target.files[0];
  const img = document.getElementById('foto-preview');
  if (!f) { img.style.display = 'none'; return; }
  img.src = URL.createObjectURL(f); img.style.display = 'block';
}

async function submitForm(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-ok');
  const veic = document.getElementById('f-veiculo').value;
  const pos = document.getElementById('f-posicao').value;
  const km = parseInt(document.getElementById('f-km').value || '0', 10);
  const obs = document.getElementById('f-obs').value.trim() || null;
  if (!veic) { MShell.toast('Selecione o veiculo', 'aviso'); return; }
  if (!pos) { MShell.toast('Selecione a posicao', 'aviso'); return; }
  if (!km || km < 0) { MShell.toast('KM invalido', 'aviso'); return; }

  btn.disabled = true; btn.textContent = 'Enviando...';
  const fotoUrl = await uploadFotoOpcional();
  const r = await API.rpc('trans_pneu_instalar', {
    p_pneu_id: _pneuId,
    p_veiculo_id: veic,
    p_posicao: pos,
    p_km_veiculo: km,
    p_foto_url: fotoUrl,
    p_latitude: null,
    p_longitude: null,
    p_observacao: obs
  });
  if (!r.ok) {
    MShell.toast(r.error || 'Erro ao instalar', 'erro', 4000);
    btn.disabled = false; btn.textContent = 'Confirmar instalacao';
    return;
  }
  if (_manutencaoId) {
    await API.post('trans_manutencao_pneus', {
      manutencao_id: _manutencaoId, pneu_id: _pneuId, acao: 'instalar'
    });
  }
  MShell.toast('Pneu instalado.', 'ok');
  setTimeout(() => {
    window.location.href = _manutencaoId ? `m_manutencao_itens.html?id=${_manutencaoId}` : 'm_home.html';
  }, 900);
}

async function uploadFotoOpcional() {
  const f = document.getElementById('f-foto').files[0];
  if (!f) return null;
  try {
    const path = `pneus/${_pneuId}/${Date.now()}-${f.name.replace(/[^a-z0-9.]/gi,'_')}`;
    const res = await fetch(`${SB_URL}/storage/v1/object/trans-pneus-fotos/${path}`, {
      method: 'POST',
      headers: {
        'Content-Type': f.type || 'application/octet-stream',
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + (JSON.parse(localStorage.getItem('trans_sess_v1')||'{}').access_token || SB_KEY),
        'x-upsert': 'true'
      },
      body: f
    });
    if (!res.ok) return null;
    return `${SB_URL}/storage/v1/object/public/trans-pneus-fotos/${path}`;
  } catch { return null; }
}
</script>
</body>
</html>
