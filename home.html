<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic — Hub Operacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="config_rh.js"></script>
<script src="rh_auth.js"></script>
<script src="rh_api.js"></script>
<style>
:root {
  --bg:#07111c; --surface:#0d1b2a; --surface2:#162535; --border:#1e3a52;
  --accent:#c8a96e; --accent2:#e8c98e; --text:#e8f0f5; --muted:#5d7f95;
  --blue:#2E6B8A; --blue2:#3d8aad;
  --green:#27ae60; --yellow:#f39c12; --red:#e74c3c; --orange:#e67e22;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(46,107,138,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(46,107,138,.04) 1px,transparent 1px);
  background-size:40px 40px;}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(7,17,28,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
.hdr-left{display:flex;align-items:center;gap:14px;}
.hdr-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--accent);}
.hdr-logo span{color:var(--text);font-weight:600;}
.hdr-right{display:flex;align-items:center;gap:14px;}
.hdr-user{font-size:12px;color:var(--muted);text-align:right;line-height:1.3;}
.hdr-user strong{color:var(--text);display:block;}
.hdr-badge{font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;}
.btn-out{background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);
  font-size:11px;padding:6px 14px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;transition:all .2s;}
.btn-out:hover{border-color:var(--red);color:var(--red);}
.session-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}

/* Main */
.main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:28px 24px 60px;}

/* Alert strip */
.alert-strip{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px;}
.alert-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:16px 20px;flex:1;min-width:140px;cursor:pointer;transition:all .2s;text-decoration:none;color:var(--text);}
.alert-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.alert-val{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;line-height:1;}
.alert-val.ok{color:var(--green);}
.alert-val.warn{color:var(--yellow);}
.alert-val.crit{color:var(--red);}
.alert-val.neutral{color:var(--accent);}
.alert-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px;}

/* Section */
.section{margin-bottom:32px;}
.section-title{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';width:3px;height:12px;background:var(--accent);border-radius:1px;display:inline-block;}

/* Module grid */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.mod-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:22px 20px;cursor:pointer;text-decoration:none;color:var(--text);display:block;
  transition:border-color .2s,transform .15s,box-shadow .2s;position:relative;overflow:hidden;}
.mod-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.mod-icon{font-size:28px;margin-bottom:10px;}
.mod-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:.03em;margin-bottom:4px;}
.mod-desc{font-size:11px;color:var(--muted);line-height:1.5;}
.mod-badge{display:inline-block;margin-top:8px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);border:1px solid rgba(200,169,110,.25);border-radius:6px;padding:2px 8px;}
.mod-card.disabled{opacity:.35;pointer-events:none;}

/* Recent */
.recent-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;}
.recent-chip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:8px 16px;font-size:12px;color:var(--text);cursor:pointer;text-decoration:none;transition:all .2s;}
.recent-chip:hover{border-color:var(--blue);background:rgba(46,107,138,.08);}

/* System alerts */
.sys-alerts{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;}
.sys-alert-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(30,58,82,.3);font-size:12px;}
.sys-alert-item:last-child{border-bottom:none;}
.sys-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sys-dot.red{background:var(--red);}
.sys-dot.yellow{background:var(--yellow);}
.sys-dot.green{background:var(--green);}

/* Loading */
.loading{text-align:center;padding:60px;color:var(--muted);font-size:13px;}

/* Filial selector */
.filial-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 24px;
  display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
.filial-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.filial-select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:13px;padding:6px 12px;font-family:inherit;cursor:pointer;}
.filial-select:focus{border-color:var(--blue);outline:none;}

/* Responsive */
@media(max-width:768px){
  .mod-grid{grid-template-columns:1fr;}
  .alert-strip{flex-direction:column;}
  .header{padding:12px 16px;}
  .main{padding:20px 16px 40px;}
  .hdr-user{display:none;}
  .filial-bar{padding:8px 16px;}
}
</style>
</head>
<body>

<div class="header">
  <div class="hdr-left">
    <img src="logo-classic-icon.jpg" alt="" style="height:36px;width:auto;border-radius:8px;object-fit:contain;" onerror="this.style.display='none'">
    <div class="hdr-logo">CLASSIC <span>ERP</span></div>
  </div>
  <div class="hdr-right">
    <div class="session-dot" title="Sessão ativa"></div>
    <div class="hdr-user" id="hdrUser">Carregando...</div>
    <button class="btn-out" onclick="RHAuth.logout()">Sair</button>
  </div>
</div>

<div class="filial-bar" id="filialBar" style="display:none">
  <span class="filial-label">Unidade</span>
  <select class="filial-select" id="filialSelect" onchange="trocarFilial()"></select>
</div>

<div class="main">
  <div id="alertStrip" class="alert-strip"></div>
  <div id="recentStrip"></div>
  <div id="modulesContainer"><div class="loading">Carregando módulos...</div></div>
  <div id="sysAlerts"></div>
</div>

<script>
/* ═══════════════════════════════════════
   CONFIGURAÇÃO DE MÓDULOS — fonte única
   ═══════════════════════════════════════ */
const MODULOS = [
  // ── OPERAÇÃO ──
  { grupo:'Operação', id:'gestao_rh_sst', nome:'Gestão RH & SST', icon:'👥',
    href:'gestao_rh_sst.html', desc:'Funcionários, ASO, treinamentos, EPIs, acidentes e desligamentos.',
    badge:'RH & SST', perfis:['administrador','rh','diretoria','sst','gestor','gestor_confianca'] },
  { grupo:'Operação', id:'cq', nome:'Controle de Qualidade', icon:'🔬',
    href:'index_2.html', desc:'Inspeções, recebimentos, classificação ABC, ranking de fornecedores.',
    badge:'CQ', perfis:['administrador','rh','qualidade','diretoria'] },
  { grupo:'Operação', id:'epis', nome:'Gestão de EPIs', icon:'🦺',
    href:'epis.html', desc:'Catálogo, entregas, pendências de assinatura, ordens de serviço.',
    badge:'SST', perfis:['administrador','rh','sst','gestor','gestor_confianca','diretoria'] },
  { grupo:'Operação', id:'recrutamento', nome:'Recrutamento & Seleção', icon:'🎯',
    href:'recrutamento_selecao.html', desc:'Vagas, candidatos, pipeline kanban e banco de talentos.',
    badge:'R&S', perfis:['administrador','rh','diretoria'] },
  { grupo:'Operação', id:'pagamentos', nome:'Gestão de Pagamentos', icon:'💰',
    href:'exportar_pagamentos.html', desc:'Dados bancários, lotes de pagamento, exportação financeiro.',
    badge:'Financeiro', perfis:['administrador','rh','diretoria','financeiro'] },
  { grupo:'Operação', id:'saude', nome:'Saúde e Equilíbrio', icon:'💬',
    href:'saude_mental.html', desc:'Saúde mental, risco psicossocial, gatilhos e NR-1.',
    badge:'NR-1', perfis:['administrador','rh','diretoria','sst'] },
  { grupo:'Operação', id:'lideranca', nome:'Gestão & Liderança', icon:'🏆',
    href:'lideranca.html', desc:'Avaliações, metas, engajamento, rankings e organograma.',
    badge:'Liderança', perfis:['administrador','rh','diretoria','gestor','gestor_confianca'] },
  { grupo:'Operação', id:'cipa', nome:'CIPA', icon:'🛡️',
    href:'cipa.html', desc:'Mandatos, membros, reuniões, inspeções e canal de denúncias.',
    badge:'SST', perfis:['administrador','rh','sst','diretoria'] },
  { grupo:'Operação', id:'estoque', nome:'Estoque', icon:'📦',
    href:'estoque.html', desc:'Controle de estoque, movimentações, categorias e filiais.',
    badge:'Estoque', perfis:['administrador','estoque','diretoria'] },

  // ── DASHBOARDS ──
  { grupo:'Dashboards', id:'dash_sst', nome:'Dashboard SST', icon:'📊',
    href:'dashboard_sst.html', desc:'KPIs de conformidade, turnover, risco por setor.',
    badge:'BI', perfis:['administrador','rh','diretoria','sst'] },
  { grupo:'Dashboards', id:'dash_custos', nome:'Dashboard Custos', icon:'💸',
    href:'dashboard_custos.html', desc:'CT-e, gastos por colaborador, análise por rota e setor.',
    badge:'BI', perfis:['administrador','rh','diretoria','financeiro'] },
  { grupo:'Dashboards', id:'esocial', nome:'Monitor eSocial', icon:'📋',
    href:'monitor-esocial.html', desc:'Eventos SST pendentes para envio ao eSocial.',
    badge:'Fiscal', perfis:['administrador','rh','sst'] },
  { grupo:'Dashboards', id:'ficha360', nome:'Ficha 360°', icon:'📄',
    href:'ficha_360.html', desc:'Visão completa do colaborador com todos os indicadores.',
    badge:'BI', perfis:['administrador','rh','diretoria','gestor_confianca'] },

  // ── INTEGRAÇÕES ──
  { grupo:'Integrações', id:'convenia', nome:'Integração Convenia', icon:'🔗',
    href:'convenia_integracao.html', desc:'Sincronizar funcionários e dados com a plataforma Convenia.',
    badge:'Integração', perfis:['administrador','rh'] },
  { grupo:'Integrações', id:'agente_ia', nome:'Agentes de IA', icon:'🤖',
    href:'agente-ia.html', desc:'Agentes automatizados para análise trabalhista e SST.',
    badge:'IA', perfis:['administrador','rh'] },

  // ── ADMINISTRAÇÃO ──
  { grupo:'Administração', id:'gestao_filiais', nome:'Empresas & Filiais', icon:'🏢',
    href:'gestao_filiais.html', desc:'Cadastro de empresas, filiais e configurações.',
    badge:'Admin', perfis:['administrador'] },
];

/* ═══════════════════════════════════════
   ALERT CARDS CONFIG
   ═══════════════════════════════════════ */
const ALERT_CARDS = [
  { id:'func_ativos', label:'Colaboradores', icon:'👥', href:'gestao_rh_sst.html', classe:'neutral' },
  { id:'alertas_abertos', label:'Alertas Abertos', icon:'⚠️', href:'gestao_rh_sst.html', classe:'warn', minimo:1 },
  { id:'asos_vencer', label:'ASOs Vencendo', icon:'🏥', href:'gestao_rh_sst.html?tab=aso&filtro=vencer30d', classe:'crit', minimo:1 },
  { id:'treinamentos_vencidos', label:'Trein. Vencidos', icon:'📚', href:'gestao_rh_sst.html?tab=treinamentos&filtro=vencido', classe:'crit', minimo:1 },
  { id:'processos_abertos', label:'Processos RH', icon:'📋', href:'gestao_rh_sst.html?tab=desligamentos', classe:'warn', minimo:1 },
  { id:'pendencias_agente', label:'Pendências IA', icon:'🤖', href:'agente-ia.html', classe:'warn', minimo:1 },
];

/* ═══════════════════════════════════════
   RENDER
   ═══════════════════════════════════════ */
function renderAlerts(data) {
  const strip = document.getElementById('alertStrip');
  strip.innerHTML = ALERT_CARDS
    .filter(a => !a.minimo || (data[a.id] || 0) >= a.minimo)
    .map(a => {
      const val = data[a.id] || 0;
      const cls = val === 0 ? 'ok' : a.classe;
      return `<a class="alert-card" href="${a.href}">
        <div class="alert-val ${cls}">${val.toLocaleString('pt-BR')}</div>
        <div class="alert-lbl">${a.label}</div>
      </a>`;
    }).join('');
}

function renderModules(perfil) {
  const container = document.getElementById('modulesContainer');
  const visiveis = MODULOS.filter(m => m.perfis.includes(perfil));
  const grupos = [...new Set(visiveis.map(m => m.grupo))];

  container.innerHTML = grupos.map(g => {
    const mods = visiveis.filter(m => m.grupo === g);
    return `<div class="section">
      <div class="section-title">${g}</div>
      <div class="mod-grid">${mods.map(m => `
        <a class="mod-card" href="${m.href}" data-id="${m.id}">
          <div class="mod-icon">${m.icon}</div>
          <div class="mod-name">${m.nome}</div>
          <div class="mod-desc">${m.desc}</div>
          <div class="mod-badge">${m.badge}</div>
        </a>`).join('')}
      </div>
    </div>`;
  }).join('');

  // Track clicks for recent modules
  container.querySelectorAll('.mod-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      let recents = JSON.parse(localStorage.getItem('hub_recents') || '[]');
      recents = [id, ...recents.filter(r => r !== id)].slice(0, 5);
      localStorage.setItem('hub_recents', JSON.stringify(recents));
    });
  });
}

function renderRecents(perfil) {
  const strip = document.getElementById('recentStrip');
  const recents = JSON.parse(localStorage.getItem('hub_recents') || '[]');
  const visiveis = recents
    .map(id => MODULOS.find(m => m.id === id))
    .filter(m => m && m.perfis.includes(perfil));

  if (!visiveis.length) { strip.innerHTML = ''; return; }

  strip.innerHTML = `<div class="section" style="margin-bottom:20px">
    <div class="section-title">Recentes</div>
    <div class="recent-strip">${visiveis.map(m =>
      `<a class="recent-chip" href="${m.href}">${m.icon} ${m.nome}</a>`
    ).join('')}</div>
  </div>`;
}

function renderSysAlerts(data) {
  const container = document.getElementById('sysAlerts');
  const alerts = [];

  if (data.alertas_abertos > 10) alerts.push({ nivel:'yellow', msg:`${data.alertas_abertos} alertas de orquestração abertos` });
  if (data.pendencias_agente > 100) alerts.push({ nivel:'yellow', msg:`${data.pendencias_agente} pendências de agentes IA aguardando ação` });
  if (data.treinamentos_vencidos > 0) alerts.push({ nivel:'red', msg:`${data.treinamentos_vencidos} treinamentos vencidos — risco de não conformidade` });
  if (data.asos_vencer > 0) alerts.push({ nivel:'red', msg:`${data.asos_vencer} ASOs vencendo em 30 dias` });

  if (!alerts.length) { container.innerHTML = ''; return; }

  container.innerHTML = `<div class="section" style="margin-top:12px">
    <div class="section-title">Alertas do Sistema</div>
    <div class="sys-alerts">${alerts.map(a =>
      `<div class="sys-alert-item"><span class="sys-dot ${a.nivel}"></span>${a.msg}</div>`
    ).join('')}</div>
  </div>`;
}

/* ═══════════════════════════════════════
   FILIAL CONTEXT
   ═══════════════════════════════════════ */
async function carregarFiliais(user) {
  try {
    const filiais = user.filiais_acesso || [];
    if (filiais.length <= 1) {
      // Single filial — no selector needed, store the one
      if (filiais.length === 1) localStorage.setItem('filial_ativa', filiais[0]);
      return;
    }

    // Multiple filiais — show selector
    const res = await RH_API.fetch('rpc/rh_listar_filiais', { method: 'POST', body: {} });
    const data = await res.json();
    if (!res.ok || !Array.isArray(data) || data.length <= 1) return;

    const sel = document.getElementById('filialSelect');
    const salva = localStorage.getItem('filial_ativa');

    sel.innerHTML = '<option value="">Todas as unidades</option>' +
      data.map(f => `<option value="${f.id}" ${f.id === salva ? 'selected' : ''}>${f.nome_fantasia}${f.cidade ? ' — ' + f.cidade : ''}</option>`).join('');

    document.getElementById('filialBar').style.display = 'flex';
  } catch(e) { console.warn('Filiais:', e); }
}

function trocarFilial() {
  const val = document.getElementById('filialSelect').value;
  if (val) {
    localStorage.setItem('filial_ativa', val);
  } else {
    localStorage.removeItem('filial_ativa');
  }
  // Reload to apply context
  window.location.reload();
}

// Utility: get active filial ID (used by other pages)
function getFilialAtiva() {
  return localStorage.getItem('filial_ativa') || null;
}

/* ═══════════════════════════════════════
   INIT
   ═══════════════════════════════════════ */
(async () => {
  const user = await RHAuth.init();
  if (!user) return;

  // Header
  document.getElementById('hdrUser').innerHTML =
    `<strong>${user.nome || user.email}</strong><span class="hdr-badge">${user.perfil}</span>`;

  // Load filiais
  await carregarFiliais(user);

  // Modules
  renderModules(user.perfil);
  renderRecents(user.perfil);

  // Data — alerts and KPIs
  try {
    const res = await RH_API.fetch('rpc/hub_resumo', { method: 'POST', body: {} });
    const data = await res.json();
    if (res.ok && data) {
      renderAlerts(data);
      renderSysAlerts(data);
    }
  } catch(e) { console.warn('Hub resumo:', e); }
})();
</script>
</body>
</html>
