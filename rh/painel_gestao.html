<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic RH - Painel de Gestao</title>
<link rel="stylesheet" href="ds.css">
<script src="config.js"></script>
<script src="rh_auth.js"></script>
<script src="api.js"></script>
<script src="ui_components.js"></script>
<script src="page_bootstrap.js"></script>
<script src="shell.js"></script>
</head>
<body class="page-bg">

<!-- Mobile overlay -->
<div class="sidebar-mobile-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <img src="logo-classic-icon.jpg" alt="Classic Couros">
    <span class="sidebar-brand-text">Classic RH</span>
  </div>

  <button class="sidebar-toggle" id="sidebarToggle" title="Recolher menu">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>

  <nav class="sidebar-nav">
    <div class="sidebar-group">
      <div class="sidebar-group-label">Gestao de Confianca</div>

      <a href="painel_gestao.html" class="sidebar-item active" data-page="gestor_confianca">
        <span class="sidebar-item-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span class="sidebar-item-label">Dashboard</span>
      </a>

      <a href="#sec-equipe" class="sidebar-item" onclick="document.getElementById('sec-equipe')?.scrollIntoView({behavior:'smooth'})">
        <span class="sidebar-item-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></span>
        <span class="sidebar-item-label">Minha Equipe</span>
      </a>

      <a href="#sec-acompanhamentos" class="sidebar-item" onclick="document.getElementById('sec-acompanhamentos')?.scrollIntoView({behavior:'smooth'})">
        <span class="sidebar-item-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span>
        <span class="sidebar-item-label">Acompanhamentos</span>
      </a>

      <a href="alertas_rh.html" class="sidebar-item" data-page="alertas_rh">
        <span class="sidebar-item-icon"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></span>
        <span class="sidebar-item-label">Pendencias</span>
        <span class="sidebar-badge" id="sb-pendencias" style="display:none"></span>
      </a>

      <a href="alertas_rh.html" class="sidebar-item">
        <span class="sidebar-item-icon"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></span>
        <span class="sidebar-item-label">Plano de Acao</span>
      </a>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-group-label">SST &amp; Seguranca</div>

      <a href="sst_dashboard.html" class="sidebar-item" data-page="sst_dashboard">
        <span class="sidebar-item-icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
        <span class="sidebar-item-label">SST</span>
      </a>

      <a href="epis.html" class="sidebar-item" data-page="epis">
        <span class="sidebar-item-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></span>
        <span class="sidebar-item-label">EPIs</span>
      </a>

      <a href="treinamentos.html" class="sidebar-item" data-page="treinamentos">
        <span class="sidebar-item-icon"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg></span>
        <span class="sidebar-item-label">Treinamentos</span>
      </a>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-group-label">Avancado</div>

      <a href="motor_v2.html" class="sidebar-item" data-page="motor_v2">
        <span class="sidebar-item-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></span>
        <span class="sidebar-item-label">Motor de Decisao</span>
      </a>
    </div>
  </nav>

  <div class="sidebar-footer">
    <div id="rh-user-chip"></div>
  </div>
</aside>

<!-- MAIN -->
<div class="main-content">
  <div class="topbar">
    <div class="topbar-left">
      <button class="mobile-menu-btn" id="mobileMenuBtn" title="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <div class="topbar-right">
      <div class="topbar-user" id="topbar-user"></div>
    </div>
  </div>

  <div class="content-area" id="content-area">
    <div class="loading-state" id="loading"><span class="spinner"></span> Carregando painel de confianca...</div>
  </div>
</div>

<!-- MODAL: Registrar Acompanhamento -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Registrar Acompanhamento</h2>
      <button class="modal-close" id="modalClose" title="Fechar">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Funcionario *</label>
        <select class="form-select" id="acomp-funcionario" required>
          <option value="">Selecione...</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Tipo *</label>
        <select class="form-select" id="acomp-tipo" required>
          <option value="">Selecione o tipo...</option>
          <option value="Conversa de Alinhamento">Conversa de Alinhamento</option>
          <option value="Feedback">Feedback</option>
          <option value="Capacitacao/Treinamento Interno">Capacitacao/Treinamento Interno</option>
          <option value="Orientacao">Orientacao</option>
          <option value="Advertencia Verbal">Advertencia Verbal</option>
          <option value="Elogio/Reconhecimento">Elogio/Reconhecimento</option>
          <option value="Definicao de Meta">Definicao de Meta</option>
          <option value="Acompanhamento de Experiencia">Acompanhamento de Experiencia</option>
          <option value="Retorno de Afastamento">Retorno de Afastamento</option>
          <option value="Plano de Desenvolvimento">Plano de Desenvolvimento</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Assunto *</label>
        <input type="text" class="form-input" id="acomp-assunto" placeholder="Descreva o assunto brevemente" required>
      </div>

      <div class="form-group">
        <label class="form-label">Descricao</label>
        <textarea class="form-textarea" id="acomp-descricao" placeholder="Detalhes do acompanhamento..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Resultado</label>
          <select class="form-select" id="acomp-resultado">
            <option value="">Selecione...</option>
            <option value="Positivo">Positivo</option>
            <option value="Neutro">Neutro</option>
            <option value="Atencao">Atencao</option>
            <option value="Critico">Critico</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Duracao (minutos)</label>
          <input type="number" class="form-input" id="acomp-duracao" placeholder="Ex: 30" min="1" max="480">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Proxima Acao</label>
        <input type="text" class="form-input" id="acomp-proxima" placeholder="O que deve ser feito em seguida?">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Prazo da Proxima Acao</label>
          <input type="date" class="form-input" id="acomp-prazo">
        </div>
        <div class="form-group" style="display:flex;align-items:flex-end;padding-bottom:var(--space-2);">
          <label class="form-check">
            <input type="checkbox" id="acomp-confidencial">
            <span>Confidencial - Visivel apenas para RH e Admin</span>
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalSave">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Registrar
      </button>
    </div>
  </div>
</div>

<script>
(async function() {

  // ---- Auth ----
  const user = await RHAuth.init({ perfisPermitidos: ['gestor_confianca','admin','rh'] });
  if (!user) return;

  renderUserChip(user);

  // ---- State ----
  let dashData = null;
  let equipeList = [];
  let acompList = [];

  // ---- Load data ----
  try {
    const rpcRes = await API.rpc('gestor_confianca_dashboard', {});
    if (rpcRes.ok) {
      const raw = rpcRes.data;
      dashData = Array.isArray(raw) ? raw[0] : raw;
    }
  } catch(e) { console.error('Erro ao carregar dashboard:', e); }

  if (!dashData) {
    document.getElementById('loading').innerHTML = 'Erro ao carregar dados. Verifique sua conexao e tente novamente.';
    return;
  }

  equipeList = dashData.equipe || [];
  acompList = dashData.acompanhamentos_recentes || [];
  const kpis = dashData.kpis || {};
  const turnover = dashData.turnover || {};
  const setor = dashData.setor || 'Setor';

  // Sort equipe by score ascending (worst first)
  equipeList.sort((a, b) => (a.score ?? 999) - (b.score ?? 999));

  // ---- Render ----
  const area = document.getElementById('content-area');
  area.innerHTML = '';

  // -- Welcome bar --
  const welcomeHTML = `
    <div class="welcome-bar">
      <h1>Painel de Gestao Operacional</h1>
      <span class="date-display">${formatDateBR(new Date())}</span>
    </div>
    <div class="trust-banner">
      <span class="trust-banner-icon">&#128274;</span>
      <div>
        <strong>Acesso ampliado</strong> - Dados de salario e performance individual visiveis.
        Acompanhamentos registrados geram trilha de auditoria.
      </div>
      <span class="trust-banner-badge">Gestao Operacional</span>
    </div>
  `;
  area.insertAdjacentHTML('beforeend', welcomeHTML);

  // -- KPIs --
  const turnoverPct = turnover.ativos > 0
    ? ((turnover.desligados_12m / turnover.ativos) * 100).toFixed(1)
    : '0.0';

  const scoreColor = (kpis.score_medio ?? 0) >= 70 ? 'green' : (kpis.score_medio ?? 0) >= 50 ? 'orange' : 'red';
  const turnoverColor = parseFloat(turnoverPct) > 15 ? 'red' : parseFloat(turnoverPct) > 8 ? 'orange' : 'green';

  const kpiHTML = `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-value blue">${kpis.ativos ?? 0}</div>
        <div class="kpi-label">Equipe Ativa</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value ${scoreColor}">${kpis.score_medio != null ? Number(kpis.score_medio).toFixed(1) : '--'}</div>
        <div class="kpi-label">Score Medio do Setor</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value ${(kpis.atestados_30d ?? 0) > 5 ? 'red' : (kpis.atestados_30d ?? 0) > 2 ? 'orange' : 'default'}">${kpis.atestados_30d ?? 0}</div>
        <div class="kpi-label">Atestados 30d</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value ${(kpis.pendencias ?? 0) > 0 ? 'orange' : 'green'}">${kpis.pendencias ?? 0}</div>
        <div class="kpi-label">Pendencias</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value blue">${kpis.acompanhamentos_mes ?? 0}</div>
        <div class="kpi-label">Acompanhamentos no Mes</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value ${turnoverColor}">${turnoverPct}%</div>
        <div class="kpi-label">Turnover Setor (Anual)</div>
      </div>
    </div>
  `;
  area.insertAdjacentHTML('beforeend', kpiHTML);

  // -- Section: Minha Equipe --
  const equipeSec = document.createElement('div');
  equipeSec.id = 'sec-equipe';

  let equipeRows = '';
  if (equipeList.length === 0) {
    equipeRows = `<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:var(--space-8);">Nenhum funcionario encontrado</td></tr>`;
  } else {
    equipeList.forEach(f => {
      const score = f.score ?? 0;
      const sColor = score >= 70 ? 'var(--success)' : score >= 50 ? 'var(--warning)' : 'var(--danger)';
      const sTextClass = score >= 70 ? 'green' : score >= 50 ? 'orange' : 'red';
      const rowClass = score < 50 ? 'row-red' : score < 70 ? 'row-yellow' : '';

      const classifBadge = getClassifBadge(f.classificacao);

      // Check ultimo_acomp
      let acompBadge = '';
      if (!f.ultimo_acomp || diasDesde(f.ultimo_acomp) > 60) {
        acompBadge = `<span class="badge-alert">Sem acompanhamento</span>`;
      } else {
        acompBadge = `<span style="font-size:var(--text-xs);color:var(--text-muted);">${formatDateBR(new Date(f.ultimo_acomp))}</span>`;
      }

      const salario = f.salario_base != null
        ? `R$ ${Number(f.salario_base).toLocaleString('pt-BR', {minimumFractionDigits:2})}`
        : '--';

      equipeRows += `
        <tr class="${rowClass}">
          <td><a href="ficha.html?id=${f.id}" class="nome-link">${escHtml(f.nome)}</a></td>
          <td>${escHtml(f.cargo || '--')}</td>
          <td><span class="salary-text">${salario}</span></td>
          <td>
            <div class="score-cell">
              <div class="score-bar-track">
                <div class="score-bar-fill" style="width:${score}%;background:${sColor}"></div>
              </div>
              <span class="score-num" style="color:${sColor}">${score}</span>
            </div>
          </td>
          <td>${classifBadge}</td>
          <td style="text-align:center;font-weight:var(--weight-semibold);${(f.atestados_6m ?? 0) > 3 ? 'color:var(--danger)' : ''}">${f.atestados_6m ?? 0}</td>
          <td>${acompBadge}</td>
          <td>
            <button class="btn btn-sm btn-primary btn-registrar" data-id="${f.id}" data-nome="${escAttr(f.nome)}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Registrar
            </button>
          </td>
        </tr>`;
    });
  }

  equipeSec.innerHTML = `
    <h2 class="section-heading" id="sec-equipe-heading">
      <span class="section-heading-icon">&#128101;</span>
      Minha Equipe
      <span style="margin-left:auto;">
        <button class="btn btn-sm btn-primary" id="btnNovoAcomp">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Novo Acompanhamento
        </button>
      </span>
    </h2>
    <div class="table-card">
      <div class="table-scroll">
        <table class="ds-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Cargo</th>
              <th>Salario</th>
              <th>Score</th>
              <th>Classificacao</th>
              <th>Atestados 6m</th>
              <th>Ultimo Acomp.</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody>${equipeRows}</tbody>
        </table>
      </div>
    </div>
  `;
  area.appendChild(equipeSec);

  // -- Section: Historico de Acompanhamentos --
  const acompSec = document.createElement('div');
  acompSec.id = 'sec-acompanhamentos';

  let acompHTML = '';
  if (acompList.length === 0) {
    acompHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">&#128221;</div>
        <div class="empty-state-text">Nenhum acompanhamento registrado ainda.</div>
      </div>`;
  } else {
    acompHTML = '<div class="timeline-list">';
    acompList.forEach(a => {
      const resultado = (a.resultado || '').toLowerCase();
      const resClass = resultado === 'positivo' ? 'positivo'
        : resultado === 'critico' ? 'critico'
        : resultado === 'atencao' ? 'atencao'
        : 'neutro';
      const resBadge = resultado === 'positivo' ? '<span class="badge badge-green">Positivo</span>'
        : resultado === 'critico' ? '<span class="badge badge-red">Critico</span>'
        : resultado === 'atencao' ? '<span class="badge badge-yellow">Atencao</span>'
        : '<span class="badge badge-gray">Neutro</span>';

      const tipoBadge = getTipoBadge(a.tipo);

      let proximaHTML = '';
      if (a.proxima_acao || a.prazo) {
        const prazoVencido = a.prazo && new Date(a.prazo) < new Date() ? '<span class="badge badge-red">Prazo vencido</span>' : '';
        proximaHTML = `
          <div class="timeline-proxima">
            ${a.proxima_acao ? `<span>Proxima acao: <strong>${escHtml(a.proxima_acao)}</strong></span>` : ''}
            ${a.prazo ? `<span>Prazo: ${formatDateBR(new Date(a.prazo))}</span>` : ''}
            ${prazoVencido}
          </div>`;
      }

      acompHTML += `
        <div class="timeline-card ${resClass}">
          <div class="timeline-header">
            <div class="timeline-meta">
              <span class="timeline-date">${a.data ? formatDateBR(new Date(a.data)) : '--'}</span>
              ${tipoBadge}
              ${resBadge}
            </div>
            <span class="timeline-funcionario">${escHtml(a.funcionario || '')}</span>
          </div>
          <div class="timeline-title">${escHtml(a.assunto || '')}</div>
          ${proximaHTML}
        </div>`;
    });
    acompHTML += '</div>';
  }

  acompSec.innerHTML = `
    <h2 class="section-heading">
      <span class="section-heading-icon">&#128221;</span>
      Historico de Acompanhamentos
    </h2>
    ${acompHTML}
  `;
  area.appendChild(acompSec);

  // -- Section: Turnover e Estabilidade --
  const turnoverSec = document.createElement('div');
  turnoverSec.id = 'sec-turnover';

  // Compute extra stats from equipe
  const emExperiencia = equipeList.filter(f => (f.dias_empresa ?? 999) <= 90).length;
  const mediaDias = equipeList.length > 0
    ? Math.round(equipeList.reduce((s, f) => s + (f.dias_empresa ?? 0), 0) / equipeList.length)
    : 0;
  const mediaAnos = (mediaDias / 365).toFixed(1);
  const treinVencidos = kpis.trein_vencidos ?? 0;

  turnoverSec.innerHTML = `
    <h2 class="section-heading">
      <span class="section-heading-icon">&#128200;</span>
      Turnover e Estabilidade
    </h2>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" style="color:${parseFloat(turnoverPct) > 15 ? 'var(--danger)' : parseFloat(turnoverPct) > 8 ? 'var(--warning)' : 'var(--success)'}">${turnoverPct}%</div>
        <div class="stat-label">Turnover Anual</div>
        <div style="font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-1);">${turnover.desligados_12m ?? 0} desligados / ${turnover.ativos ?? 0} ativos</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:${emExperiencia > 0 ? 'var(--warning)' : 'var(--text)'}">${emExperiencia}</div>
        <div class="stat-label">Em Experiencia (ate 90 dias)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${mediaAnos} anos</div>
        <div class="stat-label">Media Tempo de Empresa</div>
        <div style="font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-1);">${mediaDias} dias em media</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:${treinVencidos > 0 ? 'var(--danger)' : 'var(--success)'}">${treinVencidos}</div>
        <div class="stat-label">Treinamentos Vencidos</div>
      </div>
    </div>
  `;
  area.appendChild(turnoverSec);

  // ---- Pendencias badge on sidebar ----
  if ((kpis.pendencias ?? 0) > 0) {
    const badge = document.getElementById('sb-pendencias');
    if (badge) { badge.textContent = kpis.pendencias; badge.style.display = ''; }
  }

  // ---- Modal logic ----
  const overlay = document.getElementById('modalOverlay');
  const selFunc = document.getElementById('acomp-funcionario');

  // Populate funcionario select
  equipeList.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.id;
    opt.textContent = f.nome;
    selFunc.appendChild(opt);
  });

  function openModal(funcId) {
    // Reset form
    document.getElementById('acomp-tipo').value = '';
    document.getElementById('acomp-assunto').value = '';
    document.getElementById('acomp-descricao').value = '';
    document.getElementById('acomp-resultado').value = '';
    document.getElementById('acomp-proxima').value = '';
    document.getElementById('acomp-prazo').value = '';
    document.getElementById('acomp-duracao').value = '';
    document.getElementById('acomp-confidencial').checked = false;

    if (funcId) selFunc.value = funcId;
    else selFunc.value = '';

    overlay.classList.add('active');
    document.getElementById('acomp-tipo').focus();
  }

  function closeModal() {
    overlay.classList.remove('active');
  }

  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalCancel').onclick = closeModal;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // Open from table buttons
  document.querySelectorAll('.btn-registrar').forEach(btn => {
    btn.addEventListener('click', () => openModal(btn.dataset.id));
  });

  // Open from header button
  document.getElementById('btnNovoAcomp').addEventListener('click', () => openModal(null));

  // Save
  document.getElementById('modalSave').addEventListener('click', async () => {
    const funcId = selFunc.value;
    const tipo = document.getElementById('acomp-tipo').value;
    const assunto = document.getElementById('acomp-assunto').value.trim();

    if (!funcId) { showToast('Selecione o funcionario.', 'error'); return; }
    if (!tipo) { showToast('Selecione o tipo de acompanhamento.', 'error'); return; }
    if (!assunto) { showToast('Preencha o assunto.', 'error'); return; }

    const payload = {
      p_funcionario_id: funcId,
      p_tipo: tipo,
      p_assunto: assunto,
      p_descricao: document.getElementById('acomp-descricao').value.trim() || null,
      p_resultado: document.getElementById('acomp-resultado').value || null,
      p_proxima_acao: document.getElementById('acomp-proxima').value.trim() || null,
      p_prazo: document.getElementById('acomp-prazo').value || null,
      p_duracao: document.getElementById('acomp-duracao').value ? parseInt(document.getElementById('acomp-duracao').value) : null,
      p_confidencial: document.getElementById('acomp-confidencial').checked
    };

    const saveBtn = document.getElementById('modalSave');
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner"></span> Salvando...';

    try {
      const res = await API.rpc('registrar_acompanhamento', payload);

      if (res.ok) {
        showToast('Acompanhamento registrado com sucesso!', 'success');
        closeModal();
        // Reload page after short delay to show updated data
        setTimeout(() => window.location.reload(), 1200);
      } else {
        showToast('Erro ao registrar: ' + (res.error || 'Tente novamente.'), 'error');
      }
    } catch(e) {
      showToast('Erro de conexao. Tente novamente.', 'error');
      console.error('Erro ao registrar acompanhamento:', e);
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Registrar';
    }
  });

  // ---- Sidebar toggle ----
  const sidebar = document.getElementById('sidebar');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const sidebarOverlay = document.getElementById('sidebarOverlay');

  if (sidebarToggle) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      localStorage.setItem('rh_sidebar_collapsed', sidebar.classList.contains('collapsed'));
    });
    if (localStorage.getItem('rh_sidebar_collapsed') === 'true') {
      sidebar.classList.add('collapsed');
    }
  }
  if (mobileMenuBtn) {
    mobileMenuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('mobile-open');
      sidebarOverlay.classList.toggle('active');
    });
  }
  if (sidebarOverlay) {
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('mobile-open');
      sidebarOverlay.classList.remove('active');
    });
  }

  // ---- Helpers ----

  function escHtml(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function escAttr(str) {
    if (!str) return '';
    return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function formatDateBR(d) {
    if (!d || isNaN(d.getTime())) return '--';
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function diasDesde(dateStr) {
    if (!dateStr) return 9999;
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return 9999;
    return Math.floor((Date.now() - d.getTime()) / 86400000);
  }

  function getClassifBadge(classif) {
    if (!classif) return '<span class="badge badge-gray">--</span>';
    const c = classif.toLowerCase();
    if (c.includes('excelent') || c.includes('otimo') || c === 'a') return `<span class="badge badge-green">${escHtml(classif)}</span>`;
    if (c.includes('bom') || c === 'b') return `<span class="badge badge-blue">${escHtml(classif)}</span>`;
    if (c.includes('regular') || c === 'c') return `<span class="badge badge-yellow">${escHtml(classif)}</span>`;
    if (c.includes('critico') || c.includes('insuficiente') || c === 'd' || c === 'e') return `<span class="badge badge-red">${escHtml(classif)}</span>`;
    return `<span class="badge badge-gray">${escHtml(classif)}</span>`;
  }

  function getTipoBadge(tipo) {
    if (!tipo) return '';
    const map = {
      'feedback': 'badge-blue',
      'elogio/reconhecimento': 'badge-green',
      'advertencia verbal': 'badge-red',
      'orientacao': 'badge-yellow',
      'conversa de alinhamento': 'badge-purple',
      'capacitacao/treinamento interno': 'badge-teal',
      'definicao de meta': 'badge-blue',
      'acompanhamento de experiencia': 'badge-purple',
      'retorno de afastamento': 'badge-yellow',
      'plano de desenvolvimento': 'badge-teal',
    };
    const cls = map[tipo.toLowerCase()] || 'badge-gray';
    return `<span class="badge ${cls}">${escHtml(tipo)}</span>`;
  }

  function showToast(msg, type) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const icon = type === 'success' ? '&#10004;' : '&#9888;';
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<span style="font-size:16px;">${icon}</span><span>${escHtml(msg)}</span>`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }

  function renderUserChip(u) {
    const chip = document.getElementById('rh-user-chip');
    const topbar = document.getElementById('topbar-user');
    if (!u) return;
    const ini = (u.nome || u.email || '?')[0].toUpperCase();
    const html = `
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);
          display:flex;align-items:center;justify-content:center;
          font-weight:700;font-size:12px;color:white;flex-shrink:0;">${ini}</div>
        <div style="line-height:1.2;">
          <div style="font-size:12px;font-weight:600;color:var(--text);">${escHtml(u.nome || u.email)}</div>
          <div style="font-size:10px;color:var(--primary);text-transform:uppercase;letter-spacing:.04em;">${escHtml(u.perfil || '')}</div>
        </div>
      </div>`;
    if (chip) chip.innerHTML = html;
    if (topbar) topbar.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;">
        ${html}
        <button onclick="RHAuth.logout()" title="Sair" style="background:none;border:1px solid var(--border);
          border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;padding:4px 8px;font-size:11px;
          font-family:var(--font-family);transition:all .2s;"
          onmouseover="this.style.color='var(--danger)';this.style.borderColor='var(--danger)'"
          onmouseout="this.style.color='var(--text-muted)';this.style.borderColor='var(--border)'">Sair</button>
      </div>`;
  }

})();
</script>
</body>
</html>
