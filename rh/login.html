<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Classic RH &amp; SST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="rh_auth.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Inter',system-ui,sans-serif;
  background:#F1F5F9;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px;
}
.login-card {
  background:#fff;
  border:1px solid #E2E8F0;
  border-radius:16px;
  box-shadow:0 4px 24px rgba(0,0,0,0.06);
  padding:40px 36px;
  max-width:400px;
  width:100%;
}
.logo { text-align:center; margin-bottom:28px; }
.logo-icon {
  width:56px; height:56px; border-radius:50%;
  background:#2563EB; color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:700; margin:0 auto 12px;
}
.logo h1 { font-size:20px; font-weight:700; color:#1E293B; }
.logo p { font-size:13px; color:#64748B; margin-top:2px; }
.form-group { margin-bottom:18px; }
.form-group label {
  display:block; font-size:13px; font-weight:600;
  color:#1E293B; margin-bottom:6px;
}
.form-group input {
  width:100%; padding:11px 14px; font-size:14px;
  font-family:inherit; border:1px solid #E2E8F0;
  border-radius:8px; background:#F8FAFC; color:#1E293B;
  transition:border-color 0.15s;
}
.form-group input:focus {
  outline:none; border-color:#2563EB;
  box-shadow:0 0 0 3px rgba(37,99,235,0.1);
  background:#fff;
}
.btn-login {
  width:100%; padding:12px; font-size:14px; font-weight:600;
  font-family:inherit; color:#fff; background:#2563EB;
  border:none; border-radius:8px; cursor:pointer;
  transition:background 0.15s;
}
.btn-login:hover { background:#1D4ED8; }
.btn-login:disabled { background:#94A3B8; cursor:not-allowed; }
.erro {
  display:none; margin-top:14px; padding:10px 14px;
  background:#FEE2E2; color:#991B1B; border-radius:8px;
  font-size:13px; text-align:center;
}
.versao {
  text-align:center; margin-top:20px;
  font-size:11px; color:#94A3B8;
}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="logo-icon">C</div>
    <h1>Classic RH &amp; SST</h1>
    <p>Gestao de RH e Seguranca do Trabalho</p>
  </div>

  <form id="form-login" onsubmit="doLogin(event)">
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="f-email" placeholder="seu@email.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="f-senha" placeholder="********" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login" id="btn-login">Entrar</button>
  </form>

  <div class="erro" id="erro"></div>
  <div class="versao">Classic RH &amp; SST v2026.03</div>
</div>

<script>
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const erro = document.getElementById('erro');
  erro.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Autenticando...';

  try {
    const email = document.getElementById('f-email').value.trim();
    const senha = document.getElementById('f-senha').value;
    await RHAuth.login(email, senha);
    window.location.href = 'hub.html';
  } catch(err) {
    erro.textContent = err.message;
    erro.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
