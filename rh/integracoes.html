<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integrações — Classic RH & SST</title>
<script src="config.js"></script>
<script src="rh_auth.js"></script>
<link rel="stylesheet" href="ds.css">
<script src="api.js"></script>
<script src="ui_components.js"></script>
<script src="page_bootstrap.js"></script>
<script src="shell.js"></script>
</head>
<body class="page-bg">

<div id="toast"></div>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <a href="app.html" class="back-btn">← Voltar</a>
    <div>
      <div class="page-title">Integrações</div>
      <div class="page-sub">Conectores, sincronização e monitoramento</div>
    </div>
  </div>
  <div id="rh-user-chip"></div>
</div>

<div class="main">

  <!-- KPIs -->
  <div class="kpi-row" id="kpis">
    <div class="kpi"><div class="kpi-val" id="k-conectores">—</div><div class="kpi-lbl">Conectores</div></div>
    <div class="kpi"><div class="kpi-val" id="k-online">—</div><div class="kpi-lbl">Online</div></div>
    <div class="kpi"><div class="kpi-val" id="k-fila">—</div><div class="kpi-lbl">Fila Pendente</div></div>
    <div class="kpi"><div class="kpi-val" id="k-erros">—</div><div class="kpi-lbl">Erros</div></div>
    <div class="kpi"><div class="kpi-val" id="k-24h">—</div><div class="kpi-lbl">Syncs 24h</div></div>
  </div>

  <!-- CONECTORES -->
  <div class="section-title">Conectores</div>
  <div class="conn-grid" id="connGrid">
    <div style="text-align:center;padding:40px;color:var(--muted)"><div class="spinner"></div> Carregando conectores...</div>
  </div>

  <!-- EXECUÇÕES RECENTES -->
  <div class="section-title">Execuções Recentes</div>
  <div class="log-section">
    <div class="log-list" id="execList">
      <div style="text-align:center;padding:20px;color:var(--muted)">Carregando...</div>
    </div>
  </div>

  <!-- ERROS PENDENTES -->
  <div class="section-title">Erros Pendentes</div>
  <div class="log-section">
    <div id="errosSection">
      <div style="text-align:center;padding:20px;color:var(--muted)">Carregando...</div>
    </div>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════════════
// INTEGRACOES.JS — Dashboard de conectores
// Usa tabelas: integ_conector, integ_execucao, integ_fila, stg_erros_importacao
// Usa Edge Function: integ-convenia-proxy
// ════════════════════════════════════════════════════════════════

const COLORS = { convenia: '#e85d26', buscaepi: '#4f8ef7', atak: '#a855f7', secullum: '#10b981' };
const ICONS  = { convenia: '🔗', buscaepi: '🛡️', atak: '📊', secullum: '⏱️' };
const DESCS  = {
  convenia: 'RH: funcionários, afastamentos, férias, documentos',
  buscaepi: 'SST: EPIs, CAs, entregas, ordens de serviço',
  atak: 'ERP: centros de custo, estrutura, financeiro',
  secullum: 'Ponto: importação de cartão ponto e frequência',
};

let conectores = [];
let filaStats = {};

// ═══ INIT ═══
document.addEventListener('DOMContentLoaded', async () => {
  await RHAuth.init();
  await carregarDados();
});

async function carregarDados() {
  await Promise.all([carregarConectores(), carregarExecucoes(), carregarErros(), carregarFilaStats()]);
  atualizarKPIs();
}

// ═══ CONECTORES ═══
async function carregarConectores() {
  try {
    const res = await API.get('integ_conector?order=nome');
    conectores = res.ok ? res.data : [];
    renderConectores();
  } catch { document.getElementById('connGrid').innerHTML = '<div style="color:var(--err);text-align:center;padding:20px">Erro ao carregar conectores</div>'; }
}

function renderConectores() {
  const grid = document.getElementById('connGrid');
  if (!conectores.length) { grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">Nenhum conector configurado</div>'; return; }

  grid.innerHTML = conectores.map(c => {
    const color = COLORS[c.nome] || 'var(--accent)';
    const icon = ICONS[c.nome] || '🔌';
    const desc = DESCS[c.nome] || c.tipo;
    const statusClass = c.status === 'ativo' ? 'online' : c.status === 'pausado' ? 'paused' : c.status === 'erro' ? 'offline' : 'warning';
    const statusLabel = c.status === 'ativo' ? 'Online' : c.status === 'pausado' ? 'Pausado' : c.status === 'erro' ? 'Erro' : c.status;
    const stClass = c.status === 'ativo' ? 'st-online' : c.status === 'pausado' ? 'st-paused' : c.status === 'erro' ? 'st-offline' : 'st-warning';
    const fila = filaStats[c.id] || { pendente: 0, retry: 0, erro: 0 };
    const lastSync = c.ultimo_heartbeat ? timeAgo(c.ultimo_heartbeat) : 'Nunca';

    return `
    <div class="conn-card ${statusClass}" data-id="${c.id}">
      <div class="conn-top">
        <div class="conn-icon" style="background:${color}22;">${icon}</div>
        <div style="flex:1">
          <div class="conn-name" style="color:${color}">${capitalize(c.nome)}</div>
          <div class="conn-desc">${desc}</div>
        </div>
        <span class="conn-status ${stClass}">${statusLabel}</span>
      </div>
      <div class="conn-stats">
        <div class="conn-stat">
          <div class="conn-stat-val">${c.sync_intervalo_minutos}m</div>
          <div class="conn-stat-lbl">Intervalo</div>
        </div>
        <div class="conn-stat">
          <div class="conn-stat-val">${lastSync}</div>
          <div class="conn-stat-lbl">Último Sync</div>
        </div>
        <div class="conn-stat">
          <div class="conn-stat-val" style="color:${fila.pendente + fila.retry > 0 ? 'var(--warn)' : 'var(--ok)'}">${fila.pendente + fila.retry}</div>
          <div class="conn-stat-lbl">Na Fila</div>
        </div>
      </div>
      <div class="conn-actions">
        <button class="btn btn-primary btn-sm" onclick="syncConector('${c.nome}')" id="btn-sync-${c.nome}">
          🔄 Sincronizar
        </button>
        <button class="btn btn-secondary btn-sm" onclick="testarConector('${c.nome}')" id="btn-test-${c.nome}">
          🔍 Testar
        </button>
        ${c.sync_habilitado
          ? `<button class="btn btn-secondary btn-sm" onclick="toggleSync('${c.nome}', false)">⏸ Pausar</button>`
          : `<button class="btn btn-sync btn-sm" onclick="toggleSync('${c.nome}', true)">▶ Ativar</button>`
        }
      </div>
    </div>`;
  }).join('');
}

// ═══ EXECUÇÕES RECENTES ═══
async function carregarExecucoes() {
  try {
    const resExec = await API.get('integ_execucao?order=inicio.desc&limit=15&select=id,conector_id,tipo_entidade,modo,inicio,fim,status,registros_lidos,registros_erro,duracao_ms');
    const execs = resExec.ok ? resExec.data : [];
    renderExecucoes(execs);
  } catch { document.getElementById('execList').innerHTML = '<div style="color:var(--err)">Erro ao carregar</div>'; }
}

function renderExecucoes(execs) {
  const el = document.getElementById('execList');
  if (!execs.length) { el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted)">Nenhuma execução registrada</div>'; return; }

  el.innerHTML = execs.map(e => {
    const conector = conectores.find(c => c.id === e.conector_id);
    const nome = conector ? capitalize(conector.nome) : '?';
    const color = conector ? COLORS[conector.nome] || 'var(--accent)' : 'var(--muted)';
    const dotClass = e.status === 'sucesso' ? 'ok' : e.status === 'erro_total' ? 'err' : e.status === 'erro_parcial' ? 'warn' : 'info';
    const dur = e.duracao_ms ? `${(e.duracao_ms / 1000).toFixed(1)}s` : '';

    return `<div class="log-item">
      <div class="log-dot ${dotClass}"></div>
      <span class="log-time">${fmtDateTime(e.inicio)}</span>
      <span class="log-msg">
        <strong style="color:${color}">${nome}</strong> · ${e.tipo_entidade} · ${e.modo}
        ${e.registros_lidos ? ` · ${e.registros_lidos} lidos` : ''}
        ${e.registros_erro ? ` · <span style="color:var(--err)">${e.registros_erro} erros</span>` : ''}
        ${dur ? ` · ${dur}` : ''}
      </span>
      <span class="tag tag-${dotClass}">${e.status}</span>
    </div>`;
  }).join('');
}

// ═══ ERROS PENDENTES ═══
async function carregarErros() {
  try {
    const resErros = await API.get('stg_erros_importacao?resolvido=eq.false&order=created_at.desc&limit=20');
    const erros = resErros.ok ? resErros.data : [];
    renderErros(erros);
  } catch { document.getElementById('errosSection').innerHTML = '<div style="color:var(--err)">Erro ao carregar</div>'; }
}

function renderErros(erros) {
  const el = document.getElementById('errosSection');
  if (!erros.length) { el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--ok)">✅ Nenhum erro pendente</div>'; return; }

  el.innerHTML = `<table class="err-table">
    <thead><tr><th>Data</th><th>Tabela</th><th>Tipo</th><th>Severidade</th><th>Mensagem</th></tr></thead>
    <tbody>${erros.map(e => `<tr>
      <td class="log-time">${fmtDateTime(e.created_at)}</td>
      <td>${e.tabela_staging || '—'}</td>
      <td><span class="tag tag-${e.severidade === 'critico' ? 'err' : e.severidade === 'erro' ? 'warn' : 'info'}">${e.tipo_erro}</span></td>
      <td>${e.severidade}</td>
      <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.mensagem)}">${esc(e.mensagem)}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// ═══ FILA STATS ═══
async function carregarFilaStats() {
  try {
    const resFila = await API.get('integ_fila?select=conector_id,status');
    const fila = resFila.ok ? resFila.data : [];
    filaStats = {};
    for (const f of fila) {
      if (!filaStats[f.conector_id]) filaStats[f.conector_id] = { pendente: 0, retry: 0, erro: 0 };
      if (f.status === 'pendente') filaStats[f.conector_id].pendente++;
      else if (f.status === 'retry') filaStats[f.conector_id].retry++;
      else if (f.status === 'erro') filaStats[f.conector_id].erro++;
    }
  } catch {}
}

// ═══ KPIs ═══
function atualizarKPIs() {
  document.getElementById('k-conectores').textContent = conectores.length;
  document.getElementById('k-online').textContent = conectores.filter(c => c.status === 'ativo').length;

  let totalFila = 0, totalErros = 0;
  for (const id in filaStats) {
    totalFila += filaStats[id].pendente + filaStats[id].retry;
    totalErros += filaStats[id].erro;
  }
  document.getElementById('k-fila').textContent = totalFila;
  document.getElementById('k-fila').style.color = totalFila > 0 ? 'var(--warn)' : 'var(--ok)';
  document.getElementById('k-erros').textContent = totalErros;
  document.getElementById('k-erros').style.color = totalErros > 0 ? 'var(--err)' : 'var(--ok)';

  // Syncs 24h via execuções (count from integ_execucao loaded)
  document.getElementById('k-24h').textContent = '—';
}

// ═══ AÇÕES ═══
async function syncConector(nome) {
  const btn = document.getElementById(`btn-sync-${nome}`);
  const orig = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> Sincronizando...';
  btn.disabled = true;

  try {
    if (nome === 'convenia') {
      const jwt = RHAuth.getAuthToken();
      const res = await fetch(`${SB_URL}/functions/v1/integ-convenia-proxy`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${jwt}`, 'Content-Type': 'application/json', 'apikey': SB_KEY },
        body: JSON.stringify({ action: 'sync_funcionarios' }),
      });
      const data = await res.json();
      if (data.success) {
        toast(`Convenia sincronizado! ${data.total_lidos || 0} registros lidos`);
      } else {
        toast(`Erro: ${data.error}`, 'err');
      }
    } else {
      toast(`Sync ${nome} ainda não implementado via Edge Function`, 'warn');
    }
  } catch (e) {
    toast(`Erro: ${e.message}`, 'err');
  }

  btn.innerHTML = orig;
  btn.disabled = false;
  setTimeout(() => carregarDados(), 1000);
}

async function testarConector(nome) {
  const btn = document.getElementById(`btn-test-${nome}`);
  const orig = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> Testando...';
  btn.disabled = true;

  try {
    if (nome === 'convenia') {
      const jwt = RHAuth.getAuthToken();
      const res = await fetch(`${SB_URL}/functions/v1/integ-convenia-proxy`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${jwt}`, 'Content-Type': 'application/json', 'apikey': SB_KEY },
        body: JSON.stringify({ action: 'test' }),
      });
      const data = await res.json();
      toast(data.success ? `${capitalize(nome)}: Conexão OK ✅` : `${capitalize(nome)}: ${data.error}`, data.success ? 'ok' : 'err');
    } else {
      toast(`Teste ${nome} ainda não implementado`, 'warn');
    }
  } catch (e) {
    toast(`Erro: ${e.message}`, 'err');
  }

  btn.innerHTML = orig;
  btn.disabled = false;
  setTimeout(() => carregarConectores(), 500);
}

async function toggleSync(nome, habilitar) {
  try {
    const res = await API.patch(`integ_conector?nome=eq.${nome}`, { sync_habilitado: habilitar });
    if (!res.ok) throw new Error(res.error || 'Erro ao atualizar');
    toast(`${capitalize(nome)}: sync ${habilitar ? 'ativado' : 'pausado'}`);
    await carregarConectores();
  } catch (e) { toast(`Erro: ${e.message}`, 'err'); }
}

// ═══ HELPERS ═══
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
const esc = s => API.esc(s);

function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function timeAgo(iso) {
  if (!iso) return 'Nunca';
  const diff = (Date.now() - new Date(iso).getTime()) / 60000;
  if (diff < 1) return 'Agora';
  if (diff < 60) return `${Math.round(diff)}m`;
  if (diff < 1440) return `${Math.round(diff / 60)}h`;
  return `${Math.round(diff / 1440)}d`;
}

function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  const t = document.createElement('div');
  t.className = 'toast-msg';
  t.style.borderColor = type === 'err' ? 'var(--err)' : type === 'warn' ? 'var(--warn)' : 'var(--ok)';
  t.textContent = msg;
  el.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}
</script>
</body>
</html>
