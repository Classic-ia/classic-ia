<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic RH - Fluxo de Movimentacao</title>
<link rel="stylesheet" href="ds.css">
<script src="config.js"></script>
<script src="rh_auth.js"></script>
<script src="api.js"></script>
<script src="shell.js"></script>
</head>
<body class="page-bg">
<div id="shell"></div>
<div id="shell-content" class="content-area page-padding">

  <!-- Toolbar -->
  <div class="fluxo-toolbar">
    <div class="btn-group">
      <button class="btn-tab active" id="tabStatus" onclick="switchView('status')">Por Status</button>
      <button class="btn-tab" id="tabSetor" onclick="switchView('setor')">Por Setor</button>
    </div>
    <input type="text" class="fluxo-search" id="searchInput" placeholder="Buscar colaborador...">
    <div style="margin-left:auto;font-size:12px;color:var(--text-secondary);" id="totalCount"></div>
  </div>

  <!-- Kanban -->
  <div class="kanban" id="kanban"></div>

  <!-- Confirm Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">Confirmar movimentacao</div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" id="modalConfirm">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="fluxo-toast" id="toast"></div>

</div>

<script>
let allData = [];
let currentView = 'status';
let pendingMove = null;

const STATUS_COLS = [
  { id: 'experiencia', label: 'Experiencia', filter: f => f.em_experiencia || f.status === 'experiencia' },
  { id: 'ativo', label: 'Ativo', filter: f => f.status === 'ativo' && !f.em_experiencia },
  { id: 'ferias', label: 'Ferias', filter: f => f.status === 'ferias' },
  { id: 'afastado', label: 'Afastado', filter: f => f.status === 'afastado' },
  { id: 'desligado', label: 'Desligado', filter: f => f.status === 'desligado' },
];

(async () => {
  const user = await Shell.init({ page: 'fluxo_funcionarios', title: 'Fluxo de Movimentacao' });
  if (!user) return;
  API.setPerfil(user.perfil);

  await loadData();
  render();

  document.getElementById('searchInput').addEventListener('input', render);
})();

async function loadData() {
  const res = await API.get('vw_funcionario_base?select=id,nome,status,setor,setor_id,cargo,data_admissao,dias_empresa,em_experiencia&order=nome');
  allData = res.ok ? res.data : [];
  document.getElementById('totalCount').textContent = allData.length + ' colaboradores';
}

function switchView(view) {
  currentView = view;
  document.getElementById('tabStatus').classList.toggle('active', view === 'status');
  document.getElementById('tabSetor').classList.toggle('active', view === 'setor');
  render();
}

function render() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = q ? allData.filter(f => f.nome && f.nome.toLowerCase().includes(q)) : allData;
  const kanban = document.getElementById('kanban');

  if (currentView === 'status') {
    renderStatusView(filtered, kanban);
  } else {
    renderSetorView(filtered, kanban);
  }

  bindDragDrop();
}

function renderStatusView(data, container) {
  container.innerHTML = STATUS_COLS.map(col => {
    const items = data.filter(col.filter);
    return `<div class="kanban-col col-${col.id}" data-col="${col.id}">
      <div class="kanban-header">
        <div class="kanban-header-left"><span class="col-dot"></span>${col.label}</div>
        <span class="kanban-count">${items.length}</span>
      </div>
      <div class="kanban-body" data-drop="${col.id}">
        ${items.map(f => renderCard(f)).join('')}
        ${items.length === 0 ? '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:11px;">Nenhum</div>' : ''}
      </div>
    </div>`;
  }).join('');
}

function renderSetorView(data, container) {
  const ativos = data.filter(f => f.status !== 'desligado');
  const setores = {};
  ativos.forEach(f => {
    const s = f.setor || 'Sem Setor';
    if (!setores[s]) setores[s] = [];
    setores[s].push(f);
  });
  const sorted = Object.entries(setores).sort((a, b) => b[1].length - a[1].length);

  container.innerHTML = sorted.map(([setor, items]) => {
    const id = setor.replace(/\s+/g, '_').toLowerCase();
    return `<div class="kanban-col" data-col="${id}" data-setor="${setor}">
      <div class="kanban-header">
        <div class="kanban-header-left">${API.esc(setor)}</div>
        <span class="kanban-count">${items.length}</span>
      </div>
      <div class="kanban-body" data-drop="${id}" data-setor="${setor}">
        ${items.map(f => renderCard(f)).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderCard(f) {
  const dias = f.dias_empresa || 0;
  const tempo = dias < 30 ? dias + 'd' : dias < 365 ? Math.floor(dias/30) + 'm' : Math.floor(dias/365) + 'a';
  const badge = f.em_experiencia
    ? '<span class="k-card-badge" style="background:rgba(139,92,246,.12);color:#8b5cf6;">EXP</span>'
    : '';

  return `<div class="k-card" draggable="true" data-id="${f.id}" data-status="${f.status}" data-setor="${API.esc(f.setor || '')}">
    ${badge}
    <div class="k-card-name">${API.esc(f.nome)}</div>
    <div class="k-card-info">${API.esc(f.cargo || '--')} · ${API.esc(f.setor || '--')}<br>${tempo} · Adm: ${API.fmtData(f.data_admissao)}</div>
    <a class="k-card-link" href="ficha.html?id=${f.id}">Ver ficha</a>
  </div>`;
}

// ── DRAG & DROP ──
function bindDragDrop() {
  document.querySelectorAll('.k-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });

  document.querySelectorAll('.kanban-body').forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const func = allData.find(f => f.id === id);
      if (!func) return;

      if (currentView === 'status') {
        const newStatus = zone.dataset.drop;
        if (newStatus === func.status || (newStatus === 'experiencia' && func.em_experiencia)) return;
        confirmMove(func, 'status', newStatus);
      } else {
        const newSetor = zone.dataset.setor;
        if (!newSetor || newSetor === func.setor) return;
        confirmMove(func, 'setor', newSetor);
      }
    });
  });
}

// ── CONFIRM MODAL ──
function confirmMove(func, tipo, valor) {
  pendingMove = { func, tipo, valor };
  const modal = document.getElementById('modal');
  const desc = document.getElementById('modalDesc');

  if (tipo === 'status') {
    document.getElementById('modalTitle').textContent = 'Alterar Status';
    desc.innerHTML = `Mover <strong>${API.esc(func.nome)}</strong> de <strong>${API.esc(func.status)}</strong> para <strong>${API.esc(valor)}</strong>?`;
  } else {
    document.getElementById('modalTitle').textContent = 'Transferir Setor';
    desc.innerHTML = `Transferir <strong>${API.esc(func.nome)}</strong> de <strong>${API.esc(func.setor || 'Sem Setor')}</strong> para <strong>${API.esc(valor)}</strong>?`;
  }

  modal.classList.add('active');
  document.getElementById('modalConfirm').onclick = executeMove;
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  pendingMove = null;
}

async function executeMove() {
  if (!pendingMove) return;
  const { func, tipo, valor } = pendingMove;
  closeModal();

  try {
    if (tipo === 'status') {
      const res = await API.patch(`rh_funcionarios?id=eq.${func.id}`, { status: valor });
      if (!res.ok) { toast('Erro: ' + (res.error || 'Falha ao atualizar'), 'err'); return; }
      func.status = valor;
      if (valor !== 'experiencia') func.em_experiencia = false;
    } else {
      // Find setor_id
      const setorRes = await API.get(`rh_setores?nome=eq.${encodeURIComponent(valor)}&select=id&limit=1`);
      const setorId = setorRes.ok && setorRes.data[0] ? setorRes.data[0].id : null;
      const payload = setorId ? { setor_id: setorId } : {};
      const res = await API.patch(`rh_funcionarios?id=eq.${func.id}`, payload);
      if (!res.ok) { toast('Erro: ' + (res.error || 'Falha ao transferir'), 'err'); return; }
      func.setor = valor;
    }
    toast(`${func.nome} movido com sucesso`, 'ok');
    await loadData();
    render();
  } catch (err) {
    toast('Erro: ' + err.message, 'err');
  }
}

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'fluxo-toast show ' + type;
  setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
</body>
</html>
