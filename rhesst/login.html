<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Classic RH &amp; SST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="rh_auth.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: #07111c;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Sans', sans-serif;
  padding: 20px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(46,107,138,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(46,107,138,.06) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
.card {
  background: #0d1b2a;
  border: 1px solid #1e3a52;
  border-radius: 16px;
  padding: 40px 36px;
  width: 100%; max-width: 380px;
  position: relative;
  box-shadow: 0 24px 64px rgba(0,0,0,.5);
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 24px; right: 24px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #c8a96e, transparent);
  border-radius: 2px;
}
.logo-wrap { text-align: center; margin-bottom: 28px; }
.logo-icon {
  width: 64px; height: 64px; border-radius: 14px;
  background: linear-gradient(135deg, #1a3a52, #2E6B8A);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px; font-size: 32px;
}
.logo-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 22px;
  color: #c8a96e; letter-spacing: .02em;
}
.logo-sub { font-size: 12px; color: #5d7f95; margin-top: 3px; }
.field { margin-bottom: 16px; }
label {
  display: block; font-size: 11px; font-weight: 500;
  color: #5d7f95; text-transform: uppercase;
  letter-spacing: .08em; margin-bottom: 6px;
}
input {
  width: 100%; padding: 12px 14px;
  background: #0a1520; border: 1.5px solid #1e3a52;
  border-radius: 10px; color: #e8f0f5;
  font-size: 14px; font-family: 'DM Sans', sans-serif;
  transition: border-color .2s;
}
input:focus { outline: none; border-color: #c8a96e; }
input::placeholder { color: #3a5060; }
.btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #c8a96e, #b8934e);
  border: none; border-radius: 10px;
  color: #0a0a0a; font-weight: 700;
  font-size: 14px; cursor: pointer;
  font-family: 'Syne', sans-serif;
  letter-spacing: .03em;
  transition: all .2s;
  margin-top: 8px;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(200,169,110,.3); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.erro {
  display: none; margin-top: 14px;
  padding: 10px 14px; border-radius: 8px;
  background: rgba(231,76,60,.1); border: 1px solid rgba(231,76,60,.3);
  color: #e74c3c; font-size: 12px; text-align: center;
}
.versao {
  text-align: center; margin-top: 20px;
  font-size: 10px; color: #2a4050;
  font-family: 'DM Mono', monospace;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">&#128100;</div>
    <div class="logo-title">Classic RH &amp; SST</div>
    <div class="logo-sub">Gestao de RH e Seguranca do Trabalho</div>
  </div>

  <form id="form-login" onsubmit="doLogin(event)">
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="f-email" placeholder="seu@email.com" required autocomplete="email">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="f-senha" placeholder="********" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="btn-login">Entrar</button>
  </form>

  <div class="erro" id="erro"></div>
  <div class="versao">Classic RH &amp; SST v2026.03</div>
</div>

<script>
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const erro = document.getElementById('erro');
  erro.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Autenticando...';

  try {
    const email = document.getElementById('f-email').value.trim();
    const senha = document.getElementById('f-senha').value;
    await RHAuth.login(email, senha);
    window.location.href = 'app.html';
  } catch(err) {
    erro.textContent = err.message;
    erro.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
