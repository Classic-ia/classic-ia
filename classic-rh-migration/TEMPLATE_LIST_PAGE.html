<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic RH &amp; SST - __TITULO__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds.css">
<script src="config.js"></script>
<script src="rh_auth.js"></script>
<script src="api.js"></script>
<script src="shell.js"></script>
<script src="page_bootstrap.js"></script>
</head>
<body class="page-bg">

<div id="shell"></div>

<div id="shell-content" class="content-area page-padding">

  <!-- KPIs -->
  <div class="kpi-row mb-6" id="kpiRow">
    <div class="kpi-card">
      <div class="kpi-value" id="kpi-1"><span class="skeleton" style="width:48px;height:28px;display:inline-block;"></span></div>
      <div class="kpi-label">__KPI_1_LABEL__</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value" id="kpi-2"><span class="skeleton" style="width:48px;height:28px;display:inline-block;"></span></div>
      <div class="kpi-label">__KPI_2_LABEL__</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value" id="kpi-3"><span class="skeleton" style="width:48px;height:28px;display:inline-block;"></span></div>
      <div class="kpi-label">__KPI_3_LABEL__</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value" id="kpi-4"><span class="skeleton" style="width:48px;height:28px;display:inline-block;"></span></div>
      <div class="kpi-label">__KPI_4_LABEL__</div>
    </div>
  </div>

  <!-- Filtros + Acao -->
  <div class="card mb-6">
    <div class="card-header">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <input type="text" id="searchInput" placeholder="Buscar..." class="input" style="max-width:280px;">
        <select id="filterStatus" class="input" style="max-width:180px;">
          <option value="">Todos</option>
          <!-- opcoes dinamicas -->
        </select>
      </div>
      <div style="display:flex;gap:8px;" id="actionButtons">
        <!-- botoes de acao inseridos via JS conforme permissao -->
      </div>
    </div>
  </div>

  <!-- Tabela -->
  <div class="card">
    <div class="data-table-wrapper">
      <table class="data-table" id="mainTable">
        <thead>
          <tr id="tableHead">
            <!-- colunas inseridas via JS -->
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="99" class="table-empty"><div class="spinner" style="margin:0 auto;"></div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="table-footer" id="tableFooter" style="display:none;">
      <span id="tableCount">0 registros</span>
    </div>
  </div>

</div>

<!-- Modal (generico) -->
<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Titulo</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
/**
 * __PAGE_ID__ — __TITULO__
 * Baseado em: TEMPLATE_LIST_PAGE (ref: epis.html)
 *
 * Estrutura obrigatoria:
 *   initPage (via PageBootstrap)
 *   bindEvents
 *   loadData
 *   render
 *   handleError (via PageBootstrap)
 */

// Estado local
let _data = [];
let _filtered = [];
let _user = null;

// ==============================================================
// INIT (via PageBootstrap)
// ==============================================================
PageBootstrap.init({
  page: '__PAGE_ID__',
  title: '__TITULO__',
  perfisPermitidos: ['administrador', 'rh', 'gestor', 'visualizador'],

  bindEvents,
  loadData,
  render,
});

// ==============================================================
// BIND EVENTS
// ==============================================================
function bindEvents(user) {
  _user = user;

  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('filterStatus').addEventListener('change', applyFilters);

  // Botao de acao (condicional por permissao)
  if (API.canAccess('editar_funcionario')) {
    document.getElementById('actionButtons').innerHTML = `
      <button class="btn btn-primary btn-sm" id="btnNovo">+ Novo</button>
    `;
    document.getElementById('btnNovo')?.addEventListener('click', openNewModal);
  }

  // Modal
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
}

// ==============================================================
// LOAD DATA
// ==============================================================
async function loadData(user) {
  // SUBSTITUIR pelo endpoint real
  const res = await API.get('__ENDPOINT__?select=*&order=__ORDER_FIELD__');

  if (!res.ok) {
    console.warn('Erro ao carregar:', res.error);
    return { items: [], kpis: {} };
  }

  _data = res.data || [];

  // Calcular KPIs
  const kpis = {
    total: _data.length,
    // ADICIONAR kpis especificos
  };

  return { items: _data, kpis };
}

// ==============================================================
// RENDER
// ==============================================================
function render(result) {
  const { items, kpis } = result;

  // KPIs
  setKPI('kpi-1', kpis.total);
  // setKPI('kpi-2', kpis.xxx);
  // setKPI('kpi-3', kpis.yyy);
  // setKPI('kpi-4', kpis.zzz);

  // Colunas da tabela
  document.getElementById('tableHead').innerHTML = `
    <th>Nome</th>
    <th>Status</th>
    <th>Data</th>
    <th>Acoes</th>
  `;

  // Renderizar dados
  _filtered = items;
  renderTable(_filtered);
}

// ==============================================================
// RENDER TABLE
// ==============================================================
function renderTable(items) {
  const tbody = document.getElementById('tableBody');
  const footer = document.getElementById('tableFooter');

  if (!items || items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="99" class="table-empty">Nenhum registro encontrado</td></tr>';
    footer.style.display = 'none';
    return;
  }

  tbody.innerHTML = items.map(item => `
    <tr>
      <td class="font-medium">${API.esc(item.nome || item.descricao || '--')}</td>
      <td>${badgeStatus(item.status)}</td>
      <td>${API.fmtData(item.created_at)}</td>
      <td>
        <button class="btn btn-ghost btn-xs" onclick="viewItem('${item.id}')">Ver</button>
      </td>
    </tr>
  `).join('');

  footer.style.display = '';
  document.getElementById('tableCount').textContent = `${items.length} registro${items.length !== 1 ? 's' : ''}`;
}

// ==============================================================
// FILTROS
// ==============================================================
function applyFilters() {
  const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  const status = document.getElementById('filterStatus').value;

  _filtered = _data.filter(item => {
    const matchSearch = !search || JSON.stringify(item).toLowerCase().includes(search);
    const matchStatus = !status || item.status === status;
    return matchSearch && matchStatus;
  });

  renderTable(_filtered);
}

// ==============================================================
// MODAL
// ==============================================================
function openNewModal() {
  document.getElementById('modalTitle').textContent = 'Novo Registro';
  document.getElementById('modalBody').innerHTML = `
    <p style="color:var(--text-muted);">Formulario aqui...</p>
  `;
  document.getElementById('modalFooter').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" id="btnSalvar">Salvar</button>
  `;
  document.getElementById('modalOverlay').style.display = '';
}

function viewItem(id) {
  const item = _data.find(i => i.id === id);
  if (!item) return;

  document.getElementById('modalTitle').textContent = item.nome || item.descricao || 'Detalhes';
  document.getElementById('modalBody').innerHTML = `<pre style="font-size:12px;">${API.esc(JSON.stringify(item, null, 2))}</pre>`;
  document.getElementById('modalFooter').innerHTML = `<button class="btn btn-ghost" onclick="closeModal()">Fechar</button>`;
  document.getElementById('modalOverlay').style.display = '';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

// ==============================================================
// HELPERS
// ==============================================================
function setKPI(id, value) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = typeof value === 'number' ? API.fmtNum(value) : (value || '--');
}

function badgeStatus(status) {
  if (!status) return '<span class="badge badge-gray">--</span>';
  const map = {
    'ativo': 'success', 'vigente': 'success', 'ok': 'success', 'concluido': 'success',
    'pendente': 'warning', 'vencendo': 'warning',
    'vencido': 'danger', 'inativo': 'danger', 'cancelado': 'danger',
  };
  const cls = map[status.toLowerCase()] || 'gray';
  return `<span class="badge badge-${cls}">${API.esc(status)}</span>`;
}
</script>
</body>
</html>
