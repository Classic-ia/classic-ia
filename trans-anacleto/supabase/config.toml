# Projeto Supabase local — Trans Anacleto
# Gerado manualmente. `supabase init` pode reescrever valores.
#
# Uso:
#   cd /home/user/classic-ia/trans-anacleto
#   npx supabase start   # sobe Postgres + PostgREST + Auth + Studio via Docker
#   npx supabase status  # exibe URLs e anon_key (use em config.js)
#   npx supabase db reset  # re-aplica todas as migrations + seed

project_id = "trans-anacleto"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8080/trans-anacleto"
additional_redirect_urls = ["http://localhost:8080/trans-anacleto", "https://transanacleto.com.br"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
