<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Conformidade - Classic RH</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config_rh.js"></script>
<script src="rh_auth.js"></script>
<script src="rh_api.js"></script>
<script src="filial_context.js"></script>
<style>
:root{--bg:#f5f7fa;--surface:#fff;--border:#e5e7eb;--text:#1e293b;--muted:#64748b;--blue:#2563eb;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.header{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;}
.ht{font-weight:700;font-size:17px;}
.btn-back{margin-left:auto;padding:7px 14px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:none;transition:all .2s;}
.btn-back:hover{border-color:var(--blue);color:var(--text);}
.main{max-width:1400px;margin:0 auto;padding:24px;}

/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.kpi-val{font-size:28px;font-weight:700;line-height:1;}
.kpi-val.green{color:var(--green);} .kpi-val.yellow{color:var(--yellow);} .kpi-val.red{color:var(--red);} .kpi-val.blue{color:var(--blue);}
.kpi-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;}
.tab{padding:10px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit;transition:all .2s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;}
.tp{display:none;}.tp.active{display:block;}

/* Table */
.card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg);}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
tr:hover{background:rgba(37,99,235,.02);}
.badge{display:inline-flex;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;text-transform:uppercase;}
.b-green{background:rgba(34,197,94,.1);color:var(--green);}
.b-yellow{background:rgba(245,158,11,.1);color:var(--yellow);}
.b-red{background:rgba(239,68,68,.1);color:var(--red);}
.b-blue{background:rgba(37,99,235,.1);color:var(--blue);}
.b-gray{background:#f1f5f9;color:var(--muted);}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.toolbar input,.toolbar select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;}
.toolbar input{min-width:200px;}
.footer{padding:10px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);}
@media(max-width:768px){.main{padding:16px;} th,td{padding:8px 6px;font-size:11px;}}
</style>
</head>
<body>
<div class="header">
  <div class="ht">Painel de Conformidade SST</div>
  <div id="rh-user-chip"></div>
  <a href="home.html" class="btn-back">← Painel</a>
</div>
<div class="main">

<div class="kpi-row" id="kpis"></div>

<div class="tabs" id="tabBar">
  <button class="tab active" data-t="conformidade">Conformidade</button>
  <button class="tab" data-t="alertas">Alertas de Vencimento</button>
  <button class="tab" data-t="custo">Custo por Funcionário</button>
</div>

<!-- TAB CONFORMIDADE -->
<div class="tp active" id="tp-conformidade">
  <div class="toolbar">
    <input type="text" id="fConfBusca" placeholder="Buscar funcionário..." oninput="renderConformidade()">
    <select id="fConfStatus" onchange="renderConformidade()"><option value="">Todos</option><option value="vermelho">Vermelho</option><option value="amarelo">Amarelo</option><option value="verde">Verde</option></select>
  </div>
  <div class="card"><table><thead><tr><th>Funcionário</th><th>Setor</th><th>Status</th><th>ASO</th><th>Trein. OK</th><th>Trein. Vencidos</th><th>Última EPI</th><th>Risco</th></tr></thead><tbody id="tbConf"></tbody></table><div class="footer" id="ftConf"></div></div>
</div>

<!-- TAB ALERTAS -->
<div class="tp" id="tp-alertas">
  <div class="toolbar">
    <select id="fAlertDias" onchange="loadAlertas()"><option value="7">Próximos 7 dias</option><option value="15">Próximos 15 dias</option><option value="30" selected>Próximos 30 dias</option><option value="60">Próximos 60 dias</option><option value="90">Próximos 90 dias</option></select>
  </div>
  <div class="card"><table><thead><tr><th>Tipo</th><th>Funcionário</th><th>Setor</th><th>Descrição</th><th>Vencimento</th><th>Dias</th><th>Severidade</th></tr></thead><tbody id="tbAlert"></tbody></table><div class="footer" id="ftAlert"></div></div>
</div>

<!-- TAB CUSTO -->
<div class="tp" id="tp-custo">
  <div class="toolbar">
    <input type="text" id="fCustoBusca" placeholder="Buscar..." oninput="renderCusto()">
  </div>
  <div class="card"><table><thead><tr><th>Funcionário</th><th>Setor</th><th>Cargo</th><th style="text-align:right">Benefícios</th><th style="text-align:right">EPIs</th><th style="text-align:right">Ocorrências</th><th style="text-align:right">Registros Ponto</th></tr></thead><tbody id="tbCusto"></tbody></table><div class="footer" id="ftCusto"></div></div>
</div>

</div>

<script>
let confData=[], alertData=[], custoData=[];

document.getElementById('tabBar').addEventListener('click', e => {
  const btn = e.target.closest('.tab'); if (!btn) return;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tp').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tp-'+btn.dataset.t).classList.add('active');
});

function fmtD(d){if(!d)return'—';try{return new Date(d+'T00:00').toLocaleDateString('pt-BR');}catch{return d;}}

function renderKPIs(){
  const verde=confData.filter(c=>c.status_geral==='verde').length;
  const amarelo=confData.filter(c=>c.status_geral==='amarelo').length;
  const vermelho=confData.filter(c=>c.status_geral==='vermelho').length;
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="kpi-val blue">${confData.length}</div><div class="kpi-lbl">Total Ativos</div></div>
    <div class="kpi"><div class="kpi-val green">${verde}</div><div class="kpi-lbl">Conformes</div></div>
    <div class="kpi"><div class="kpi-val yellow">${amarelo}</div><div class="kpi-lbl">Atenção</div></div>
    <div class="kpi"><div class="kpi-val red">${vermelho}</div><div class="kpi-lbl">Irregulares</div></div>
    <div class="kpi"><div class="kpi-val red">${alertData.length}</div><div class="kpi-lbl">Alertas 30d</div></div>`;
}

function renderConformidade(){
  const busca=(document.getElementById('fConfBusca').value||'').toLowerCase();
  const st=document.getElementById('fConfStatus').value;
  let list=confData;
  if(busca)list=list.filter(c=>c.func_nome.toLowerCase().includes(busca));
  if(st)list=list.filter(c=>c.status_geral===st);
  const stBadge=s=>s==='verde'?'b-green':s==='amarelo'?'b-yellow':'b-red';
  const asoBadge=s=>s==='ok'?'b-green':s==='vencendo'?'b-yellow':s==='vencido'?'b-red':'b-gray';
  document.getElementById('tbConf').innerHTML=list.map(c=>`<tr>
    <td><strong>${c.func_nome}</strong></td><td>${c.func_setor}</td>
    <td><span class="badge ${stBadge(c.status_geral)}">${c.status_geral}</span></td>
    <td><span class="badge ${asoBadge(c.aso_status)}">${c.aso_status}</span> ${c.aso_validade?fmtD(c.aso_validade):''}</td>
    <td style="text-align:center">${c.trein_ok}</td>
    <td style="text-align:center">${c.trein_vencidos>0?'<span class="badge b-red">'+c.trein_vencidos+'</span>':'0'}</td>
    <td>${c.epi_ultima?fmtD(c.epi_ultima):'—'} <small style="color:var(--muted)">(${c.epi_total})</small></td>
    <td style="text-align:center"><strong>${c.pontos_risco}</strong></td>
  </tr>`).join('');
  document.getElementById('ftConf').textContent=list.length+' de '+confData.length+' funcionários';
}

function renderAlertas(){
  const sevBadge=s=>s==='critico'?'b-red':s==='alto'?'b-yellow':s==='medio'?'b-blue':'b-gray';
  document.getElementById('tbAlert').innerHTML=alertData.map(a=>`<tr>
    <td><span class="badge ${a.tipo==='ASO'?'b-blue':'b-yellow'}">${a.tipo}</span></td>
    <td><strong>${a.func_nome}</strong></td><td>${a.setor}</td><td>${a.descricao}</td>
    <td>${fmtD(a.dt_vencimento)}</td>
    <td style="text-align:center;font-weight:600;color:${a.dias_rest<0?'var(--red)':a.dias_rest<=7?'var(--yellow)':'var(--text)'}">${a.dias_rest}d</td>
    <td><span class="badge ${sevBadge(a.severidade)}">${a.severidade}</span></td>
  </tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--muted)">Nenhum alerta no período</td></tr>';
  document.getElementById('ftAlert').textContent=alertData.length+' alertas';
}

function renderCusto(){
  const busca=(document.getElementById('fCustoBusca').value||'').toLowerCase();
  let list=custoData;
  if(busca)list=list.filter(c=>c.nome.toLowerCase().includes(busca)||c.setor.toLowerCase().includes(busca));
  document.getElementById('tbCusto').innerHTML=list.map(c=>`<tr>
    <td><strong>${c.nome}</strong></td><td>${c.setor}</td><td>${c.cargo}</td>
    <td style="text-align:right">${c.total_beneficios}</td>
    <td style="text-align:right">${c.total_epis}</td>
    <td style="text-align:right">${c.total_ocorrencias}</td>
    <td style="text-align:right">${c.total_ponto}</td>
  </tr>`).join('');
  document.getElementById('ftCusto').textContent=list.length+' funcionários';
}

async function loadAlertas(){
  const dias=document.getElementById('fAlertDias').value;
  const fr=typeof FilialContext!=='undefined'?FilialContext.filtroRPC():{};
  const res=await RH_API.fetch('rpc/alertas_vencimento',{method:'POST',body:{p_dias:parseInt(dias),...fr}});
  alertData=await res.json().catch(()=>[]);
  if(!Array.isArray(alertData))alertData=[];
  renderAlertas();
  renderKPIs();
}

(async()=>{
  const user=await RHAuth.init();if(!user)return;
  const fr=typeof FilialContext!=='undefined'?FilialContext.filtroRPC():{};

  const [rConf,rAlert,rCusto]=await Promise.all([
    RH_API.fetch('rpc/painel_conformidade',{method:'POST',body:fr}),
    RH_API.fetch('rpc/alertas_vencimento',{method:'POST',body:{p_dias:30,...fr}}),
    RH_API.fetch('rpc/custo_por_funcionario',{method:'POST',body:fr})
  ]);

  confData=await rConf.json().catch(()=>[]);if(!Array.isArray(confData))confData=[];
  alertData=await rAlert.json().catch(()=>[]);if(!Array.isArray(alertData))alertData=[];
  custoData=await rCusto.json().catch(()=>[]);if(!Array.isArray(custoData))custoData=[];

  renderKPIs();renderConformidade();renderAlertas();renderCusto();
})();
</script>
</body>
</html>
