<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benefícios - Classic RH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds.css">
<script src="config_rh.js"></script>
<script src="rh_auth.js"></script>
<script src="api.js"></script>
<script src="shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
.summary-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;}
.summary-card .val{font-size:24px;font-weight:800;color:var(--primary);line-height:1;}
.summary-card .lbl{font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em;margin-top:6px;}
.filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.badge-tipo{display:inline-flex;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;}
.badge-va{background:rgba(34,197,94,.12);color:#22c55e;}
.badge-vt{background:rgba(37,99,235,.12);color:#2563eb;}
.badge-pa{background:rgba(155,89,182,.12);color:#9b59b6;}
.badge-as{background:rgba(245,158,11,.12);color:#f59e0b;}
.badge-other{background:#f1f5f9;color:#64748b;}
.pedido-header{padding:12px 16px;background:var(--bg-page);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.pedido-header:hover{border-color:var(--primary);}
.pedido-header .ped-title{font-weight:700;font-size:13px;}
.pedido-header .ped-info{font-size:12px;color:var(--text-secondary);}
.pedido-header .ped-total{font-weight:800;font-size:15px;color:var(--primary);}
.pedido-detail{display:none;margin-bottom:16px;}
.pedido-detail.open{display:block;}
.sortable{cursor:pointer;user-select:none;position:relative;padding-right:16px!important;}
.sortable:hover{color:var(--primary);}
.sortable::after{content:'⇅';position:absolute;right:2px;opacity:.3;font-size:9px;}
.sortable.asc::after{content:'▲';opacity:.8;}
.sortable.desc::after{content:'▼';opacity:.8;}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
@media(max-width:900px){.charts-row{grid-template-columns:1fr;}}
.chart-box{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;}
.chart-box h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:12px;}
.chart-wrap{position:relative;height:260px;}
.insight-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px;}
.insight-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.insight-card .val{font-size:20px;font-weight:800;line-height:1;color:var(--primary);}
.insight-card .lbl{font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}
.insight-card .sub{font-size:11px;color:var(--text-secondary);margin-top:4px;}
.var-up{color:#22c55e;font-weight:700;} .var-down{color:#ef4444;font-weight:700;} .var-flat{color:var(--text-secondary);}
.top-list{list-style:none;padding:0;margin:0;}
.top-list li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px;}
.top-list li:last-child{border:none;}
.top-list .name{font-weight:600;} .top-list .amount{font-weight:700;color:var(--primary);}
</style>
</head>
<body class="page-bg">
<div id="shell"></div>
<div id="shell-content" class="content-area page-padding">

  <div class="summary-grid" id="kpis"></div>

  <!-- Insights row: custo médio, cobertura, comparativo -->
  <div class="insight-row" id="insights"></div>

  <!-- Charts -->
  <div class="charts-row">
    <div class="chart-box">
      <h4>Evolução Mensal de Benefícios</h4>
      <div class="chart-wrap"><canvas id="chartEvolucao"></canvas></div>
    </div>
    <div class="chart-box">
      <h4>Distribuição por Tipo</h4>
      <div class="chart-wrap"><canvas id="chartTipos"></canvas></div>
    </div>
  </div>

  <div class="charts-row">
    <div class="chart-box">
      <h4>Custo por Setor</h4>
      <div class="chart-wrap"><canvas id="chartSetores"></canvas></div>
    </div>
    <div class="chart-box">
      <h4>Top 10 Beneficiários</h4>
      <ol class="top-list" id="topBeneficiarios"></ol>
    </div>
  </div>

  <div class="filter-row">
    <input type="text" id="searchBenef" placeholder="Buscar funcionário..." oninput="renderBeneficios()" style="flex:1;min-width:200px;">
    <select id="filterTipo" onchange="renderBeneficios()">
      <option value="">Todos os tipos</option>
      <option value="vale_alimentacao">Vale Alimentação</option>
      <option value="vale_transporte">Vale Transporte</option>
      <option value="plano_alianca">Plano Aliança</option>
      <option value="assiduidade">Assiduidade</option>
      <option value="ajuda_custo">Ajuda de Custo</option>
    </select>
    <select id="filterPeriodo" onchange="onPeriodoChange()">
      <option value="mes_atual">Mês Atual</option>
      <option value="mes_anterior">Mês Anterior</option>
      <option value="trimestre">Último Trimestre</option>
      <option value="ano">Ano 2026</option>
      <option value="custom">Período Personalizado</option>
      <option value="todos">Todos</option>
    </select>
    <input type="month" id="filterDe" style="display:none" onchange="renderBeneficios()">
    <span id="filterAteLbl" style="display:none;font-size:12px;color:var(--text-secondary)">até</span>
    <input type="month" id="filterAte" style="display:none" onchange="renderBeneficios()">
  </div>

  <div class="card">
    <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
      <h3>Benefícios por Pedido</h3>
      <span id="countBenef" style="font-size:12px;color:var(--text-secondary)"></span>
    </div>
    <div class="card-body" id="pedidosContainer">
      <div style="text-align:center;padding:40px"><span class="spinner"></span></div>
    </div>
  </div>

  <div class="card mt-4" id="tbBenef-wrap">
    <div class="card-header"><h3>Todos os Benefícios</h3></div>
    <div class="card-body">
      <div class="data-table-wrapper">
        <table class="data-table">
          <thead><tr>
            <th class="sortable" onclick="sortBenef('func')">Funcionário</th><th class="sortable" onclick="sortBenef('tipo')">Tipo</th><th class="sortable" onclick="sortBenef('data')">Data</th><th class="sortable" style="text-align:right" onclick="sortBenef('valor')">Valor</th><th class="sortable" onclick="sortBenef('pedido')">Pedido</th><th class="sortable" onclick="sortBenef('status')">Status</th>
          </tr></thead>
          <tbody id="tbBenef"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
<script>
let beneficios = [], funcionarios = {}, funcSetores = {}, totalFuncAtivos = 0;

const TIPO_LABELS = {
  vale_alimentacao: 'Vale Alimentação',
  vale_transporte: 'Vale Transporte',
  plano_alianca: 'Plano Aliança',
  assiduidade: 'Assiduidade',
  ajuda_custo: 'Ajuda de Custo',
  ordem_servico: 'Ordem de Serviço',
  acordo_compensacao: 'Acordo Compensação'
};
const TIPO_BADGE = {
  vale_alimentacao: 'badge-va', vale_transporte: 'badge-vt',
  plano_alianca: 'badge-pa', assiduidade: 'badge-as'
};

function fmtBRL(v) { return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2}); }
function fmtData(d) { if(!d) return '—'; return new Date(d+'T12:00').toLocaleDateString('pt-BR'); }
function nomeFunc(id) { return funcionarios[id] || '—'; }

function renderKPIs(lista) {
  if (!lista) lista = beneficios;
  const total = lista.reduce((s,b) => s + Number(b.valor||0), 0);
  const tipos = {};
  lista.forEach(b => { tipos[b.tipo] = (tipos[b.tipo]||0) + Number(b.valor||0); });
  const funcsUnicos = new Set(lista.map(b=>b.funcionario_id)).size;
  const pedidos = new Set(lista.map(b=>b.documento_ref).filter(Boolean)).size;

  document.getElementById('kpis').innerHTML = `
    <div class="summary-card"><div class="val">${fmtBRL(total)}</div><div class="lbl">Total Benefícios</div></div>
    <div class="summary-card"><div class="val">${beneficios.length}</div><div class="lbl">Registros</div></div>
    <div class="summary-card"><div class="val">${funcsUnicos}</div><div class="lbl">Beneficiários</div></div>
    <div class="summary-card"><div class="val">${pedidos}</div><div class="lbl">Pedidos</div></div>
    ${Object.entries(tipos).map(([t,v]) => `<div class="summary-card"><div class="val">${fmtBRL(v)}</div><div class="lbl">${TIPO_LABELS[t]||t}</div></div>`).join('')}
  `;
  renderInsights(lista);
  renderCharts(lista);
}

let charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); charts[id] = null; } }
const COLORS = ['#2563EB','#22c55e','#f59e0b','#ef4444','#9b59b6','#0EA5E9','#EC4899','#14B8A6'];

function renderInsights(lista) {
  const total = lista.reduce((s,b) => s + Number(b.valor||0), 0);
  const funcsUnicos = new Set(lista.map(b=>b.funcionario_id)).size;
  const custoMedio = funcsUnicos > 0 ? total / funcsUnicos : 0;

  // Cobertura: beneficiários únicos no período / total funcionários ativos
  const totalAtivos = totalFuncAtivos;
  const cobertura = totalAtivos > 0 ? Math.round(funcsUnicos / totalAtivos * 100) : 0;

  // Comparativo com mês anterior
  const range = getPeriodoRange();
  let varHtml = '';
  if (range.de && range.de === range.ate) {
    // Single month — compare with previous
    const [y,m] = range.de.split('-').map(Number);
    const prev = new Date(y, m-2, 1);
    const prevKey = `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}`;
    const totalAnt = beneficios.filter(b => (b.data_inicio||'').slice(0,7) === prevKey).reduce((s,b) => s + Number(b.valor||0), 0);
    if (totalAnt > 0) {
      const pct = ((total - totalAnt) / totalAnt * 100).toFixed(1);
      const cls = pct > 0 ? 'var-up' : pct < 0 ? 'var-down' : 'var-flat';
      const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '▬';
      varHtml = `<div class="insight-card"><div class="val"><span class="${cls}">${arrow} ${pct > 0 ? '+' : ''}${pct}%</span></div><div class="lbl">vs Mês Anterior</div><div class="sub">Anterior: ${fmtBRL(totalAnt)}</div></div>`;
    }
  }

  // Custo benefícios / folha
  let custoFolhaHtml = '';

  document.getElementById('insights').innerHTML = `
    <div class="insight-card"><div class="val">${fmtBRL(custoMedio)}</div><div class="lbl">Custo Médio / Pessoa</div></div>
    <div class="insight-card"><div class="val">${cobertura}%</div><div class="lbl">Cobertura</div><div class="sub">${funcsUnicos} de ${totalAtivos} ativos</div></div>
    ${varHtml}
    ${custoFolhaHtml}
  `;
}

function renderCharts(lista) {
  // 1. Evolução mensal (usando TODOS os dados, não filtrados)
  const mensal = {};
  beneficios.forEach(b => {
    const mes = (b.data_inicio||'').slice(0,7);
    if (!mes) return;
    if (!mensal[mes]) mensal[mes] = {};
    mensal[mes][b.tipo] = (mensal[mes][b.tipo]||0) + Number(b.valor||0);
  });
  const meses = Object.keys(mensal).sort();
  const tiposUnicos = [...new Set(beneficios.map(b=>b.tipo))];

  destroyChart('chartEvolucao');
  if (meses.length > 0) {
    charts['chartEvolucao'] = new Chart(document.getElementById('chartEvolucao'), {
      type: 'bar',
      data: {
        labels: meses.map(m => { const d = new Date(m+'-15'); return d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}); }),
        datasets: tiposUnicos.map((t,i) => ({
          label: TIPO_LABELS[t]||t,
          data: meses.map(m => mensal[m][t]||0),
          backgroundColor: COLORS[i % COLORS.length],
          borderRadius: 3
        }))
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } }, scales: { x: { stacked: true }, y: { stacked: true, ticks: { callback: v => 'R$ ' + (v/1000).toFixed(0) + 'k' } } } }
    });
  }

  // 2. Distribuição por tipo (período selecionado)
  const tiposTotais = {};
  lista.forEach(b => { tiposTotais[b.tipo] = (tiposTotais[b.tipo]||0) + Number(b.valor||0); });
  const tipoEntries = Object.entries(tiposTotais).sort((a,b) => b[1]-a[1]);

  destroyChart('chartTipos');
  if (tipoEntries.length > 0) {
    charts['chartTipos'] = new Chart(document.getElementById('chartTipos'), {
      type: 'doughnut',
      data: {
        labels: tipoEntries.map(([t]) => TIPO_LABELS[t]||t),
        datasets: [{ data: tipoEntries.map(([,v]) => v), backgroundColor: COLORS.slice(0, tipoEntries.length) }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { size: 11 } } } } }
    });
  }

  // 3. Custo por setor (precisa cruzar com funcionarios/setores)
  // Usamos dados do período selecionado
  const porSetor = {};
  lista.forEach(b => {
    const nome = funcionarios[b.funcionario_id] || '—';
    // We don't have setor in beneficio data, but we can group by first letter or use a lookup
    // For now, group by tipo instead — setor needs a join we don't have client-side
  });

  // 4. Top 10 beneficiários
  const porFunc = {};
  lista.forEach(b => {
    const fid = b.funcionario_id;
    if (!porFunc[fid]) porFunc[fid] = { nome: nomeFunc(fid), total: 0, id: fid };
    porFunc[fid].total += Number(b.valor||0);
  });
  const top10 = Object.values(porFunc).sort((a,b) => b.total - a.total).slice(0, 10);

  document.getElementById('topBeneficiarios').innerHTML = top10.map((f,i) => `
    <li>
      <span><span style="color:var(--text-secondary);font-size:11px;margin-right:6px">${i+1}.</span><a href="ficha_360.html?id=${f.id}" class="name" style="color:var(--text-primary);text-decoration:none;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-primary)'">${f.nome}</a></span>
      <span class="amount">${fmtBRL(f.total)}</span>
    </li>
  `).join('') || '<li style="color:var(--text-secondary)">Nenhum dado no período</li>';

  // Setor chart — use funcSetores lookup if available
  destroyChart('chartSetores');
  if (typeof funcSetores === 'object' && Object.keys(funcSetores).length > 0) {
    const setorTotais = {};
    lista.forEach(b => {
      const setor = funcSetores[b.funcionario_id] || 'Sem setor';
      setorTotais[setor] = (setorTotais[setor]||0) + Number(b.valor||0);
    });
    const setorEntries = Object.entries(setorTotais).sort((a,b) => b[1]-a[1]).slice(0,10);
    charts['chartSetores'] = new Chart(document.getElementById('chartSetores'), {
      type: 'bar',
      data: {
        labels: setorEntries.map(([s]) => s.length > 18 ? s.slice(0,18)+'...' : s),
        datasets: [{ label: 'Custo Benefícios', data: setorEntries.map(([,v]) => v), backgroundColor: 'rgba(37,99,235,0.7)', borderRadius: 3 }]
      },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { callback: v => 'R$ ' + (v/1000).toFixed(0) + 'k' } } } }
    });
  }
}

let _bSortCol = 'func', _bSortDir = 'asc';
function sortBenef(col) {
  if (_bSortCol === col) { _bSortDir = _bSortDir === 'asc' ? 'desc' : 'asc'; }
  else { _bSortCol = col; _bSortDir = 'asc'; }
  document.querySelectorAll('#tbBenef-wrap .sortable').forEach(th => th.classList.remove('asc','desc'));
  event.target.closest('th').classList.add(_bSortDir);
  renderBeneficios();
}

function sortedList(lista) {
  const dir = _bSortDir === 'asc' ? 1 : -1;
  return [...lista].sort((a, b) => {
    let va, vb;
    if (_bSortCol === 'func') { va = nomeFunc(a.funcionario_id); vb = nomeFunc(b.funcionario_id); }
    else if (_bSortCol === 'tipo') { va = a.tipo||''; vb = b.tipo||''; }
    else if (_bSortCol === 'data') { va = a.data_inicio||''; vb = b.data_inicio||''; }
    else if (_bSortCol === 'valor') { return (Number(a.valor||0) - Number(b.valor||0)) * dir; }
    else if (_bSortCol === 'pedido') { va = a.documento_ref||''; vb = b.documento_ref||''; }
    else if (_bSortCol === 'status') { va = a.status||''; vb = b.status||''; }
    else { va = ''; vb = ''; }
    return String(va).localeCompare(String(vb)) * dir;
  });
}

function getPeriodoRange() {
  const sel = document.getElementById('filterPeriodo').value;
  const hoje = new Date();
  const y = hoje.getFullYear(), m = hoje.getMonth();
  if (sel === 'mes_atual') return { de: `${y}-${String(m+1).padStart(2,'0')}`, ate: `${y}-${String(m+1).padStart(2,'0')}` };
  if (sel === 'mes_anterior') { const d = new Date(y, m-1, 1); return { de: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, ate: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` }; }
  if (sel === 'trimestre') { const d = new Date(y, m-2, 1); return { de: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, ate: `${y}-${String(m+1).padStart(2,'0')}` }; }
  if (sel === 'ano') return { de: `${y}-01`, ate: `${y}-12` };
  if (sel === 'custom') return { de: document.getElementById('filterDe').value, ate: document.getElementById('filterAte').value };
  return { de: '', ate: '' }; // todos
}

function onPeriodoChange() {
  const sel = document.getElementById('filterPeriodo').value;
  const show = sel === 'custom';
  document.getElementById('filterDe').style.display = show ? '' : 'none';
  document.getElementById('filterAte').style.display = show ? '' : 'none';
  document.getElementById('filterAteLbl').style.display = show ? '' : 'none';
  renderBeneficios();
}

function renderBeneficios() {
  const busca = (document.getElementById('searchBenef').value||'').toLowerCase();
  const tipo = document.getElementById('filterTipo').value;
  const range = getPeriodoRange();

  let lista = beneficios;
  if (busca) lista = lista.filter(b => nomeFunc(b.funcionario_id).toLowerCase().includes(busca));
  if (tipo) lista = lista.filter(b => b.tipo === tipo);
  if (range.de) lista = lista.filter(b => (b.data_inicio||'').slice(0,7) >= range.de);
  if (range.ate) lista = lista.filter(b => (b.data_inicio||'').slice(0,7) <= range.ate);

  renderKPIs(lista);

  // Group by pedido
  const pedidos = {};
  lista.forEach(b => {
    const key = b.documento_ref || 'sem_pedido';
    if (!pedidos[key]) pedidos[key] = { ref: key, items: [], total: 0, data: b.data_inicio };
    pedidos[key].items.push(b);
    pedidos[key].total += Number(b.valor||0);
  });

  const pedList = Object.values(pedidos).sort((a,b) => (b.data||'').localeCompare(a.data||''));

  const container = document.getElementById('pedidosContainer');
  container.innerHTML = pedList.map(p => `
    <div class="pedido-header" onclick="this.nextElementSibling.classList.toggle('open')">
      <div>
        <div class="ped-title">Pedido ${p.ref}</div>
        <div class="ped-info">${fmtData(p.data)} — ${p.items.length} beneficiários</div>
      </div>
      <div class="ped-total">${fmtBRL(p.total)}</div>
    </div>
    <div class="pedido-detail">
      <table class="data-table" style="font-size:12px;margin-bottom:16px">
        <thead><tr><th>Funcionário</th><th>Tipo</th><th style="text-align:right">Valor</th></tr></thead>
        <tbody>${p.items.sort((a,b) => nomeFunc(a.funcionario_id).localeCompare(nomeFunc(b.funcionario_id))).map(b => `
          <tr>
            <td><a href="ficha_360.html?id=${b.funcionario_id}" style="color:var(--text-primary);text-decoration:none;font-weight:600;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-primary)'">${nomeFunc(b.funcionario_id)}</a></td>
            <td><span class="badge-tipo ${TIPO_BADGE[b.tipo]||'badge-other'}">${TIPO_LABELS[b.tipo]||b.tipo}</span></td>
            <td style="text-align:right;font-weight:600">${fmtBRL(b.valor)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `).join('') || '<div style="text-align:center;padding:40px;color:var(--text-secondary)">Nenhum benefício encontrado</div>';

  document.getElementById('countBenef').textContent = `${lista.length} registros em ${pedList.length} pedidos`;

  // Table view (sorted by selected column, default A-Z by name)
  const sorted = sortedList(lista);
  document.getElementById('tbBenef').innerHTML = sorted.slice(0, 500).map(b => `<tr>
    <td><a href="ficha_360.html?id=${b.funcionario_id}" style="color:var(--text-primary);text-decoration:none;font-weight:600;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-primary)'">${nomeFunc(b.funcionario_id)}</a></td>
    <td><span class="badge-tipo ${TIPO_BADGE[b.tipo]||'badge-other'}">${TIPO_LABELS[b.tipo]||b.tipo}</span></td>
    <td>${fmtData(b.data_inicio)}</td>
    <td style="text-align:right;font-weight:600">${fmtBRL(b.valor)}</td>
    <td style="font-family:monospace;font-size:11px;color:var(--text-secondary)">${b.documento_ref||'—'}</td>
    <td><span class="badge ${b.status==='ativo'?'badge-green':'badge-muted'}">${b.status||'—'}</span></td>
  </tr>`).join('');
}

(async () => {
  const user = await Shell.init({ page: 'beneficios', title: 'Benefícios' });
  if (!user) return;

  // Load data — paginated to bypass PostgREST max-rows limit
  async function fetchAll(endpoint) {
    let all = [], offset = 0, pageSize = 1000;
    while (true) {
      const res = await API.get(endpoint + (endpoint.includes('?') ? '&' : '?') + 'limit=' + pageSize + '&offset=' + offset);
      const data = (res.ok && res.data) ? res.data : [];
      all = all.concat(data);
      if (data.length < pageSize) break;
      offset += pageSize;
    }
    return all;
  }

  const [benefData, funcList, setoresList] = await Promise.all([
    fetchAll('rh_beneficio?select=id,funcionario_id,tipo,status,data_inicio,valor,documento_ref&order=data_inicio.desc'),
    fetchAll('rh_funcionarios?select=id,nome_completo,setor_id,status'),
    fetchAll('rh_setores?select=id,nome')
  ]);

  beneficios = benefData;
  const setoresMap = {};
  setoresList.forEach(s => { setoresMap[s.id] = s.nome; });
  totalFuncAtivos = 0;
  funcList.forEach(f => {
    funcionarios[f.id] = f.nome_completo;
    funcSetores[f.id] = setoresMap[f.setor_id] || 'Sem setor';
    if (f.status === 'ativo' || f.status === 'afastado' || f.status === 'ferias') totalFuncAtivos++;
  });

  // Remove old month filter if exists (replaced by period selector)
  const meses = [...new Set(beneficios.map(b => (b.data_inicio||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const selMes = document.getElementById('filterMes');
  if (selMes) meses.forEach(m => {
    const d = new Date(m + '-15');
    selMes.add(new Option(d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'}), m));
  });

  renderBeneficios();
})();
</script>
</body>
