<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · JA-IOS</title>
    <meta name="description" content="Sistema Operacional Industrial — J.A. Agroindustrial (graxaria SIF)." />
    <link rel="stylesheet" href="css/base.css" />
  </head>
  <body>
    <!--
      BLOCO 002 — Dashboard shell (Sprint 0.2)
      Página pós-login com navegação lateral. O conteúdo de #view é
      renderizado pelo router (js/dashboard.js) conforme o hash da URL.
      Guardião de acesso: auth.exigirAuth() (redireciona p/ index.html se sem sessão).
    -->
    <div class="app-shell" id="shell">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="sidebar-brand-logo">JA</div>
          <div class="sidebar-brand-txt">
            <strong>JA-IOS</strong>
            <span>J.A. Agroindustrial</span>
          </div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav" aria-label="Navegação principal">
          <!-- itens montados por js/dashboard.js (gated por perfil) -->
        </nav>
        <div class="sidebar-footer" id="sidebarFooter">
          <!-- usuário + logout montados por js/dashboard.js -->
        </div>
      </aside>

      <!-- Conteúdo -->
      <div class="main">
        <header class="topbar">
          <div style="display: flex; align-items: center; gap: 12px">
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" /></svg>
            </button>
            <div>
              <div class="topbar-title" id="topbarTitle">Dashboard</div>
              <div class="topbar-breadcrumb">Planta Jardim Alegre · JA-01</div>
            </div>
          </div>
        </header>

        <main class="view" id="view">
          <!-- renderizado pelo router -->
        </main>
      </div>

      <!-- Overlay do menu mobile -->
      <div class="sidebar-overlay" id="sidebarOverlay"></div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
  </body>
</html>
