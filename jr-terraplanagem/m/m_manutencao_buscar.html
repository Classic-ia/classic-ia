<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#D97706">
<title>Manutencao - JR Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<script src="../auth.js"></script>
<script src="../api.js"></script>
<script src="m_shell.js"></script>
<script src="m_scan.js"></script>
</head>
<body>
<main id="m-main">
  <div class="m-card">
    <h3>Buscar Maquina</h3>
    <button class="m-btn-primary" onclick="abrirCamera()" style="margin-bottom:10px;">
      &#128247; Ler QR da Maquina
    </button>
    <div class="m-field">
      <label>Ou escolha manualmente</label>
      <select id="maq" onchange="onMaqChange()">
        <option value="">Selecione...</option>
      </select>
    </div>
  </div>

  <div id="info-maq" style="display:none">
    <div class="m-card">
      <h3 id="maq-titulo">—</h3>
      <div class="m-info-label">Horimetro atual</div>
      <div class="m-info-value" id="horimetro">—</div>
      <div style="margin-top:12px;">
        <a class="m-btn-primary" id="btn-nova" style="text-align:center; text-decoration:none;">+ Nova Manutencao</a>
      </div>
    </div>

    <div class="m-card">
      <h3>Manutencoes abertas</h3>
      <div id="lista-abertas"></div>
    </div>
  </div>
</main>
<script>
let maquinas = [];

(async () => {
  const user = await MShell.init();
  if (!user) return;
  MShell.mount({ title: 'Manutencao', back: 'm_home.html', active: 'manut' });

  const r = await API.get('jr_maquinas?select=id,codigo,descricao,horimetro_atual&status=neq.vendida&order=codigo');
  maquinas = r.ok ? r.data : [];

  document.getElementById('maq').innerHTML = '<option value="">Selecione...</option>' +
    maquinas.map(x => `<option value="${x.id}">${esc(x.codigo)} - ${esc(x.descricao)}</option>`).join('');
})();

function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function abrirCamera() {
  MScan.openCamera({
    title: 'Aponte para o QR da maquina',
    onDetect: (codigo) => {
      const maq = maquinas.find(m => m.codigo === codigo || m.id === codigo);
      if (!maq) return MShell.toast('Maquina nao encontrada: ' + codigo, 'err');
      document.getElementById('maq').value = maq.id;
      onMaqChange();
    }
  });
}

async function onMaqChange() {
  const id = document.getElementById('maq').value;
  if (!id) { document.getElementById('info-maq').style.display = 'none'; return; }
  const maq = maquinas.find(m => m.id === id);
  document.getElementById('maq-titulo').textContent = `${maq.codigo} - ${maq.descricao}`;
  document.getElementById('horimetro').textContent = Number(maq.horimetro_atual || 0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + 'h';
  document.getElementById('btn-nova').href = 'm_manutencao_abrir.html?maq=' + id;
  document.getElementById('info-maq').style.display = '';

  const r = await API.get(`jr_manutencoes?select=id,tipo,servico,status,data_abertura,horimetro_execucao&maquina_id=eq.${id}&status=in.(aberta,em_andamento)&order=data_abertura.desc`);
  const abertas = r.ok ? r.data : [];

  if (!abertas.length) {
    document.getElementById('lista-abertas').innerHTML = '<div class="m-empty">Nenhuma manutencao em aberto.</div>';
    return;
  }

  document.getElementById('lista-abertas').innerHTML = abertas.map(m => {
    const pill = m.status === 'aberta' ? '<span class="m-pill m-pill-aberta">Aberta</span>' : '<span class="m-pill m-pill-andamento">Em andamento</span>';
    const data = new Date(m.data_abertura + 'T00:00').toLocaleDateString('pt-BR');
    return `<a href="m_manutencao_itens.html?id=${m.id}" style="display:block; text-decoration:none; color:inherit; border-top:1px solid #F1F5F9; padding:12px 0;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-weight:700; font-size:14px;">${esc(m.servico)}</div>
          <div style="font-size:12px; color:#64748B; margin-top:2px;">${esc(m.tipo)} &middot; ${data} &middot; ${Number(m.horimetro_execucao || 0).toFixed(1)}h</div>
        </div>
        ${pill}
      </div>
    </a>`;
  }).join('');
}
</script>
</body>
</html>
