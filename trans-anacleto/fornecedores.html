<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fornecedores - Trans Anacleto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds.css">
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="ui_components.js"></script>
<script src="shell.js"></script>
<script src="page_bootstrap.js"></script>
</head>
<body class="page-bg">
<div id="shell"></div>
<div id="shell-content" class="content-area page-padding">
  <div id="header-area"></div>
  <div id="filters-area"></div>
  <div class="card"><div class="card-body" id="table-area"><div class="loading-center"><div class="spinner"></div></div></div></div>
</div>

<div id="modal-f" class="modal" style="display:none">
  <div class="modal-overlay" onclick="closeFModal()"></div>
  <div class="modal-content" style="max-width:700px">
    <div class="modal-header">
      <h3 id="modal-title">Novo fornecedor</h3>
      <button class="modal-close" onclick="closeFModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="form-f" onsubmit="saveF(event)">
        <input type="hidden" id="f-id">
        <div class="form-grid" style="grid-template-columns:repeat(2,1fr)">
          <div class="form-field form-field-full"><label>Razao social *</label><input type="text" id="f-razao" required></div>
          <div class="form-field"><label>Nome fantasia</label><input type="text" id="f-fantasia"></div>
          <div class="form-field"><label>CNPJ</label><input type="text" id="f-cnpj" maxlength="18"></div>
          <div class="form-field"><label>Tipo *</label>
            <select id="f-tipo" required>
              <option value="peca">Peca</option>
              <option value="pneu">Pneu</option>
              <option value="recapadora">Recapadora</option>
              <option value="posto">Posto de combustivel</option>
              <option value="oficina">Oficina</option>
              <option value="outro">Outro</option>
            </select>
          </div>
          <div class="form-field"><label>Ativo</label>
            <select id="f-ativo"><option value="true">Sim</option><option value="false">Nao</option></select>
          </div>
          <div class="form-field form-field-full"><label>Contato</label><input type="text" id="f-contato"></div>
          <div class="form-field"><label>Telefone</label><input type="text" id="f-telefone"></div>
          <div class="form-field"><label>Email</label><input type="email" id="f-email"></div>
          <div class="form-field form-field-full"><label>Endereco</label><input type="text" id="f-endereco"></div>
          <div class="form-field"><label>Cidade</label><input type="text" id="f-cidade"></div>
          <div class="form-field"><label>UF</label><input type="text" id="f-uf" maxlength="2" style="text-transform:uppercase"></div>
          <div class="form-field form-field-full"><label>Observacao</label><textarea id="f-obs" rows="2"></textarea></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeFModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="document.getElementById('form-f').requestSubmit()">Salvar</button>
    </div>
  </div>
</div>

<script>
let _forns = [];
let _ft = ''; let _ftipo = ''; let _fativo = 'true';

PageBootstrap.init({
  page: 'fornecedores',
  title: 'Fornecedores',
  breadcrumb: 'Cadastros / Fornecedores',
  perfisPermitidos: ['admin','gestor','almoxarife'],
  loadData: async () => API.get('trans_fornecedores?order=razao_social'),
  render: (res, user) => {
    _forns = res.ok ? res.data : [];
    renderHeader(user); renderFilters(); renderTable();
  }
});

function renderHeader(user) {
  const canCreate = ['admin','gestor','almoxarife'].includes(user.perfil);
  document.getElementById('header-area').innerHTML = UI.pageHeader({
    title: 'Fornecedores',
    subtitle: 'Pecas, pneus, recapadoras, postos e oficinas. CNPJ unico.',
    actions: canCreate ? [{ label: 'Novo fornecedor', class: 'btn-primary', onclick: 'openFModal()' }] : []
  });
}

function renderFilters() {
  document.getElementById('filters-area').innerHTML = UI.filterBar({
    filters: [
      { id: 'flt-texto', label: 'Buscar', type: 'text', placeholder: 'Razao ou CNPJ', value: _ft },
      { id: 'flt-tipo', label: 'Tipo', type: 'select', value: _ftipo, options: [
        { value: '', label: 'Todos' }, { value: 'peca', label: 'Peca' },
        { value: 'pneu', label: 'Pneu' }, { value: 'recapadora', label: 'Recapadora' },
        { value: 'posto', label: 'Posto' }, { value: 'oficina', label: 'Oficina' },
        { value: 'outro', label: 'Outro' }
      ]},
      { id: 'flt-ativo', label: 'Status', type: 'select', value: _fativo, options: [
        { value: 'true', label: 'Ativos' }, { value: 'false', label: 'Inativos' }, { value: '', label: 'Todos' }
      ]}
    ],
    onApply: 'aplicarFiltros()',
    onClear: 'limparFiltros()'
  });
}

function aplicarFiltros() {
  _ft = document.getElementById('flt-texto').value.trim().toLowerCase();
  _ftipo = document.getElementById('flt-tipo').value;
  _fativo = document.getElementById('flt-ativo').value;
  renderTable();
}
function limparFiltros() { _ft = ''; _ftipo = ''; _fativo = ''; renderFilters(); renderTable(); }

function renderTable() {
  const filtrados = _forns.filter(f => {
    if (_ftipo && f.tipo !== _ftipo) return false;
    if (_fativo !== '' && String(f.ativo) !== _fativo) return false;
    if (_ft) {
      const hay = `${f.razao_social} ${f.cnpj || ''} ${f.nome_fantasia || ''}`.toLowerCase();
      if (!hay.includes(_ft)) return false;
    }
    return true;
  });

  document.getElementById('table-area').innerHTML = UI.dataTable({
    columns: [
      { key: 'razao', label: 'Razao social', render: f => `<strong>${API.esc(f.razao_social)}</strong>${f.nome_fantasia ? `<br><span class="text-muted" style="font-size:12px">${API.esc(f.nome_fantasia)}</span>` : ''}` },
      { key: 'cnpj', label: 'CNPJ', render: f => API.esc(f.cnpj ? API.fmtCNPJ(f.cnpj) : '&mdash;') },
      { key: 'tipo', label: 'Tipo', render: f => `<span class="badge badge-default">${API.esc(f.tipo)}</span>` },
      { key: 'cidade', label: 'Cidade/UF', render: f => API.esc([f.cidade, f.uf].filter(Boolean).join('/') || '&mdash;') },
      { key: 'telefone', label: 'Telefone', render: f => API.esc(f.telefone || '&mdash;') },
      { key: 'status', label: 'Status', render: f => UI.statusBadge(f.ativo ? 'ativo' : 'inativo', f.ativo ? 'ativo' : 'muted') },
      { key: 'acoes', label: '', render: f => `<button class="btn btn-ghost btn-sm" onclick="openFModal('${f.id}')">Editar</button>` }
    ],
    rows: filtrados,
    emptyMsg: 'Nenhum fornecedor cadastrado.'
  });
}

function openFModal(id) {
  document.getElementById('modal-title').textContent = id ? 'Editar fornecedor' : 'Novo fornecedor';
  document.getElementById('f-id').value = id || '';
  document.getElementById('modal-f').style.display = 'flex';
  if (id) {
    const f = _forns.find(x => x.id === id);
    if (f) {
      document.getElementById('f-razao').value = f.razao_social || '';
      document.getElementById('f-fantasia').value = f.nome_fantasia || '';
      document.getElementById('f-cnpj').value = f.cnpj || '';
      document.getElementById('f-tipo').value = f.tipo || 'peca';
      document.getElementById('f-ativo').value = String(f.ativo);
      document.getElementById('f-contato').value = f.contato || '';
      document.getElementById('f-telefone').value = f.telefone || '';
      document.getElementById('f-email').value = f.email || '';
      document.getElementById('f-endereco').value = f.endereco || '';
      document.getElementById('f-cidade').value = f.cidade || '';
      document.getElementById('f-uf').value = f.uf || '';
      document.getElementById('f-obs').value = f.observacao || '';
    }
  } else {
    document.getElementById('form-f').reset();
    document.getElementById('f-ativo').value = 'true';
    document.getElementById('f-tipo').value = 'peca';
  }
}

function closeFModal() { document.getElementById('modal-f').style.display = 'none'; }

async function saveF(e) {
  e.preventDefault();
  const id = document.getElementById('f-id').value;
  const cnpjRaw = document.getElementById('f-cnpj').value.replace(/\D/g, '');
  const payload = {
    razao_social: document.getElementById('f-razao').value.trim(),
    nome_fantasia: document.getElementById('f-fantasia').value.trim() || null,
    cnpj: cnpjRaw || null,
    tipo: document.getElementById('f-tipo').value,
    ativo: document.getElementById('f-ativo').value === 'true',
    contato: document.getElementById('f-contato').value.trim() || null,
    telefone: document.getElementById('f-telefone').value.trim() || null,
    email: document.getElementById('f-email').value.trim() || null,
    endereco: document.getElementById('f-endereco').value.trim() || null,
    cidade: document.getElementById('f-cidade').value.trim() || null,
    uf: document.getElementById('f-uf').value.trim().toUpperCase() || null,
    observacao: document.getElementById('f-obs').value.trim() || null
  };
  let res;
  if (id) res = await API.patch(`trans_fornecedores?id=eq.${id}`, payload);
  else res = await API.post('trans_fornecedores', payload);
  if (!res.ok) { UI.toast(res.error || 'Erro ao salvar', 'erro'); return; }
  UI.toast(id ? 'Fornecedor atualizado' : 'Fornecedor criado', 'ok');
  closeFModal();
  const reload = await API.get('trans_fornecedores?order=razao_social');
  _forns = reload.ok ? reload.data : [];
  renderTable();
}
</script>
</body>
</html>
