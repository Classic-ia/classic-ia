<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Home — Trans Anacleto Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="m.css">
<script src="../config.js"></script>
<script src="../auth.js"></script>
<script src="../api.js"></script>
<script src="m_shell.js"></script>
</head>
<body>
<div class="m-app">
  <div id="m-shell"></div>
  <main class="m-main">
    <div class="m-card">
      <div class="m-card-title" id="saudacao">Ola</div>
      <div class="m-card-subtitle" id="perfil-info">Carregando...</div>
    </div>

    <div class="m-card">
      <div class="m-card-title">Pneus</div>
      <a href="m_pneus_scan.html" class="m-btn m-btn-primary">Ler pneu (scan)</a>
      <a href="m_pneus_inventario.html" class="m-btn m-btn-outline">Inventario por localizacao</a>
    </div>

    <div class="m-card">
      <div class="m-card-title">Estoque</div>
      <a href="m_estoque_scan.html" class="m-btn m-btn-outline">Saida rapida (EAN)</a>
    </div>

    <div class="m-card">
      <div class="m-card-title">Manutencao</div>
      <a href="m_manutencao_buscar.html" class="m-btn m-btn-outline">Buscar veiculo</a>
    </div>

    <div class="m-card">
      <div class="m-card-title">Abastecimento</div>
      <a href="m_abastecimento.html" class="m-btn m-btn-outline">Registrar abastecimento</a>
    </div>
  </main>
</div>

<script>
(async function init() {
  const user = await MShell.init();
  if (!user) return;
  MShell.render({ title: 'Trans Anacleto', currentNav: 'home' });
  const h = new Date().getHours();
  const saud = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  document.getElementById('saudacao').textContent = `${saud}, ${user.nome || 'usuario'}!`;
  document.getElementById('perfil-info').textContent = `Perfil: ${user.perfil || '-'}`;
})();
</script>
</body>
</html>
