<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - Classic RH &amp; SST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds.css">
<script src="config.js"></script>
<script src="rh_auth.js"></script>
</head>
<body class="auth-page">

<main class="auth-card" role="main">

  <div class="auth-brand">
    <div class="auth-brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 00-3-3.87"/>
        <path d="M16 3.13a4 4 0 010 7.75"/>
      </svg>
    </div>
    <div class="auth-brand-title">Classic RH &amp; SST</div>
    <div class="auth-brand-subtitle">Gestao de Pessoas e Seguranca do Trabalho</div>
  </div>

  <form class="auth-form" id="form-login" onsubmit="doLogin(event)" novalidate>

    <div class="form-group">
      <label class="form-label" for="f-email">E-mail corporativo</label>
      <input class="form-input" type="email" id="f-email"
             placeholder="seu.email@classiccouros.com.br"
             required autocomplete="email" autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="f-senha">Senha</label>
      <input class="form-input" type="password" id="f-senha"
             placeholder="Sua senha"
             required autocomplete="current-password">
    </div>

    <div class="auth-alert" id="auth-error" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="auth-error-msg">Credenciais invalidas</span>
    </div>

    <button class="btn btn-primary" type="submit" id="btn-login">
      <span id="btn-label">Entrar</span>
    </button>

  </form>

  <div class="auth-footer">
    Classic Importacao e Exportacao de Couros Ltda &middot; v2026.03
  </div>

</main>

<script>
async function doLogin(e) {
  e.preventDefault();
  const btn     = document.getElementById('btn-login');
  const label   = document.getElementById('btn-label');
  const alertEl = document.getElementById('auth-error');
  const alertMsg= document.getElementById('auth-error-msg');

  alertEl.classList.remove('visible');
  btn.disabled = true;
  label.textContent = 'Autenticando...';

  try {
    const email = document.getElementById('f-email').value.trim();
    const senha = document.getElementById('f-senha').value;
    await RHAuth.login(email, senha);
    window.location.href = 'hub.html';
  } catch (err) {
    alertMsg.textContent = err.message || 'Credenciais invalidas';
    alertEl.classList.add('visible');
    btn.disabled = false;
    label.textContent = 'Entrar';
  }
}
</script>

</body>
</html>
