<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic RH - Beneficios</title>
  <link rel="stylesheet" href="ds.css">
  <script src="config.js"></script>
  <script src="rh_auth.js"></script>
  <script src="api.js"></script>
  <script src="shell.js"></script>
  <script src="ui_components.js"></script>
  <script src="page_bootstrap.js"></script>
</head>
<body class="page-bg">
  <div id="shell"></div>
  <div id="shell-content" class="content-area page-padding">
    <div id="page-root"></div>
  </div>
  <div id="modals"></div>
  <script>
  (async () => {
    const user = await Shell.init({page:'beneficios', title:'Beneficios'});
    if (!user) return;

    const isReadOnly = user.perfil === 'visualizador';
    const $root = document.getElementById('page-root');
    const $modals = document.getElementById('modals');

    // ── State ──────────────────────────────────────────────
    let colaboradores = [];
    let vaMap = {};
    let deslocMap = {};
    let aliancaMap = {};
    let cidadesRef = [];
    let cidadeValorMap = {};
    let currentColab = null;
    let modalState = {};
    let searchTimeout;

    // ── Helpers ────────────────────────────────────────────
    function fmt(v) {
      return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function arrayToMap(arr, key) {
      const m = {};
      arr.forEach(r => { m[r[key]] = r; });
      return m;
    }

    const cidadesComTransporte = ['Ivaipora', 'Ivaiporã', 'São João do Ivaí', 'Sao Joao do Ivai',
      'São Pedro do Ivaí', 'Sao Pedro do Ivai', 'Lunardelli'];

    function normStr(s) {
      return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }

    function cidadeTemTransporte(cidade) {
      if (!cidade) return false;
      const n = normStr(cidade);
      return cidadesComTransporte.some(c => normStr(c) === n);
    }

    function findCidadeValor(cidade) {
      if (!cidade) return null;
      const n = normStr(cidade);
      for (const [c, v] of Object.entries(cidadeValorMap)) {
        if (normStr(c) === n) return v;
      }
      return null;
    }

    // ── Page Header + Actions ──────────────────────────────
    function renderPageHeader() {
      const actions = isReadOnly ? [] : [
        { label: 'Ativar VA para todos', class: 'btn-primary', onclick: 'window._bulkVA()' },
        { label: 'Auto-config deslocamento', class: 'btn-outline', onclick: 'window._bulkDesloc()' },
      ];
      return UI.pageHeader({
        title: 'Gestao de Beneficios',
        subtitle: 'VA, Auxilio Deslocamento, Premio Assiduidade, Plano Alianca',
        actions,
      });
    }

    // ── KPIs ───────────────────────────────────────────────
    function buildKPIs() {
      let countVA = 0, countDesloc = 0, countAlianca = 0, custo = 0;
      colaboradores.forEach(c => {
        const va = vaMap[c.id];
        if (va && va.ativo) { countVA++; custo += Number(va.valor_mensal || 300); }
        const dl = deslocMap[c.id];
        if (dl && dl.ativo) { countDesloc++; custo += Number(dl.valor_mensal || 0); }
        const al = aliancaMap[c.id];
        if (al && al.ativo) { countAlianca++; }
        custo += 150;
      });
      return UI.kpiGrid([
        { value: countVA, label: 'Com Vale Alimentacao', color: '#2563EB' },
        { value: countDesloc, label: 'Com Aux. Deslocamento', color: '#0891B2' },
        { value: countAlianca, label: 'Com Plano Alianca', color: '#059669' },
        { value: fmt(custo), label: 'Custo Mensal Estimado', color: '#D97706' },
      ]);
    }

    // ── Filter Bar ─────────────────────────────────────────
    function buildFilterBar() {
      return UI.filterBar({
        id: 'filterBar',
        filters: [
          { type: 'text', id: 'f-busca', label: 'Buscar', placeholder: 'Nome do colaborador...' },
        ],
        onApply: 'window._applyFilter()',
        onClear: 'window._clearFilter()',
      });
    }

    // ── Data Table ─────────────────────────────────────────
    function buildTable(filter) {
      const term = (filter || '').toLowerCase().trim();
      const filtered = term
        ? colaboradores.filter(c => c.nome.toLowerCase().includes(term))
        : colaboradores;

      return UI.dataTable({
        columns: [
          { key: 'nome', label: 'Nome', render: r => `<strong>${API.esc(r.nome)}</strong>` },
          { key: 'cidade', label: 'Cidade', render: r => API.esc(r.cidade || '-') },
          { key: 'va', label: 'VA', render: r => {
            const va = vaMap[r.id];
            return (va && va.ativo) ? UI.statusBadge('Sim', 'ativo') : UI.statusBadge('Nao', 'inativo');
          }},
          { key: 'deslocamento', label: 'Deslocamento', render: r => {
            const dl = deslocMap[r.id];
            return (dl && dl.ativo) ? UI.badge(fmt(dl.valor_mensal), '#D97706') : UI.statusBadge('N/A', 'inativo');
          }},
          { key: 'alianca', label: 'Alianca', render: r => {
            const al = aliancaMap[r.id];
            return (al && al.ativo) ? UI.statusBadge('Sim', 'ativo') : UI.statusBadge('Nao', 'inativo');
          }},
        ],
        rows: filtered,
        emptyMsg: 'Nenhum colaborador encontrado',
        onRowClick: 'window._openDetail',
      });
    }

    // ── Full Render ────────────────────────────────────────
    function renderAll(filter) {
      $root.innerHTML =
        renderPageHeader() +
        buildKPIs() +
        buildFilterBar() +
        buildTable(filter);

      // Restore filter value
      const $busca = document.getElementById('f-busca');
      if ($busca && filter) $busca.value = filter;
      if ($busca) {
        $busca.addEventListener('input', () => {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(() => renderAll($busca.value), 200);
        });
      }
    }

    // ── Load Data ──────────────────────────────────────────
    async function loadAll() {
      $root.innerHTML = UI.loadingCenter('Carregando beneficios...');
      try {
        const [rColabs, rVas, rDeslocs, rAliancas, rCidades] = await Promise.all([
          API.get('rh_colaboradores?status=eq.ativo&order=nome.asc&select=id,nome,cpf,cargo,cidade,salario_base,turno'),
          API.get('rh_vale_alimentacao?select=*'),
          API.get('rh_auxilio_deslocamento?select=*'),
          API.get('rh_plano_alianca?select=*'),
          API.get('rh_deslocamento_cidades?ativo=eq.true&select=*'),
        ]);
        colaboradores = rColabs.ok ? rColabs.data : [];
        vaMap = arrayToMap(rVas.ok ? rVas.data : [], 'colaborador_id');
        deslocMap = arrayToMap(rDeslocs.ok ? rDeslocs.data : [], 'colaborador_id');
        aliancaMap = arrayToMap(rAliancas.ok ? rAliancas.data : [], 'colaborador_id');
        cidadesRef = rCidades.ok ? rCidades.data : [];
        cidadeValorMap = {};
        cidadesRef.forEach(c => { cidadeValorMap[c.cidade] = c.valor; });
        renderAll();
      } catch (e) {
        console.error('loadAll:', e);
        UI.toast('Erro ao carregar dados', 'err');
      }
    }

    // ── Detail Modal ───────────────────────────────────────
    window._openDetail = function(idx) {
      const filtered = getCurrentFiltered();
      currentColab = filtered[idx];
      if (!currentColab) return;

      const id = currentColab.id;
      const va = vaMap[id] || {};
      const dl = deslocMap[id] || {};
      const al = aliancaMap[id] || {};

      const salario = Number(currentColab.salario_base || 0);
      const vaValor = Number(va.valor_mensal || 300);
      const vaDesconto = salario * (Number(va.percentual_desconto || 8) / 100);
      const dlValorCidade = findCidadeValor(currentColab.cidade);
      const dlValor = Number(dl.valor_mensal || dlValorCidade || 0);
      const temTransporte = cidadeTemTransporte(currentColab.cidade);

      modalState = {
        va_ativo: !!va.ativo,
        dl_ativo: !!dl.ativo,
        dl_cidade: dl.cidade_origem || currentColab.cidade || '',
        dl_valor: dlValor,
        dl_usa_transporte: !!dl.usa_transporte_empresa,
        al_ativo: !!al.ativo,
      };

      const bodyHtml = `
        <p style="margin-bottom:16px;color:var(--text-secondary);font-size:13px;">
          ${API.esc(currentColab.cargo || 'Sem cargo')} | ${API.esc(currentColab.cidade || 'Sem cidade')} | Salario: ${fmt(salario)}
        </p>

        ${UI.card('Vale Alimentacao (VA)', `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span>Status</span>
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
              <input type="checkbox" id="chk-va" ${modalState.va_ativo ? 'checked' : ''}>
              <span id="lbl-va">${modalState.va_ativo ? 'Ativo' : 'Inativo'}</span>
            </label>
          </div>
          <div style="font-size:13px;color:var(--text-secondary);line-height:1.8;">
            Valor mensal: <strong>${fmt(vaValor)}</strong><br>
            Desconto (8% do salario): <strong>${fmt(vaDesconto)}</strong><br>
            Liquido colaborador: <strong>${fmt(vaValor - vaDesconto)}</strong><br>
            <small>Proporcional a dias trabalhados. Perde 100% com 15+ faltas. Nao recebe em ferias.</small>
          </div>
        `)}

        ${UI.card('Auxilio Deslocamento', `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span>Status</span>
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
              <input type="checkbox" id="chk-dl" ${modalState.dl_ativo ? 'checked' : ''}>
              <span id="lbl-dl">${modalState.dl_ativo ? 'Ativo' : 'Inativo'}</span>
            </label>
          </div>
          <div style="margin-bottom:8px;">
            <label style="font-size:12px;color:var(--text-secondary);">Cidade origem:</label>
            <select id="sel-cidade" style="width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-top:4px;font-size:13px;">
              <option value="">-- Selecionar --</option>
              ${cidadesRef.map(c =>
                `<option value="${c.cidade}" ${c.cidade === modalState.dl_cidade ? 'selected' : ''}>${c.cidade} - ${fmt(c.valor)}</option>`
              ).join('')}
            </select>
          </div>
          <div style="font-size:13px;color:var(--text-secondary);">
            Valor mensal: <strong id="desloc-valor">${fmt(modalState.dl_valor)}</strong>
          </div>
          ${temTransporte ? `
          <label style="display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer;font-size:12px;color:var(--text-secondary);">
            <input type="checkbox" id="chk-transporte" ${modalState.dl_usa_transporte ? 'checked' : ''}>
            Usa transporte da empresa (08h-17h)
          </label>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">
            Se trabalha fora do horario 08h-17h, ainda recebe o auxilio.
          </div>
          ` : `
          <div style="font-size:11px;color:var(--text-muted);margin-top:8px;">
            Cidade sem transporte empresa disponivel.
          </div>
          `}
          <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">
            Suspenso em: ferias, afastamento INSS >15d, licenca maternidade, >2 faltas injustificadas.
          </div>
        `)}

        ${UI.card('Premio Assiduidade', `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span>Valor fixo</span>
            ${UI.badge('R$ 150,00/mes', '#D97706')}
          </div>
          <div style="font-size:12px;color:var(--text-secondary);line-height:1.7;">
            Elegibilidade calculada automaticamente na apuracao mensal.<br>
            Perde se: falta injustificada, >3 atrasos >10min, saida antecipada nao autorizada, advertencia/suspensao, >3 dias atestado.<br>
            Proporcional para: admissao, desligamento, afastamento INSS.
          </div>
        `)}

        ${UI.card('Plano Alianca', `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span>Status</span>
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
              <input type="checkbox" id="chk-al" ${modalState.al_ativo ? 'checked' : ''}>
              <span id="lbl-al">${modalState.al_ativo ? 'Ativo' : 'Inativo'}</span>
            </label>
          </div>
          <div style="font-size:13px;color:var(--text-secondary);line-height:1.7;">
            100% custeado pela empresa. Opcional. Sem dependentes. Todos CLT elegiveis.<br>
            ${al.data_adesao ? 'Data adesao: <strong>' + al.data_adesao + '</strong>' : 'Sem adesao registrada'}
          </div>
        `)}
      `;

      const footerHtml = isReadOnly ? '' :
        `<button class="btn btn-outline" onclick="UI.closeModal('modal-detail')">Cancelar</button>
         <button class="btn btn-primary" onclick="window._saveDetail()">Salvar Alteracoes</button>`;

      $modals.innerHTML = UI.modal('modal-detail', API.esc(currentColab.nome), bodyHtml, footerHtml);
      UI.openModal('modal-detail');

      // Bind toggle checkboxes
      bindCheckToggle('chk-va', 'lbl-va', 'va_ativo');
      bindCheckToggle('chk-dl', 'lbl-dl', 'dl_ativo');
      bindCheckToggle('chk-al', 'lbl-al', 'al_ativo');

      // City select
      const $selCidade = document.getElementById('sel-cidade');
      if ($selCidade) {
        $selCidade.addEventListener('change', () => {
          modalState.dl_cidade = $selCidade.value;
          const ref = cidadesRef.find(c => c.cidade === $selCidade.value);
          modalState.dl_valor = ref ? Number(ref.valor) : 0;
          const $v = document.getElementById('desloc-valor');
          if ($v) $v.textContent = fmt(modalState.dl_valor);
        });
      }

      // Transport checkbox
      const $chkT = document.getElementById('chk-transporte');
      if ($chkT) {
        $chkT.addEventListener('change', () => { modalState.dl_usa_transporte = $chkT.checked; });
      }

      // Read-only lockdown
      if (isReadOnly) {
        $modals.querySelectorAll('input, select').forEach(el => {
          el.disabled = true;
          el.style.opacity = '0.5';
        });
      }
    };

    function bindCheckToggle(chkId, lblId, stateKey) {
      const chk = document.getElementById(chkId);
      const lbl = document.getElementById(lblId);
      if (!chk) return;
      chk.addEventListener('change', () => {
        if (isReadOnly) return;
        modalState[stateKey] = chk.checked;
        if (lbl) lbl.textContent = chk.checked ? 'Ativo' : 'Inativo';
      });
    }

    function getCurrentFiltered() {
      const $busca = document.getElementById('f-busca');
      const term = ($busca ? $busca.value : '').toLowerCase().trim();
      return term ? colaboradores.filter(c => c.nome.toLowerCase().includes(term)) : colaboradores;
    }

    // ── Save Detail ────────────────────────────────────────
    window._saveDetail = async function() {
      if (!currentColab || isReadOnly) return;
      const id = currentColab.id;
      try {
        // VA
        const existingVA = vaMap[id];
        if (existingVA) {
          await API.patch(`rh_vale_alimentacao?colaborador_id=eq.${id}`, {
            ativo: modalState.va_ativo,
            atualizado_em: new Date().toISOString(),
          });
        } else if (modalState.va_ativo) {
          await API.post('rh_vale_alimentacao', {
            colaborador_id: id, ativo: true, valor_mensal: 300.00, percentual_desconto: 8.00,
          }, 'return=minimal');
        }

        // Deslocamento
        const existingDL = deslocMap[id];
        if (existingDL) {
          await API.patch(`rh_auxilio_deslocamento?colaborador_id=eq.${id}`, {
            ativo: modalState.dl_ativo,
            cidade_origem: modalState.dl_cidade || currentColab.cidade || '',
            valor_mensal: modalState.dl_valor,
            usa_transporte_empresa: modalState.dl_usa_transporte,
            atualizado_em: new Date().toISOString(),
          });
        } else if (modalState.dl_ativo && modalState.dl_cidade) {
          await API.post('rh_auxilio_deslocamento', {
            colaborador_id: id, ativo: true,
            cidade_origem: modalState.dl_cidade,
            valor_mensal: modalState.dl_valor,
            usa_transporte_empresa: modalState.dl_usa_transporte,
          }, 'return=minimal');
        }

        // Alianca
        const existingAL = aliancaMap[id];
        if (existingAL) {
          await API.patch(`rh_plano_alianca?colaborador_id=eq.${id}`, {
            ativo: modalState.al_ativo,
            atualizado_em: new Date().toISOString(),
          });
        } else if (modalState.al_ativo) {
          await API.post('rh_plano_alianca', {
            colaborador_id: id, ativo: true,
            data_adesao: new Date().toISOString().slice(0, 10),
          }, 'return=minimal');
        }

        await RHAuth.log('beneficio_atualizado', {
          colaborador_id: id, colaborador_nome: currentColab.nome,
          va: modalState.va_ativo, deslocamento: modalState.dl_ativo, alianca: modalState.al_ativo,
        });

        UI.toast('Beneficios atualizados com sucesso', 'ok');
        UI.closeModal('modal-detail');
        await loadAll();
      } catch (e) {
        console.error('save:', e);
        UI.toast('Erro ao salvar: ' + e.message, 'err');
      }
    };

    // ── Bulk: Ativar VA para todos ─────────────────────────
    window._bulkVA = async function() {
      if (isReadOnly) { UI.toast('Sem permissao para esta acao', 'err'); return; }
      UI.confirmDialog({
        title: 'Ativar VA em lote',
        message: 'Criar/ativar Vale Alimentacao para todos os colaboradores ativos que ainda nao possuem registro?',
        confirmLabel: 'Ativar',
        onConfirm: async () => {
          let created = 0, activated = 0;
          try {
            for (const c of colaboradores) {
              const existing = vaMap[c.id];
              if (!existing) {
                await API.post('rh_vale_alimentacao', {
                  colaborador_id: c.id, ativo: true, valor_mensal: 300.00, percentual_desconto: 8.00,
                }, 'return=minimal');
                created++;
              } else if (!existing.ativo) {
                await API.patch(`rh_vale_alimentacao?colaborador_id=eq.${c.id}`, {
                  ativo: true, atualizado_em: new Date().toISOString(),
                });
                activated++;
              }
            }
            await RHAuth.log('bulk_ativar_va', { created, activated, total: colaboradores.length });
            UI.toast(`VA: ${created} criados, ${activated} reativados`, 'ok');
            await loadAll();
          } catch (e) {
            console.error('bulk VA:', e);
            UI.toast('Erro na operacao em lote: ' + e.message, 'err');
          }
        },
      });
    };

    // ── Bulk: Auto-configurar deslocamento ─────────────────
    window._bulkDesloc = async function() {
      if (isReadOnly) { UI.toast('Sem permissao para esta acao', 'err'); return; }
      UI.confirmDialog({
        title: 'Auto-configurar deslocamento',
        message: 'Configurar auxilio deslocamento automaticamente para todos os colaboradores ativos com base na cidade cadastrada?',
        confirmLabel: 'Configurar',
        onConfirm: async () => {
          let created = 0, updated = 0, skipped = 0;
          try {
            for (const c of colaboradores) {
              const valor = findCidadeValor(c.cidade);
              if (!valor) { skipped++; continue; }
              const existing = deslocMap[c.id];
              if (!existing) {
                await API.post('rh_auxilio_deslocamento', {
                  colaborador_id: c.id, ativo: true,
                  cidade_origem: c.cidade, valor_mensal: valor,
                  usa_transporte_empresa: false,
                }, 'return=minimal');
                created++;
              } else {
                await API.patch(`rh_auxilio_deslocamento?colaborador_id=eq.${c.id}`, {
                  ativo: true, cidade_origem: c.cidade, valor_mensal: valor,
                  atualizado_em: new Date().toISOString(),
                });
                updated++;
              }
            }
            await RHAuth.log('bulk_auto_deslocamento', { created, updated, skipped, total: colaboradores.length });
            UI.toast(`Deslocamento: ${created} criados, ${updated} atualizados, ${skipped} sem cidade`, 'ok');
            await loadAll();
          } catch (e) {
            console.error('bulk desloc:', e);
            UI.toast('Erro na operacao em lote: ' + e.message, 'err');
          }
        },
      });
    };

    // ── Filter actions ─────────────────────────────────────
    window._applyFilter = function() {
      const v = document.getElementById('f-busca')?.value || '';
      renderAll(v);
    };

    window._clearFilter = function() {
      renderAll();
    };

    // ── Init ───────────────────────────────────────────────
    await loadAll();
  })();
  </script>
</body>
</html>
