<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#D97706">
<title>Login - JR Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<script src="../auth.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { font-family:'Inter',system-ui,sans-serif; background:#F1F5F9; min-height:100vh; }
body { display:flex; align-items:center; justify-content:center; padding:24px; }
.card { background:#fff; border-radius:18px; box-shadow:0 6px 28px rgba(0,0,0,0.08); padding:32px 24px; width:100%; max-width:420px; }
.logo { text-align:center; margin-bottom:24px; }
.logo-icon { width:60px; height:60px; border-radius:14px; background:#D97706; color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
.logo h1 { font-size:19px; font-weight:700; color:#0F172A; }
.logo p { font-size:12px; color:#64748B; margin-top:3px; }
.fld { margin-bottom:14px; }
.fld label { display:block; font-size:12px; font-weight:600; color:#334155; margin-bottom:6px; }
.fld input { width:100%; padding:13px 14px; font-size:16px; font-family:inherit; border:1px solid #E2E8F0; border-radius:10px; background:#F8FAFC; color:#0F172A; }
.fld input:focus { outline:none; border-color:#D97706; box-shadow:0 0 0 3px rgba(217,119,6,0.15); background:#fff; }
.btn { width:100%; padding:14px; background:#D97706; color:#fff; border:none; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer; font-family:inherit; }
.btn:disabled { background:#CBD5E1; }
.erro { display:none; margin-top:12px; padding:11px 14px; background:#FEE2E2; color:#991B1B; border-radius:8px; font-size:13px; text-align:center; }
.desk-link { text-align:center; margin-top:16px; font-size:12px; }
.desk-link a { color:#D97706; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <h1>JR Terraplanagem</h1>
    <p>Mobile - Operacao de Campo</p>
  </div>
  <form onsubmit="doLogin(event)">
    <div class="fld">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
    </div>
    <div class="fld">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="********" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="btn">Entrar</button>
  </form>
  <div class="erro" id="erro"></div>
  <div class="desk-link"><a href="../login.html">Acessar versao desktop &rarr;</a></div>
</div>
<script>
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const erro = document.getElementById('erro');
  erro.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Autenticando...';
  try {
    await JrAuth.login(document.getElementById('email').value.trim(), document.getElementById('senha').value);
    window.location.href = 'm_home.html';
  } catch(err) {
    erro.textContent = err.message;
    erro.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
